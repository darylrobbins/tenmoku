experimental = ["setup-scripts"]

# Keep nextest's store in the workspace even when CARGO_TARGET_DIR points elsewhere,
# so Regatta finds the JUnit report at target/nextest/ci/junit.xml.
[store]
dir = "target/nextest"

[profile.ci]
fail-fast = false
# The slow set runs after merge only (post_merge's test_all stage passes
# --ignore-default-filter). List from the 2026-10-21 gate run
# 01m5fxp99b1bhcpxe072zx1n1d (tests over 30 s; the fe-vim names are the
# run's report names). T380 (the Linux gate's test stage no longer finished)
# added the fe-vim tests below the first three fe-vim ones, each over 10 s
# alone in a debug build after its fixture was sized down, for the reason in
# docs/decisions/*-fe-vim-long-row-tests.md (with every before and after
# time): a window's edge is 16 KiB out and a visual or counted key walks all
# of it (visual_counted_l, the two grapheme tests, columns_far_along,
# sentence_objects), the 100 MB row is the claim (keys_from_the_middle), and
# the put cap is 64 MiB written (regional caps, the two replay tests).
# Add a test here in the task that adds it; see TESTING.md.
default-filter = '''
not (
  (package(fe-workbench) and test(=tests::m3_signoff::a_100k_file_project_end_to_end))
  or (package(fe-project) and test(=tests::finder::a_100k_file_index_bounds_query_work))
  or (package(fe-project) and test(=tests::large::a_100k_file_tree_loads_lazily))
  or (package(fe-editor) and test(=a_new_file_saves_on_an_exfat_volume))
  or (package(fe-vim) and test(=counted_replace_of_regional_indicators_stays_bounded))
  or (package(fe-vim) and test(=huge_virtual_counts_stay_bounded))
  or (package(fe-vim) and test(=a_huge_virtual_count_stays_bounded))
  or (package(fe-vim) and test(=a_visual_counted_l_goes_over_the_windows_edge))
  or (package(fe-vim) and test(=columns_far_along_a_huge_row_are_the_rows_own))
  or (package(fe-vim) and test(=graphemes_joining_across_the_windows_edge_stay_whole))
  or (package(fe-vim) and test(=graphemes_joining_across_the_windows_left_edge_stay_whole))
  or (package(fe-vim) and test(=sentence_objects_and_motions_go_over_the_windows_edge))
  or (package(fe-vim) and test(=keys_from_the_middle_of_a_100_mb_row_land_as_on_a_short_row))
  or (package(fe-vim) and test(=counted_replace_of_regional_indicators_caps_at_max_put))
  or (package(fe-vim) and test(=insert::keys::tests::counted_replay_of_an_oversized_register_is_refused))
  or (package(fe-vim) and test(=insert::keys::tests::dot_replay_of_an_oversized_register_is_refused))
)
'''

[profile.ci.junit]
path = "junit.xml"

# These six tests use the real FSEvents, which under load can deliver late or
# not at all, and no timeout bounds that. A pass after a retry is reported
# FLAKY in the JUnit report.
[[profile.ci.overrides]]
filter = '''
(package(fe-config) and (test(=tests::watch::hot_reload_applies_valid_and_keeps_last_good)
  or test(=tests::watch::symlink_targets_are_watched)))
or (package(kiln-core) and (test(=tests::watch::watcher_follows_links_changed_while_registering)
  or test(=tests::watch_late::late_user_event_does_not_hide_project_edit)))
or (package(fe-project) and test(=tests::watcher::watcher_batches_create_rename_delete))
or (package(kiln-platform) and test(=the_watcher_reloads_settings_saved_on_disk))
'''
retries = 2

# Writing 100k files floods FSEvents, and while it does FSEvents drops a burst
# of events with no drop or rescan flag (T331's probe lost 27 sentinels in a
# row), so a test waiting on delivery can't pass, and the FSEvents tests'
# control can't tell that loss from a watcher failure. One test at a time in
# this group keeps every flood apart from every delivery wait in a run: the
# real-FSEvents tests of fe-project, fe-config, kiln-core and kiln-platform,
# and each test that writes 10k or more files.
[test-groups.fsevents]
max-threads = 1

[[profile.default.overrides]]
filter = '''
(package(fe-project) and (test(/^tests::watcher::/)
  or test(=tests::large::a_100k_file_tree_loads_lazily)
  or test(=tests::finder::a_100k_file_index_bounds_query_work)))
or (package(fe-config) and test(/^tests::watch::/))
or (package(kiln-core) and (test(/^tests::watch::/) or test(/^tests::watch_late::/)))
or (package(kiln-platform) and test(=the_watcher_reloads_settings_saved_on_disk))
or (package(fe-workbench) and (test(=tests::m3_signoff::a_100k_file_project_end_to_end)
  or test(=tests::project_panel::only_visible_rows_are_built)))
'''
test-group = "fsevents"

# Every run gets its own Tenmoku state and config dirs (T1664): tests used to
# write the user's real ~/.local/state/tenmoku. Both profiles run the script.
[scripts.setup.isolate-state]
command = ["bash", "scripts/nextest-isolate-state.sh"]

[[profile.default.scripts]]
filter = 'all()'
setup = 'isolate-state'

[[profile.ci.scripts]]
filter = 'all()'
setup = 'isolate-state'
