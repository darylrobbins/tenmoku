# Keep nextest's store in the workspace even when CARGO_TARGET_DIR points elsewhere,
# so Regatta finds the JUnit report at target/nextest/ci/junit.xml.
[store]
dir = "target/nextest"

[profile.ci]
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

# These six tests use the real FSEvents, which under load can deliver late or
# not at all, and no timeout bounds that. A pass after a retry is reported
# FLAKY in the JUnit report.
[[profile.ci.overrides]]
filter = '''
(package(fe-config) and (test(=tests::watch::hot_reload_applies_valid_and_keeps_last_good)
  or test(=tests::watch::symlink_targets_are_watched)))
or (package(kiln-core) and (test(=tests::watch::watcher_follows_links_changed_while_registering)
  or test(=tests::watch_late::late_user_event_does_not_hide_project_edit)))
or (package(fe-project) and test(=tests::watcher::watcher_batches_create_rename_delete))
or (package(kiln-platform) and test(=the_watcher_reloads_settings_saved_on_disk))
'''
retries = 2

# Writing 100k files floods FSEvents, and while it does FSEvents drops a burst
# of events with no drop or rescan flag (T331's probe lost 27 sentinels in a
# row), so a test waiting on delivery can't pass, and the FSEvents tests'
# control can't tell that loss from a watcher failure. One test at a time in
# this group keeps every flood apart from every delivery wait in a run: the
# real-FSEvents tests of fe-project, fe-config, kiln-core and kiln-platform,
# and each test that writes 10k or more files.
[test-groups.fsevents]
max-threads = 1

[[profile.default.overrides]]
filter = '''
(package(fe-project) and (test(/^tests::watcher::/)
  or test(=tests::large::a_100k_file_tree_loads_lazily)
  or test(=tests::finder::a_100k_file_index_bounds_query_work)))
or (package(fe-config) and test(/^tests::watch::/))
or (package(kiln-core) and (test(/^tests::watch::/) or test(/^tests::watch_late::/)))
or (package(kiln-platform) and test(=the_watcher_reloads_settings_saved_on_disk))
or (package(fe-workbench) and (test(=tests::m3_signoff::a_100k_file_project_end_to_end)
  or test(=tests::project_panel::only_visible_rows_are_built)))
'''
test-group = "fsevents"
