name: Bug report
description: Something in Tenmoku does not work as expected.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Tenmoku version
      description: From Tenmoku > About, or `tenmoku --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and chip
      placeholder: macOS 15.1, Apple M2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: Any error output or crash report text.
      render: text
  - type: dropdown
    id: regression
    attributes:
      label: Did this work in an earlier version?
      options:
        - I don't know
        - "No"
        - "Yes"
  - type: textarea
    id: regression-version
    attributes:
      label: If yes, which version last worked?
