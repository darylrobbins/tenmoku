name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # macOS first; Linux and Windows jobs come later.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # nextest, as the local gate (scripts/paddock-check.sh) runs it: some
      # tests rely on each test having its own process, which `cargo test`
      # doesn't give. The workspace has no doctests, which nextest skips.
      - name: Test
        run: cargo nextest run --workspace --profile ci
      - name: Core crates stay GPUI-free
        run: scripts/check-no-gpui.sh
      - name: fe-syntax builds with no languages and with each alone
        run: scripts/check-syntax-features.sh
      - name: Screenshots match their goldens
        run: |
          cargo run -p fe-gpui --example screenshots
          cargo run -p fe-workbench --example screenshots
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: target/screenshots/
          if-no-files-found: ignore

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
