name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # macOS, the primary platform; Linux is the `linux` job below.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # nextest, as the local gate (scripts/paddock-check.sh) runs it: some
      # tests rely on each test having its own process, which `cargo test`
      # doesn't give. The workspace has no doctests, which nextest skips.
      - name: Test
        run: cargo nextest run --workspace --profile ci
      - name: Core crates stay GPUI-free
        run: scripts/check-no-gpui.sh
      - name: fe-syntax builds with no languages and with each alone
        run: scripts/check-syntax-features.sh
      - name: Screenshots match their goldens
        # The runner's display is 1× and the goldens 2×, so every capture is
        # half their size. Render every scene (they must still settle) but
        # skip the pixel comparison there; see TESTING.md.
        env:
          SCREENSHOTS_ALLOW_OTHER_SCALE: 1
        run: |
          cargo run -p fe-gpui --example screenshots
          cargo run -p fe-workbench --example screenshots
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: target/screenshots/
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GPUI's libraries, and Xvfb and xdotool for the launch
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libssl-dev libx11-xcb-dev \
            libxcb1-dev libxcb-xkb-dev libasound2-dev libzstd-dev clang cmake \
            mesa-vulkan-drivers xvfb xdotool tmux
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Formatting and the platform-independent scripts run on macOS only.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo nextest run --workspace --profile ci
      - name: Kiln builds and tests on its own
        # Outside this workspace, from kiln/ plus only the entries of our root
        # manifest it uses; offline, since the Test step filled the registry
        # cache (scripts/check-framework-standalone.sh, TESTING.md).
        run: scripts/check-framework-standalone.sh
      - name: The app launches and draws a frame
        # Under Xvfb, with Mesa's software Vulkan; see the run-fastedit-linux
        # skill. `start` fails if the window draws nothing within 30 s.
        run: |
          D=.claude/skills/run-fastedit-linux/driver.sh
          $D build
          $D start
          mkdir -p target/screenshots
          $D ss target/screenshots/linux-launch.png
          $D stop
      - name: Upload the launch screenshot and log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-launch
          path: |
            target/screenshots/
            /tmp/fastedit-run/app.log
          if-no-files-found: ignore

  windows:
    # The runner image has MSVC and CMake (for wasmtime's C API) on PATH.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Formatting and the platform-independent scripts run on macOS only.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Without the examples, which have no tests: four crates' `screenshots`
      # examples link to the same target/debug/examples/screenshots.exe, and
      # Windows' file locking turns that collision into a racy link failure.
      # Clippy above still checks they compile.
      - name: Test
        run: cargo nextest run --workspace --profile ci --lib --bins --tests

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
