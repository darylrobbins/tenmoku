name: Grammars

# Builds the first-party WebAssembly grammars (extensions/grammars/) from the
# Cargo.lock-pinned crate sources, checks each highlights as the built-in
# language does (scripts/build-grammar-wasm.sh), and attaches the modules to
# the tag's GitHub Release, which release.yml creates. A manual run from a tag
# does the same; from a branch, which has no release, it uploads them as a
# workflow artifact. See docs/decisions/jd5c0dwjt7-grammar-wasm.md and
# docs/decisions/vkgx7c7far-grammar-wasm.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASI_SDK_VERSION: '34.0'
  WASI_SDK_SHA256: 9c59398106b417f8f14913380fdf0097a8cc0ff4af9eb3ce0065a859e88d49e9

jobs:
  grammars:
    # Apple Silicon, for the wasi-sdk archive below.
    runs-on: macos-15
    # 45 for the build, 120 for the wait for the release below.
    timeout-minutes: 165
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Install wasi-sdk
        run: |
          name="wasi-sdk-$WASI_SDK_VERSION-arm64-macos"
          archive="$RUNNER_TEMP/$name.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION%%.*}/$name.tar.gz"
          echo "$WASI_SDK_SHA256  $archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "WASI_SDK=$RUNNER_TEMP/$name" >>"$GITHUB_ENV"
      - name: Build the grammars and check them against the golden files
        run: scripts/build-grammar-wasm.sh
      - name: Attach them to the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # release.yml, on the same tag, is the only creator of the release, so
        # that its `gh release view` then `create` can't lose to this: wait for
        # it. Its manual run publishes nothing, so a manual run here doesn't
        # wait. crates/fe-syntax/tests/wasm_parity.rs runs this and release.yml's
        # publishing in each order.
        run: |
          tries=240
          [ "$GITHUB_EVENT_NAME" = push ] || tries=1
          until gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; do
            tries=$((tries - 1))
            if [ "$tries" -eq 0 ]; then
              echo "no release $GITHUB_REF_NAME: release.yml creates it; rerun this job once it has" >&2
              exit 1
            fi
            sleep 30
          done
          gh release upload "$GITHUB_REF_NAME" target/grammar-wasm/*.wasm --clobber
      - name: Upload them as a workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: grammar-wasm
          path: target/grammar-wasm/*.wasm
          if-no-files-found: error
