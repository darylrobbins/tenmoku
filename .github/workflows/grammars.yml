name: Grammars

# Builds the first-party WebAssembly grammars (extensions/grammars/) and the
# grammar registry: each language's artifact, the index and the pack
# tarballs (scripts/build-grammar-wasm.sh, scripts/build-grammar-registry.sh).
# On main, signs the index and publishes it all to the GitHub releases of
# tenmoku-editor/registry (scripts/publish-grammar-registry.sh), so a new
# grammar reaches users with no app release. docs/release/grammar-registry.md
# documents the registry, and
# docs/decisions/yw5ahyq2bj-grammar-registry-publish.md this workflow.
#
# The build job compiles third-party grammar C, so it never sees a secret.
# Only the publish job, in the registry environment (its secrets, and only
# main may deploy to it), can sign or write to the registry.

on:
  push:
    branches: [main]
    paths:
      - extensions/grammars/**
      - scripts/build-grammar-*.sh
      - scripts/package-language-pack.sh
      - scripts/publish-grammar-registry.sh
      - crates/fe-registry/**
      - .github/workflows/grammars.yml
  workflow_dispatch:

# One publish at a time, none cut short: a cancelled publish could leave
# the index release half uploaded.
concurrency:
  group: grammar-registry
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASI_SDK_VERSION: '34.0'
  WASI_SDK_SHA256: 9c59398106b417f8f14913380fdf0097a8cc0ff4af9eb3ce0065a859e88d49e9

jobs:
  build:
    # Apple Silicon, for the wasi-sdk archive below.
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Install wasi-sdk
        run: |
          name="wasi-sdk-$WASI_SDK_VERSION-arm64-macos"
          archive="$RUNNER_TEMP/$name.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION%%.*}/$name.tar.gz"
          echo "$WASI_SDK_SHA256  $archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "WASI_SDK=$RUNNER_TEMP/$name" >>"$GITHUB_ENV"
      - name: Build the grammars and check them against the golden files
        run: scripts/build-grammar-wasm.sh
      - name: Build the registry
        # The serial is HEAD's committer time, so a later commit's index
        # supersedes an earlier one's.
        run: REGISTRY_SERIAL="$(git log -1 --format=%ct)" scripts/build-grammar-registry.sh
      - name: Upload the registry as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: grammar-registry
          path: target/registry
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    # Holds TENMOKU_REGISTRY_PRIVATE_KEY and TENMOKU_REGISTRY_APP_KEY, and
    # allows only main.
    environment: registry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # No build cache here: this job holds the secrets, and a cache is
      # writable from any job.
      - name: Build grammar-registry
        run: cargo build --locked -p fe-registry --bin grammar-registry
      - uses: actions/download-artifact@v8
        with:
          name: grammar-registry
          path: target/registry
      - name: Sign the index
        # The key goes to stdin, never argv or a log, and only the built
        # binary runs with it in its environment, not cargo or a build script.
        env:
          TENMOKU_REGISTRY_PRIVATE_KEY: ${{ secrets.TENMOKU_REGISTRY_PRIVATE_KEY }}
        run: |
          printenv TENMOKU_REGISTRY_PRIVATE_KEY |
            target/debug/grammar-registry sign --index target/registry/index.json
      - name: Mint a token for tenmoku-editor/registry
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.TENMOKU_REGISTRY_APP_ID }}
          private-key: ${{ secrets.TENMOKU_REGISTRY_APP_KEY }}
          owner: tenmoku-editor
          repositories: registry
          permission-contents: write
      - name: Publish to tenmoku-editor/registry
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GRAMMAR_REGISTRY: target/debug/grammar-registry
        run: scripts/publish-grammar-registry.sh --dist target/registry --repo tenmoku-editor/registry
