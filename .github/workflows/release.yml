name: Release

# A vX.Y.Z tag builds Tenmoku on four platforms, one job each, and the publish job attaches
# their files to a GitHub Release: Tenmoku-<v>-macos-arm64.zip (Tenmoku.app),
# Tenmoku-<v>-windows-x64.zip, Tenmoku-<v>-windows-arm64.zip and
# Tenmoku-<v>-linux-x86_64.tar.gz, each with a .sha256, and Sparkle's appcast.xml; and, packed by
# Velopack (vpk), Tenmoku-<v>-windows-x64-Setup.exe, Tenmoku-<v>-windows-arm64-Setup.exe and
# Tenmoku-<v>-linux-x86_64.AppImage, each with a .sha256, and the Velopack feed of each:
# releases.<os>-<arch>-stable.json and the full .nupkg it lists. Each build job runs its own
# binary, and installs or launches what vpk packed, before uploading it. macOS signing,
# notarization and the appcast run only when the repository has the secrets; without them the
# app ships ad-hoc signed and with no appcast. The Velopack feeds are signed (a .sig beside each)
# only with the TENMOKU_UPDATE_PRIVATE_KEY secret and TENMOKU_UPDATE_PUBLIC_KEY variable; an
# unsigned feed is one the app never takes. The Windows and Linux builds are not code signed. A
# manual run builds the same files as workflow artifacts and publishes nothing. The release's
# body and the appcast's description are the tag's release-notes/<version>.md, which the version
# job requires of a tag. See docs/release/macos-signing.md, "Releasing", and
# docs/release/platforms.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # Check for Updates compares releases with the version built in from Cargo.toml. The
      # release notes, release-notes/<version>.md, are the release's body and the appcast's.
      - name: Check the tag is Cargo.toml's version and has its release notes
        if: github.ref_type == 'tag'
        run: scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - name: Read Cargo.toml's version
        id: version
        run: |
          version=$(awk '
            /^\[/ { in_pkg = ($0 == "[workspace.package]") }
            in_pkg && /^version[ \t]*=/ { gsub(/.*=[ \t]*"|".*/, ""); print; exit }
          ' Cargo.toml)
          [ -n "$version" ] || { echo "::error::no [workspace.package] version in Cargo.toml"; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
      # A manual run publishes nothing, so notes still to write only warn.
      - name: Check the release notes (a warning on a manual run)
        if: github.ref_type != 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/check-release-version.sh --notes "$VERSION" ||
            echo "::warning::release-notes/$VERSION.md is missing or malformed (above): a tag of this version would be refused"

  macos-arm64:
    needs: version
    # macos-latest is Apple Silicon, so the binary is arm64.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the release binary
        run: cargo build --release -p fastedit --locked
      - name: Fetch Sparkle
        id: sparkle
        run: |
          framework=$(scripts/fetch-sparkle.sh)
          echo "framework=$framework" >>"$GITHUB_OUTPUT"
          echo "tools=$(dirname "$framework")/bin" >>"$GITHUB_OUTPUT"
      - name: Bundle Tenmoku.app
        id: bundle
        env:
          SPARKLE_FRAMEWORK: ${{ steps.sparkle.outputs.framework }}
          TENMOKU_FEED_URL: ${{ vars.TENMOKU_FEED_URL || format('https://github.com/{0}/releases/latest/download/appcast.xml', github.repository) }}
          TENMOKU_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          # A tag names the version; a manual run takes Cargo.toml's.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            scripts/bundle-macos.sh --version "${GITHUB_REF_NAME#v}"
          else
            scripts/bundle-macos.sh
          fi
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            target/bundle/Tenmoku.app/Contents/Info.plist)
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Smoke test the bundled binary
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TENMOKU_NO_IPC: 1
        run: |
          got=$(target/bundle/Tenmoku.app/Contents/MacOS/tenmoku --version)
          echo "$got"
          [ "$got" = "tenmoku $VERSION" ] || { echo "::error::--version printed '$got', not 'tenmoku $VERSION'"; exit 1; }
      - name: Sign and notarize (skipped when the secrets are absent)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/sign-notarize-macos.sh target/bundle/Tenmoku.app "$RUNNER_TEMP/notarize.zip"
      - name: Zip the app and its checksum
        env:
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          name="Tenmoku-$VERSION-macos-arm64.zip"
          mkdir -p dist
          ditto -c -k --keepParent target/bundle/Tenmoku.app "dist/$name"
          (cd dist && shasum -a 256 "$name" >"$name.sha256")
          cat "dist/$name.sha256"
      - name: Sign the zip for Sparkle and write appcast.xml (skipped when the secret is absent)
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_TOOLS: ${{ steps.sparkle.outputs.tools }}
          VERSION: ${{ steps.bundle.outputs.version }}
          DOWNLOAD_URL_PREFIX: ${{ vars.DOWNLOAD_URL_PREFIX || format('https://github.com/{0}/releases/download/v{1}', github.repository, steps.bundle.outputs.version) }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "skipping Sparkle signing: no SPARKLE_ED_PRIVATE_KEY secret, so no appcast.xml"
            exit 0
          fi
          name="Tenmoku-$VERSION-macos-arm64.zip"
          # On stdin only: an argument would show in the process list.
          signature=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$SPARKLE_TOOLS/sign_update" --ed-key-file - -p "dist/$name") ||
            { echo "::error::Sparkle could not sign the zip: is the secret an exported private key?"; exit 1; }
          # The release notes become the update alert's text. A tag always has them (the
          # version job checked); a manual run may not yet.
          notes="release-notes/$VERSION.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            echo "no $notes: the appcast has no description"
            set --
          fi
          scripts/make-appcast.sh --zip "dist/$name" --version "$VERSION" \
            --download-url "${DOWNLOAD_URL_PREFIX%/}/$name" --signature "$signature" \
            --out dist/appcast.xml "$@"
      - name: Upload the zip as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Tenmoku-${{ steps.bundle.outputs.version }}-macos-arm64
          path: dist/
          if-no-files-found: error

  windows:
    needs: version
    name: windows-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The images have MSVC and CMake (for wasmtime's C API) on PATH.
          - arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            machine: '8664'
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            machine: AA64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install rustup if the image has none
        run: |
          if (Get-Command rustup -ErrorAction SilentlyContinue) { rustup --version; exit 0 }
          $init = Join-Path $env:RUNNER_TEMP rustup-init.exe
          Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/${{ matrix.target }}/rustup-init.exe" -OutFile $init
          & $init -y --default-toolchain none --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_PATH (Join-Path $env:USERPROFILE .cargo\bin)
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # The target named, so an emulated x64 toolchain on the arm64 runner still builds arm64.
      # The C runtime linked in (crt-static, for the C and C++ dependencies too through cc and
      # cmake): the zip has no Visual C++ redistributable, which a fresh Windows lacks. Only the
      # target's code: with --target, RUSTFLAGS skips build scripts.
      # The feed and public key baked in are Check for Updates' through Velopack (the public key
      # only once the variable is set); the feed signer is built beside the app.
      - name: Build the release binary
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          TENMOKU_UPDATE_FEED: ${{ vars.TENMOKU_UPDATE_FEED || format('https://github.com/{0}/releases/latest/download', github.repository) }}
          TENMOKU_UPDATE_PUBLIC_KEY: ${{ vars.TENMOKU_UPDATE_PUBLIC_KEY }}
        run: cargo build --release -p fastedit --locked --target ${{ matrix.target }} --bin tenmoku --example sign_update_feed
      - name: Zip the binary and its checksum
        run: |
          scripts/package-windows.ps1 -Arch ${{ matrix.arch }} -Version $env:VERSION `
            -Binary target/${{ matrix.target }}/release/tenmoku.exe -Out dist
          Get-Content "dist/Tenmoku-$env:VERSION-windows-${{ matrix.arch }}.zip.sha256"
      - name: Smoke test the zipped binary
        env:
          TENMOKU_NO_IPC: 1
        run: |
          $name = "Tenmoku-$env:VERSION-windows-${{ matrix.arch }}"
          $out = Join-Path $env:RUNNER_TEMP smoke
          Expand-Archive "dist/$name.zip" $out
          $exe = Join-Path $out "$name/tenmoku.exe"
          # The PE header's machine field: 8664 is x64, AA64 is arm64.
          $bytes = [IO.File]::ReadAllBytes($exe)
          $machine = '{0:X4}' -f [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
          if ($machine -ne '${{ matrix.machine }}') { throw "tenmoku.exe is for machine $machine, not ${{ matrix.machine }}" }
          # The DLLs it imports, by dumpbin: none may be the Visual C++ runtime, which the runner
          # has installed but a user's PC may not.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'no dumpbin.exe in the runner''s Visual Studio' }
          $imports = & $dumpbin /nologo /dependents $exe | Where-Object { $_ -match '^\s+\S+\.dll$' } | ForEach-Object { $_.Trim() }
          if (-not $imports) { throw "dumpbin listed no DLLs for tenmoku.exe" }
          Write-Output "imports: $($imports -join ', ')"
          $runtime = @($imports | Where-Object { $_ -match '^(vcruntime|msvcp|concrt|vcomp|ucrtbase|api-ms-win-crt-)' })
          if ($runtime) { throw "tenmoku.exe needs the Visual C++ runtime: $($runtime -join ', ')" }
          # Captured, so it waits for the GUI-subsystem exe and reads its stdout from a pipe.
          $got = (& $exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "tenmoku --version exited $LASTEXITCODE" }
          Write-Output $got
          if ($got -ne "tenmoku $env:VERSION") { throw "--version printed '$got', not 'tenmoku $env:VERSION'" }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Install vpk at the velopack crate's pin
        run: |
          $pin = (Select-String -Path Cargo.toml -Pattern '^velopack = \{ version = "=([^"]+)"').Matches[0].Groups[1].Value
          $tools = Join-Path $env:RUNNER_TEMP vpk
          dotnet tool install vpk --version $pin --tool-path $tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_PATH $tools
      - name: Pack Setup.exe and the Velopack feed
        env:
          TENMOKU_UPDATE_PUBLIC_KEY: ${{ vars.TENMOKU_UPDATE_PUBLIC_KEY }}
          TENMOKU_UPDATE_PRIVATE_KEY: ${{ secrets.TENMOKU_UPDATE_PRIVATE_KEY }}
        run: |
          $name = "Tenmoku-$env:VERSION-windows-${{ matrix.arch }}"
          $unzipped = Join-Path $env:RUNNER_TEMP pack
          Expand-Archive "dist/$name.zip" $unzipped
          scripts/velopack-pack.ps1 -Arch ${{ matrix.arch }} -Version $env:VERSION -PackDir (Join-Path $unzipped $name) `
            -Out dist -Signer target/${{ matrix.target }}/release/examples/sign_update_feed.exe
          Get-Content "dist/$name-Setup.exe.sha256"
      - name: Smoke test Setup.exe (per-user install, Start menu, --version, uninstall)
        env:
          TENMOKU_NO_IPC: 1
        run: |
          $setup = "dist/Tenmoku-$env:VERSION-windows-${{ matrix.arch }}-Setup.exe"
          $root = Join-Path $env:LOCALAPPDATA Tenmoku
          $installer = Start-Process -FilePath $setup -ArgumentList '--silent' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Setup.exe --silent exited $($installer.ExitCode)" }
          # Setup starts the app once it has installed it.
          Start-Sleep -Seconds 5
          Get-Process tenmoku -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Join-Path $root 'current\tenmoku.exe'
          if (-not (Test-Path $exe)) { throw "no per-user install at $exe" }
          if (-not (Test-Path (Join-Path $root 'Update.exe'))) { throw "no Update.exe beside current\" }
          $got = (& $exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "the installed tenmoku --version exited $LASTEXITCODE" }
          Write-Output $got
          if ($got -ne "tenmoku $env:VERSION") { throw "--version printed '$got', not 'tenmoku $env:VERSION'" }
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $shortcut = @(Get-ChildItem $menu -Filter 'Tenmoku*.lnk' -ErrorAction SilentlyContinue)
          if (-not $shortcut) { throw "no Start menu shortcut in $menu" }
          Write-Output "Start menu: $($shortcut.FullName -join ', ')"
          # The Add/Remove Programs entry, per user (HKCU: no administrator prompt).
          $uninstallKeys = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $entry = Get-ChildItem $uninstallKeys | Get-ItemProperty | Where-Object { $_.PSObject.Properties['DisplayName'] -and $_.DisplayName -eq 'Tenmoku' }
          if (-not $entry) { throw "no Tenmoku entry under $uninstallKeys" }
          Write-Output "Add/Remove Programs: $($entry.DisplayName) $($entry.DisplayVersion), $($entry.QuietUninstallString)"
          if ($entry.DisplayVersion -ne $env:VERSION) { throw "the entry's version is $($entry.DisplayVersion)" }
          # What Add/Remove Programs runs, quietly.
          if ($entry.QuietUninstallString -notmatch '^"([^"]+)"\s*(.*)$') { throw "unexpected QuietUninstallString: $($entry.QuietUninstallString)" }
          $uninstaller = Start-Process -FilePath $Matches[1] -ArgumentList $Matches[2] -Wait -PassThru
          if ($uninstaller.ExitCode -ne 0) { throw "the uninstall exited $($uninstaller.ExitCode)" }
          Start-Sleep -Seconds 5
          if (Test-Path $exe) { throw "the uninstall left $exe" }
          if (@(Get-ChildItem $menu -Filter 'Tenmoku*.lnk' -ErrorAction SilentlyContinue)) { throw 'the uninstall left the Start menu shortcut' }
          if (Get-ChildItem $uninstallKeys | Get-ItemProperty | Where-Object { $_.PSObject.Properties['DisplayName'] -and $_.DisplayName -eq 'Tenmoku' }) {
            throw 'the uninstall left the Add/Remove Programs entry'
          }
          Write-Output 'installed per user, ran, and uninstalled'
      - name: Upload the zip, Setup.exe and feed as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Tenmoku-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  linux-x86_64:
    needs: version
    runs-on: ubuntu-24.04
    outputs:
      glibc: ${{ steps.package.outputs.glibc }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install GPUI's libraries, and Xvfb and Mesa's Vulkan for the launch
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libssl-dev libx11-xcb-dev \
            libxcb1-dev libxcb-xkb-dev libasound2-dev libzstd-dev clang cmake \
            mesa-vulkan-drivers xvfb
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # As on Windows: Velopack's feed and public key baked in, and the feed signer built.
      - name: Build the release binary
        env:
          TENMOKU_UPDATE_FEED: ${{ vars.TENMOKU_UPDATE_FEED || format('https://github.com/{0}/releases/latest/download', github.repository) }}
          TENMOKU_UPDATE_PUBLIC_KEY: ${{ vars.TENMOKU_UPDATE_PUBLIC_KEY }}
        run: cargo build --release -p fastedit --locked --bin tenmoku --example sign_update_feed
      - name: Pack the binary and its checksum
        id: package
        run: |
          scripts/package-linux.sh --version "$VERSION" --out dist
          cat "dist/Tenmoku-$VERSION-linux-x86_64.tar.gz.sha256"
          # The newest glibc symbol version the binary links against: the oldest glibc it runs on.
          glibc=$(objdump -T target/release/tenmoku | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -n 1)
          [ -n "$glibc" ] || { echo "::error::no GLIBC_ symbol versions in the binary"; exit 1; }
          echo "needs glibc $glibc or later; built on $(getconf GNU_LIBC_VERSION); links:"
          objdump -p target/release/tenmoku | grep NEEDED
          echo "glibc=$glibc" >>"$GITHUB_OUTPUT"
      - name: Smoke test the packed binary
        env:
          TENMOKU_NO_IPC: 1
        run: |
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke/config" "$smoke/state" "$smoke/project"
          tar -xzf "dist/Tenmoku-$VERSION-linux-x86_64.tar.gz" -C "$smoke"
          bin="$smoke/Tenmoku-$VERSION-linux-x86_64/tenmoku"
          got=$("$bin" --version)
          echo "$got"
          [ "$got" = "tenmoku $VERSION" ] || { echo "::error::--version printed '$got', not 'tenmoku $VERSION'"; exit 1; }
          # The app under Xvfb with Mesa's software Vulkan, as ci.yml's launch check runs it:
          # still running after 5 s, with no panic in its log.
          Xvfb :99 -screen 0 1280x800x24 &
          xvfb=$!
          sleep 1
          env -u WAYLAND_DISPLAY DISPLAY=:99 XDG_CONFIG_HOME="$smoke/config" \
            XDG_STATE_HOME="$smoke/state" RUST_LOG=info "$bin" "$smoke/project" >"$smoke/app.log" 2>&1 &
          app=$!
          sleep 5
          alive=0
          kill -0 "$app" 2>/dev/null && alive=1
          kill "$app" "$xvfb" 2>/dev/null || true
          tail -n 40 "$smoke/app.log"
          [ "$alive" = 1 ] || { echo "::error::the app exited within 5 s of launching"; exit 1; }
          if grep -n 'panicked' "$smoke/app.log"; then
            echo "::error::the app panicked"
            exit 1
          fi
          echo "the app is alive after 5 s with no panic"
      - name: Install vpk's squashfs tools and FUSE for the AppImage
        run: sudo apt-get install -y squashfs-tools fuse3 libfuse2t64
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Install vpk at the velopack crate's pin
        run: |
          pin=$(sed -n 's/^velopack = { version = "=\([^"]*\)".*/\1/p' Cargo.toml)
          [ -n "$pin" ] || { echo "::error::no pinned velopack version in Cargo.toml"; exit 1; }
          dotnet tool install vpk --version "$pin" --tool-path "$RUNNER_TEMP/vpk"
          echo "$RUNNER_TEMP/vpk" >>"$GITHUB_PATH"
      - name: Pack the AppImage and the Velopack feed
        env:
          TENMOKU_UPDATE_PUBLIC_KEY: ${{ vars.TENMOKU_UPDATE_PUBLIC_KEY }}
          TENMOKU_UPDATE_PRIVATE_KEY: ${{ secrets.TENMOKU_UPDATE_PRIVATE_KEY }}
        run: |
          unpacked="$RUNNER_TEMP/pack"
          mkdir -p "$unpacked"
          tar -xzf "dist/Tenmoku-$VERSION-linux-x86_64.tar.gz" -C "$unpacked"
          scripts/velopack-pack.sh --linux --pack-dir "$unpacked/Tenmoku-$VERSION-linux-x86_64" \
            --version "$VERSION" --out dist --signer target/release/examples/sign_update_feed
          cat "dist/Tenmoku-$VERSION-linux-x86_64.AppImage.sha256"
      - name: Smoke test the AppImage
        env:
          TENMOKU_NO_IPC: 1
        run: |
          appimage="$PWD/dist/Tenmoku-$VERSION-linux-x86_64.AppImage"
          (cd dist && sha256sum -c "Tenmoku-$VERSION-linux-x86_64.AppImage.sha256")
          got=$("$appimage" --version)
          echo "$got"
          [ "$got" = "tenmoku $VERSION" ] || { echo "::error::the AppImage's --version printed '$got', not 'tenmoku $VERSION'"; exit 1; }
          # As the tar.gz's binary above: under Xvfb, alive after 5 s with no panic.
          smoke="$RUNNER_TEMP/appimage-smoke"
          mkdir -p "$smoke/config" "$smoke/state" "$smoke/project"
          Xvfb :98 -screen 0 1280x800x24 &
          xvfb=$!
          sleep 1
          env -u WAYLAND_DISPLAY DISPLAY=:98 XDG_CONFIG_HOME="$smoke/config" \
            XDG_STATE_HOME="$smoke/state" RUST_LOG=info "$appimage" "$smoke/project" >"$smoke/app.log" 2>&1 &
          app=$!
          sleep 5
          alive=0
          kill -0 "$app" 2>/dev/null && alive=1
          kill "$app" "$xvfb" 2>/dev/null || true
          tail -n 40 "$smoke/app.log"
          [ "$alive" = 1 ] || { echo "::error::the AppImage exited within 5 s of launching"; exit 1; }
          if grep -n 'panicked' "$smoke/app.log"; then
            echo "::error::the AppImage panicked"
            exit 1
          fi
          echo "the AppImage is alive after 5 s with no panic"
      - name: Upload the archive, AppImage and feed as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Tenmoku-${{ needs.version.outputs.version }}-linux-x86_64
          path: dist/
          if-no-files-found: error

  publish:
    # Tag pushes only: a manual run leaves its files as the build jobs' artifacts.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, macos-arm64, windows, linux-x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # For release-notes/<version>.md, at the tagged commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Download every build job's files
        uses: actions/download-artifact@v8
        with:
          pattern: Tenmoku-*
          path: dist
          merge-multiple: true
      - name: List the release files
        run: ls -l dist
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GLIBC: ${{ needs.linux-x86_64.outputs.glibc }}
        run: |
          # The body: the release notes (the version job refused a tag without them), then where
          # each download is for.
          version="${GITHUB_REF_NAME#v}"
          notes="release-notes/$version.md"
          [ -s "$notes" ] || { echo "::error::no $notes at $GITHUB_REF_NAME"; exit 1; }
          body="$RUNNER_TEMP/release-body.md"
          {
            cat "$notes"
            # A blank line between, whether or not the file ends in a newline.
            [ -z "$(tail -c 1 "$notes")" ] || echo
            echo
            echo "Downloads: macOS on Apple Silicon (macos-arm64.zip); Windows on x64 or ARM64, an installer (windows-x64-Setup.exe, windows-arm64-Setup.exe) or a portable zip (windows-x64.zip, windows-arm64.zip); Linux on x86_64, an AppImage (linux-x86_64.AppImage) or a portable archive (linux-x86_64.tar.gz), both needing glibc $GLIBC or later. The releases.*.json and .nupkg files are the Windows and Linux update feeds. How to install, update and uninstall each, and to open a build the OS warns is unsigned: https://github.com/$GH_REPO/blob/$GITHUB_REF_NAME/docs/release/platforms.md"
          } >"$body" || { echo "::error::could not write the release body to $body"; exit 1; }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # --clobber replaces only what it is given. A rebuilt zip under the old appcast.xml
            # would fail Sparkle's signature check on every installed copy, so leave both alone.
            assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
            if [ ! -e dist/appcast.xml ] && printf '%s\n' "$assets" | grep -qx appcast.xml; then
              echo "::error::$GITHUB_REF_NAME has an appcast.xml and this run made none: set SPARKLE_ED_PRIVATE_KEY, or delete that asset first"
              exit 1
            fi
            # The same for each Velopack feed: a new feed under the old .sig fails every check.
            for sig in $(printf '%s\n' "$assets" | grep -x 'releases\..*\.json\.sig' || true); do
              if [ ! -e "dist/$sig" ]; then
                echo "::error::$GITHUB_REF_NAME has $sig and this run made none: set TENMOKU_UPDATE_PRIVATE_KEY, or delete that asset first"
                exit 1
              fi
            done
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$body"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
              --title "Tenmoku $GITHUB_REF_NAME" --notes-file "$body"
          fi
