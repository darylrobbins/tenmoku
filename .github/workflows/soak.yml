name: Soak

# Longer randomized runs of the core property tests, including the slow ones
# that `cargo test` skips. On demand only for now.
on:
  workflow_dispatch:
    inputs:
      cases:
        description: Cases per property test
        default: "50000"

env:
  CARGO_TERM_COLOR: always

jobs:
  properties:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Property tests
        env:
          CASES: ${{ inputs.cases || '50000' }}
        run: scripts/soak.sh "$CASES"
