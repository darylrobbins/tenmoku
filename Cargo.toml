[workspace]
resolver = "3"
members = ["crates/*", "kiln/crates/*"]
# Vendored crates build as dependencies only (see [patch.crates-io]).
exclude = ["vendor"]
default-members = ["crates/fastedit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
# Internal crates.
fe-text = { path = "crates/fe-text" }
fe-buffer = { path = "crates/fe-buffer" }
# Kiln, the app framework (kiln/, docs/decisions/app-framework.md).
kiln = { path = "kiln/crates/kiln" }
kiln-command = { path = "kiln/crates/kiln-command" }
kiln-core = { path = "kiln/crates/kiln-core" }
kiln-macros = { path = "kiln/crates/kiln-macros" }
kiln-platform = { path = "kiln/crates/kiln-platform" }
kiln-shell = { path = "kiln/crates/kiln-shell" }
kiln-ui = { path = "kiln/crates/kiln-ui" }
# fastedit's names for the kiln crates that moved out of it.
fe-command = { package = "kiln-command", path = "kiln/crates/kiln-command" }
fe-ui = { package = "kiln-ui", path = "kiln/crates/kiln-ui" }
fe-display = { path = "crates/fe-display" }
fe-editor = { path = "crates/fe-editor" }
fe-gpui = { path = "crates/fe-gpui" }
fe-syntax = { path = "crates/fe-syntax" }
fe-project = { path = "crates/fe-project" }
fe-config = { path = "crates/fe-config" }
fe-keymap = { path = "crates/fe-keymap" }
fe-workbench = { path = "crates/fe-workbench" }
fe-nav = { path = "crates/fe-nav" }
fe-vim = { path = "crates/fe-vim" }
fe-lsp = { path = "crates/fe-lsp" }
fe-fileview = { path = "crates/fe-fileview" }
fe-terminal = { path = "crates/fe-terminal" }
fe-terminal-view = { path = "crates/fe-terminal-view" }
fe-git = { path = "crates/fe-git" }
fe-markdown = { path = "crates/fe-markdown" }
fe-markdown-view = { path = "crates/fe-markdown-view" }
fe-chat = { path = "crates/fe-chat" }
fe-chat-anthropic = { path = "crates/fe-chat-anthropic" }
fe-chat-view = { path = "crates/fe-chat-view" }
fe-net = { path = "crates/fe-net" }

# GPUI comes from the `gpui-pre-*` crates.io snapshots of Zed (Apache-2.0).
# 0.3.9 is zed@93d7456. Every snapshot crate must be bumped together; to move to
# a Zed git revision instead, add a `[patch.crates-io]` section.
gpui = { package = "gpui-pre", version = "=0.3.9" }
# `runtime_shaders` compiles Metal shaders at launch, so builds don't need Xcode's
# separately downloaded Metal toolchain. Drop it for release builds once CI has
# that toolchain (`xcodebuild -downloadComponent MetalToolchain`) to save startup time.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "runtime_shaders"] }
sum-tree = { package = "gpui-pre-sum-tree", version = "=0.3.9" }

# Project tree: gitignore-aware directory listing and file watching.
ignore = "0.4"
# LSP glob patterns (fe-lsp); the version `ignore` already pulls in.
globset = "0.4"
notify = "8"
# Git status and HEAD blobs (fe-git): gitoxide, pure Rust, MIT OR Apache-2.0.
# Only `status` (which brings the index, dirwalk and blob diff), `blame`
# (gix-blame, MIT OR Apache-2.0), `sha1`, and `parallel` (without it
# ThreadSafeRepository holds `Rc`s and isn't Send): no network, HTTP, TLS or
# credential features.
gix = { version = "0.89", default-features = false, features = ["status", "blame", "sha1", "parallel"] }
# Cmd-P fuzzy matching of project paths (MIT; no runtime dependencies by default).
frizbee = "0.13"
# Project search: ripgrep's searcher and regex matcher, without the `grep`
# facade (which adds grep-printer and grep-cli). Unlicense OR MIT. Cargo.lock
# holds their encoding_rs at 0.8.35: the releases after it add simdutf8 and
# multiversion, which T65 didn't vet.
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
# fe-vim's search patterns, translated to it (already in the lock through grep-regex).
regex = "1"

# Markdown for the preview (fe-markdown): pulldown-cmark (MIT), the fastest
# parser we looked at, with byte ranges for each event (`into_offset_iter`),
# which give blocks their source lines. Its only new dependency is unicase (MIT
# OR Apache-2.0). Without default features it has no `getopts` or `html`.
pulldown-cmark = { version = "0.13", default-features = false }
# Percent-decoding link destinations (already in the lock).
percent-encoding = "2"

# The host's channel from the config watcher to the main thread (already in
# the lock through gpui).
async-channel = "2"

# Language server client (fe-lsp). async-lsp is pinned with `=`: fe-lsp mirrors
# its request-id counter (docs/decisions/lsp-client.md §2.1). Without default
# features it adds no tokio; lsp-types is the version async-lsp requires.
async-lsp = { version = "=0.2.4", default-features = false, features = ["omni-trait"] }
lsp-types = "=0.95.1"
# fe-lsp's runtime: a thread per server under async-io, processes through
# async-process, `killpg` through rustix (all already in the lock).
async-io = "2"
async-process = "2"
futures = "0.3"
rustix = { version = "1", default-features = false, features = ["std", "process"] }
# File encodings: decode and encode legacy encodings, and guess
# unmarked ones (fe-text). chardetng is Apache-2.0 OR MIT; encoding_rs stays at
# 0.8.35 in Cargo.lock, as noted above.
encoding_rs = "0.8"
chardetng = "0.1"

# PNG decode/encode for the fe-gpui screenshot goldens (already in the lock through gpui).
image = { version = "0.25", default-features = false, features = ["png"] }
# Checking a local SVG's linked files before GPUI draws it (fe-markdown-view),
# read with the XML parser GPUI's SVG parser reads it with (already in the
# lock through gpui).
usvg = { version = "0.46", default-features = false }
libc = "0.2"
log = "0.4"
# HTTP types for the chat's transport (fe-chat-anthropic): status codes and
# header maps (MIT OR Apache-2.0; already in the lock through gpui).
http = "1"
# fe-net, the HTTPS client (docs/decisions/5at38c8v89-ai-chat.md § 6): hyper's
# HTTP/1.1 client (MIT) over async-io through smol-hyper (MIT OR Apache-2.0,
# only its futures-io adapter), and rustls (Apache-2.0 OR ISC OR MIT) with
# ring, through futures-rustls (MIT/Apache-2.0), certificates checked by the
# OS through rustls-platform-verifier (MIT OR Apache-2.0). Default features
# off throughout: rustls' and futures-rustls' defaults bring aws-lc-rs. hyper
# depends on tokio for `sync` only, which is not a runtime. async-net (MIT OR
# Apache-2.0) resolves and connects (already in the lock through gpui).
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
http-body-util = "0.1"
smol-hyper = { version = "0.1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-platform-verifier = "0.6"
async-net = "2"
# EditorConfig lookup and glob matching (Apache-2.0, no dependencies).
ec4rs = "1.2"
# SCIP indexes (fe-nav): the generated protobuf types (Apache-2.0) and the
# protobuf runtime they're built on (MIT), which scip pins at =3.7.2.
scip = "0.10"
protobuf = "3.7"
# Command args, invocation records and their schemas (all already in the lock through gpui).
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
# kiln-macros, the proc-macro crate, and the records it submits (all already
# in the lock through gpui).
heck = "0.5"
inventory = "0.3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
unicode-segmentation = "1"

# The platform keychain behind kiln-core's KeychainStore (src/secrets.rs):
# keyring-core and its per-platform stores, all MIT OR Apache-2.0. On Linux
# and the BSDs the store is zbus-secret-service-keyring-store, pure-Rust
# D-Bus on async-io (already in the lock) with RustCrypto, never
# dbus-secret-service-keyring-store or a `vendored` feature (libdbus is
# AFL-2.1 OR GPL-2.0). security-framework and secret-service are named too, to
# read the platform's error behind a keyring-core error (the versions the
# stores use).
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
windows-native-keyring-store = { version = "1", default-features = false }
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
security-framework = "3.7"
secret-service = { version = "5", default-features = false, features = ["rt-async-io-crypto-rust"] }

# Test and bench tooling.
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
rand = "0.9"
toml = "1"
# Writes a setting into settings.toml keeping its comments and layout
# (MIT OR Apache-2.0; already in the lock through another crate).
toml_edit = "0.25"

# Tree-sitter and grammars (all MIT; each grammar's license and queries audited
# when added, see THIRD_PARTY.md). `wasm` loads extensions' grammars at run time
# through wasmtime (Apache-2.0 WITH LLVM-exception).
tree-sitter = { version = "0.27", features = ["wasm"] }
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-containerfile = "0.9"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-kotlin-sg = "0.4"
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-md = "0.5"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-sequel = "0.3"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"

ropey = { version = "=2.0.0-beta.1", features = ["metric_chars", "metric_lines_lf", "metric_utf16"] }
# Line diffs for proposed changes (Apache-2.0).
imara-diff = { version = "0.2", default-features = false }
# Terminal pane: VT parser, grid, scrollback, selection and pty (Apache-2.0;
# docs/decisions/terminal.md).
alacritty_terminal = { version = "0.26", default-features = false }
# fe-terminal opens the pty itself to keep its user side open (already in the
# lock through alacritty_terminal).
rustix-openpty = "0.2"
# The `Poller` types in alacritty_terminal's `EventedReadWrite` (already in the lock).
polling = "3.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# GPUI and text hot paths are painfully slow unoptimised; keep them fast in dev.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
ropey = { opt-level = 3 }
tree-sitter = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 1

# tree-sitter-yaml 0.7.2's scanner counts rows in an int16_t, so YAML over
# 32,768 lines gets error nodes (upstream issue #49). This is 0.7.2 with
# upstream PR #35 applied; see vendor/tree-sitter-yaml/README.md for when to drop it.
#
# tree-sitter 0.27.0's Wasm store has no execution deadline and aborts on a
# mistyped module export; this is 0.27.0 with both fixed, for extensions'
# grammars. See vendor/tree-sitter/README.md for when to drop it.
[patch.crates-io]
tree-sitter = { path = "vendor/tree-sitter" }
tree-sitter-yaml = { path = "vendor/tree-sitter-yaml" }
