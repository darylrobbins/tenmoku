[package]
name = "fastedit"
description = "Standalone fastedit host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fe-buffer.workspace = true
fe-config.workspace = true
fe-gpui.workspace = true
fe-lsp.workspace = true
fe-syntax.workspace = true
fe-vim.workspace = true
fe-workbench.workspace = true
kiln.workspace = true
kiln-platform.workspace = true
gpui.workspace = true
libc.workspace = true
log.workspace = true
schemars.workspace = true
serde.workspace = true
toml.workspace = true

# The Dock icon: unbundled, macOS shows the launching terminal's icon.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.2", features = ["NSData", "NSThread"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support", "leak-detection"] }
kiln = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
