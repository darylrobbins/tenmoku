[package]
name = "fastedit"
description = "Tenmoku, the standalone editor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The package keeps its name; the binary it builds and installs is tenmoku.
[[bin]]
name = "tenmoku"
path = "src/main.rs"

# The system spell checker's tests run on the process's main thread, which
# libtest's harness never does.
[[test]]
name = "mac_speller"
harness = false

[dependencies]
async-channel.workspace = true
fe-buffer.workspace = true
fe-config.workspace = true
fe-gpui.workspace = true
fe-lsp.workspace = true
fe-net.workspace = true
fe-syntax.workspace = true
fe-vim.workspace = true
fe-workbench.workspace = true
kiln.workspace = true
kiln-platform.workspace = true
gpui.workspace = true
libc.workspace = true
log.workspace = true
pico-args.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true

# The Dock icon: unbundled, macOS shows the launching terminal's icon.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSImage", "NSResponder", "NSSpellChecker", "NSTextCheckingClient"] }
objc2-foundation = { version = "0.2", features = ["NSArray", "NSData", "NSRange", "NSOrthography", "NSString", "NSTextCheckingResult", "NSThread"] }

[dev-dependencies]
fe-command.workspace = true
# The tests' trashes go to a test trash, never the user's Trash.
fe-project = { workspace = true, features = ["test-support"] }
fe-lsp = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support", "leak-detection"] }
kiln = { workspace = true, features = ["test-support"] }
futures.workspace = true

[lints]
workspace = true
