<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2f5e"/>
      <stop offset="1" stop-color="#0d0f24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ef2d0"/>
      <stop offset="1" stop-color="#3b8bff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Tile: macOS icon grid, 824px squircle centred in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <!-- Code lines -->
  <g fill="#e8ebff" fill-opacity="0.9">
    <rect x="262" y="318" width="250" height="46" rx="23"/>
    <rect x="262" y="489" width="170" height="46" rx="23" fill="#8f98d8" fill-opacity="0.8"/>
    <rect x="262" y="660" width="300" height="46" rx="23"/>
  </g>
  <g fill="url(#accent)">
    <rect x="552" y="318" width="120" height="46" rx="23"/>
    <rect x="472" y="489" width="210" height="46" rx="23"/>
  </g>
  <!-- Caret, with a trailing speed streak -->
  <rect x="720" y="262" width="46" height="500" rx="23" fill="url(#accent)"/>
  <rect x="780" y="352" width="56" height="20" rx="10" fill="#5ef2d0" fill-opacity="0.45"/>
  <rect x="780" y="514" width="80" height="20" rx="10" fill="#5ef2d0" fill-opacity="0.3"/>
  <rect x="780" y="676" width="40" height="20" rx="10" fill="#5ef2d0" fill-opacity="0.45"/>
</svg>
