[package]
name = "fe-acp"
description = "The Agent Client Protocol (ACP) v1 client for Claude Agent: connection, sessions, prompts, permission requests and events. Must not depend on GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent-client-protocol.workspace = true
# The adapter's process and its stdio (launch.rs), as fe-lsp spawns servers.
async-io.workspace = true
async-process.workspace = true
# Canonical git directories without Windows' verbatim `\\?\` prefix (claude.rs).
dunce.workspace = true
# The agent settings the security profile is built from (claude.rs).
fe-config.workspace = true
futures.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
# Killing the adapter's process group (launch.rs).
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
