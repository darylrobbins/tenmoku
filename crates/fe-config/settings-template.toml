# fastedit settings.
#
# This file reloads when you save it. A project's `.fastedit/settings.toml`
# overrides it, key by key. Uncomment a line to change that setting.

[editor]
# The font family. Unset, the first installed of JetBrains Mono, SF Mono,
# Menlo, DejaVu Sans Mono, Ubuntu Mono, Liberation Mono and Noto Sans Mono.
# font_family = "JetBrains Mono"

# The font size, in points (6 to 72).
# font_size = 13.0

# The line height, as a multiple of the font size (1 to 3).
# line_height = 1.6

# How many columns a tab advances to the next multiple of (1 to 16).
# tab_size = 4

# Whether long lines wrap at the window's edge.
# soft_wrap = false

[vim]
# Whether the editor starts in vim's normal mode, where keys run vim commands.
# enabled = false
# Set to "unnamedplus" to share yanks and puts with the system clipboard.
# clipboard = ""
# true: s and S start the forward and backward jump, as leap and flash map
# them, instead of changing a char or a line. gs and gS start it either way.
# jump_on_s = false
# How long, in milliseconds, a vim search or :s may run before it stops and
# changes nothing.
# regex_time_limit = 2000

[status_bar]
# Whether the status bar shows at the bottom of the window.
# visible = true

[theme]
# dark, light, or system to follow the system's appearance. Your own colours
# go in theme.toml beside this file; its appearance says whether it replaces
# the dark or the light theme.
# mode = "dark"
