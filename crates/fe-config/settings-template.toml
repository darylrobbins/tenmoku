# fastedit settings.
#
# This file reloads when you save it. A project's `.fastedit/settings.toml`
# overrides it, key by key. Uncomment a line to change that setting.

[editor]
# The font family. Unset, the first installed of JetBrains Mono, SF Mono,
# Menlo, DejaVu Sans Mono, Ubuntu Mono, Liberation Mono and Noto Sans Mono.
# font_family = "JetBrains Mono"

# Draw the font's ligatures, such as `=>` as ⇒ and `->` as →.
# font_ligatures = false

# The font size, in points (6 to 72).
# font_size = 13.0

# The line height, as a multiple of the font size (1 to 3).
# line_height = 1.6

# How many columns a tab advances to the next multiple of (1 to 16).
# tab_size = 4

# Whether long lines wrap at the window's edge.
# soft_wrap = false

# Format a file with its language server before saving it. A server that
# doesn't answer within a second is skipped and the file saves unformatted.
# format_on_save = false

# Show language servers' inlay hints (type and parameter names) inside the text.
# inlay_hints = true

# Colour code with language servers' semantic tokens over the syntax colours.
# semantic_highlighting = true

# Show a lightbulb by the caret's row when a language server has quick fixes or
# refactorings there.
# lightbulb = true

# Show language servers' code lenses ("3 references", "Run") above rows.
# code_lens = true

# Code action kinds to run, in order, when you save a file, before
# format_on_save, such as ["source.organizeImports", "source.fixAll"].
# code_actions_on_save = []

# Type the closing bracket or quote when typing an opening one, type over it,
# and delete both with backspace.
# auto_close_pairs = true

# When a changed file saves itself: "off", "after_delay", "on_focus_change",
# "on_window_change" or "on_insert_leave".
# auto_save = "off"

# How long after the last edit, in milliseconds, "after_delay" saves
# (100 to 60000).
# auto_save_delay = 1000

# Draw a thin vertical line at each indent level.
# indent_guides = true

# Show the caret row's git blame after the line in every new window; Git:
# Toggle Line Blame turns it on or off for one window.
# inline_blame = false

# Colour bracket pairs by how deeply they nest, in the theme's three bracket
# colours.
# bracket_pair_colors = true

[editor.minimap]
# Show the minimap: the whole file drawn small beside the text.
# enabled = true
# Which side of the text the minimap is on: "right" or "left".
# side = "right"
# Draw each character's shape; false draws blocks of colour.
# render_characters = true
# The most columns of a row the minimap draws (at least 1).
# max_column = 120
# How big the minimap draws, 1 to 3: each column scale pixels wide and each
# row 2 × scale pixels tall (3 × scale drawing blocks).
# scale = 1
# When the slider over the visible rows shows: "mouseover" or "always".
# show_slider = "mouseover"
# How tall the minimap's rows are: "proportional" keeps their size and
# scrolls the minimap with the editor, "fill" stretches or shrinks them so the
# file fills the minimap's height, and "fit" shrinks them only if it doesn't
# fit.
# size = "proportional"

[vim]
# Whether the editor starts in vim's normal mode, where keys run vim commands.
# enabled = false
# Set to "unnamedplus" to share yanks and puts with the system clipboard.
# clipboard = ""
# true: s and S start the forward and backward jump, as leap and flash map
# them, instead of changing a char or a line. gs and gS start it either way.
# jump_on_s = false
# true: gr{motion}, grr and visual gr replace text with a register's contents,
# as the ReplaceWithRegister plugin does, instead of running nvim 0.12's
# language-server gr keys (grr references, grn rename, gra code action, gri,
# grt).
# replace_with_register = false
# How long, in milliseconds, a vim search or :s may run before it stops and
# changes nothing.
# regex_time_limit = 2000
# The key <leader> stands for in a remap, in vim notation.
# leader = "\\"
# Remaps, as vim's :map makes them. mode is "n", "x" (or "v"), "o", or a list
# of them; recursive = true remaps the keys `to` produces too.
# [[vim.remap]]
# mode = "n"
# from = "<leader>w"
# to = ":w<CR>"

[status_bar]
# Whether the status bar shows at the bottom of the window.
# visible = true

[workbench]
# Open a file single-clicked in the project tree in a preview tab, in
# italics, that the next one replaces. Editing it, double-clicking it or its
# tab, or pinning it keeps it open.
# preview_tabs = true

[theme]
# dark, light, or system to follow the system's appearance. Your own colours
# go in theme.toml beside this file; its appearance says whether it replaces
# the dark or the light theme.
# mode = "dark"
# The installed theme the dark theme is, by ID: an extension's theme file, as
# in "acme.solarized/solarized-dark". Unset is the built-in one. Your
# theme.toml goes over it.
# dark = "acme.solarized/solarized-dark"
# The installed theme the light theme is, by ID. Unset is the built-in one.
# light = "acme.solarized/solarized-light"
# A bundled theme by name: Dark Modern, Dark 2026, Light 2026, Fastedit Dark,
# Fastedit Light or Fastedit Ember. It's the dark or the light theme, as its
# appearance is; dark or light, if set, wins for that one.
# name = "Dark Modern"

[terminal]
# The program the terminal runs. Empty runs your login shell. A project file
# can't set it.
# shell = ""
# The shell's arguments. Ignored when shell is empty. A project file can't
# set it.
# shell_args = []
# How many lines the terminal keeps above the screen.
# scrollback = 10000
# The terminal's font family. Unset uses the editor's.
# font_family = "JetBrains Mono"
# The terminal's font size, in points. Unset uses the editor's.
# font_size = 13.0
# Fonts to take a character from when the terminal's font lacks it, in
# order: "Symbols Nerd Font Mono" gives Nerd Font icons with any font.
# Or set font_family to a Nerd Font, such as "JetBrainsMono Nerd Font Mono".
# font_fallbacks = []

[chat]
# The Claude model new chats use. A chat keeps the model it started with. A
# project file can't set any [chat] key.
# model = "claude-opus-5-5"
# How much Claude thinks before it answers: low, medium, high, xhigh or max.
# Lower is faster and cheaper. Applies to new chats.
# effort = "medium"
# Show a summary of Claude's reasoning above each reply. Applies to new chats.
# show_thinking = false
# The most a reply may use, its thinking included (1024 to 128000).
# max_tokens = 64000
# The most tokens of attached context (files, selection, diagnostics) one
# message sends (0 to 500000).
# context_budget = 32000
# When Claude declines a request, let Anthropic's API answer with its
# recommended fallback model.
# fallbacks = true
