# fastedit Dark: the editor's colours in the bundled dark theme, and
# where any editor or syntax colour a dark theme leaves out comes from. The
# rest of the window's colours are Kiln Dark's. Colours are "#rgb",
# "#rrggbb" or "#rrggbbaa".

name = "fastedit Dark"
appearance = "dark"

[editor]
background = "#16181d"
foreground = "#c8ccd4"
gutter_foreground = "#4b5160"
gutter_active_foreground = "#a0a7b4"
active_line = "#ffffff08"
selection = "#4f7cc855"
cursor = "#7aa2f7"
error = "#e06c75"
warning = "#e5c07b"
information = "#61afef"
hint = "#7f848e"
popover_background = "#21252b"
popover_border = "#3e4452"
jump_label = "#ff79c6"
jump_label_preview = "#5fd7d7"
jump_label_foreground = "#16181d"
# The git change bar. These are muted on purpose, with low saturation so the
# bar is noticeable but quiet; they are not derived from `information` or `error`.
change_added = "#4f8a5b"
change_modified = "#4e7fae"
change_deleted = "#b05a64"
# A diff view's rows: added and removed rows faint, their changed words
# stronger over them, and the hatch on the filler rows across from them. Green
# and red only, never the blue of change_modified: a modified pair is removed on
# the left and added on the right.
diff_added_row = "#4f8a5b33"
diff_removed_row = "#b05a6433"
diff_added_word = "#58b86a59"
diff_removed_word = "#d0606e59"
diff_filler = "#cccccc1f"
# A thin line at each indent level, and the one of the caret's block.
indent_guide = "#ffffff12"
indent_guide_active = "#ffffff30"
# The marks on spaces and tabs (editor.render_whitespace) and the rulers'
# lines (editor.rulers), faint.
whitespace = "#ffffff29"
ruler = "#ffffff1f"
# Sticky scroll: the band of pinned scope headers at the top of the editor,
# the line under it when a theme shows one, the shadow fading down from it and
# a row under the pointer. VS Code's editorStickyScroll.background (the
# editor's), .border (none), .shadow (scrollbar.shadow) and
# editorStickyScrollHover.background.
sticky_scroll_background = "#16181d"
sticky_scroll_border = "#00000000"
sticky_scroll_shadow = "#000000"
sticky_scroll_hover = "#2A2D2E"
# The vim mode's segment in the status bar.
vim_mode_normal = "#61afef"
vim_mode_insert = "#98c379"
vim_mode_visual = "#c678dd"
vim_mode_replace = "#e06c75"
vim_mode_command = "#e5c07b"
vim_mode_foreground = "#16181d"
# Bracket pairs by nesting depth, with editor.bracket_pair_colors: the
# outermost pair, the one inside it and the next, then round again.
bracket_1 = "#ffd700"
bracket_2 = "#da70d6"
bracket_3 = "#179fff"
# The minimap: its background, the slider over the visible rows (at rest,
# hovered and dragged), and the marks for the selection, find matches,
# error and warning diagnostics and git changes. VS Code's default dark
# minimap colours: the slider is scrollbarSlider.* at half alpha; the find
# match mark is the overview ruler's opaque #D18616, so a one-row match shows.
minimap_background = "#16181d"
minimap_slider = "#79797933"
minimap_slider_hover = "#64646459"
minimap_slider_active = "#BFBFBF33"
minimap_selection = "#264F78"
minimap_find_match = "#D18616"
minimap_error = "#FF1212B3"
minimap_warning = "#e5c07b"
minimap_gutter_added = "#4f8a5b"
minimap_gutter_modified = "#4e7fae"
minimap_gutter_deleted = "#b05a64"

# Highlight captures by dotted name. A capture without its own colour takes
# the colour of its longest listed prefix: "function.method" uses "function".
[syntax]
"attribute" = "#d19a66"
"comment" = "#5c6370"
"comment.documentation.code" = "#c8ccd4"
"constant" = "#d19a66"
"constant.enum_member" = "#4fb8c8"
"constructor" = "#e5c07b"
"escape" = "#56b6c2"
"function" = "#61afef"
"function.macro" = "#56b6c2"
"keyword" = "#c678dd"
"label" = "#e06c75"
"markup.heading" = "#e06c75"
"markup.link" = "#61afef"
"markup.link.url" = "#56b6c2"
"markup.raw" = "#98c379"
"module" = "#e5c07b"
"number" = "#d19a66"
"operator" = "#56b6c2"
"property" = "#e06c75"
"punctuation" = "#7f848e"
"punctuation.special" = "#56b6c2"
"string" = "#98c379"
"string.placeholder" = "#d19a66"
"string.special" = "#56b6c2"
"string.special.key" = "#e06c75"
"tag" = "#e06c75"
"type" = "#e5c07b"
"type.parameter" = "#d6b46a"
"variable.builtin" = "#e06c75"
"variable.parameter" = "#e06c75"
