# fastedit Dark: the bundled theme, and where any colour a user theme leaves
# out comes from. Colours are "#rgb", "#rrggbb" or "#rrggbbaa".

name = "fastedit Dark"
appearance = "dark"

# The workbench chrome: panels, rows and tabs.
[ui]
background = "#16181d"
panel_background = "#121418"
border = "#23262d"
text = "#8b8f98"
muted_text = "#4b5160"
error_text = "#e06c75"
row_hover = "#ffffff0a"
row_selected = "#4f7cc833"
row_selected_inactive = "#ffffff0f"
row_focus_border = "#4f7cc8aa"
icon = "#8b8f98"
folder_icon = "#7f9fd8"
chevron = "#6c717c"
indent_guide = "#ffffff14"
tab_active = "#16181d"
tab_active_text = "#c8ccd4"
tab_inactive = "#121418"
dirty_dot = "#d19a66"
drop_target = "#4f7cc8"
accent = "#4f7cc8"

[editor]
background = "#16181d"
foreground = "#c8ccd4"
gutter_foreground = "#4b5160"
gutter_active_foreground = "#a0a7b4"
active_line = "#ffffff08"
selection = "#4f7cc855"
cursor = "#7aa2f7"

# Highlight captures by dotted name. A capture without its own colour takes
# the colour of its longest listed prefix: "function.method" uses "function".
[syntax]
"attribute" = "#d19a66"
"comment" = "#5c6370"
"constant" = "#d19a66"
"constructor" = "#e5c07b"
"escape" = "#56b6c2"
"function" = "#61afef"
"function.macro" = "#56b6c2"
"keyword" = "#c678dd"
"label" = "#e06c75"
"markup.heading" = "#e06c75"
"markup.link" = "#61afef"
"markup.link.url" = "#56b6c2"
"markup.raw" = "#98c379"
"module" = "#e5c07b"
"number" = "#d19a66"
"operator" = "#56b6c2"
"property" = "#e06c75"
"punctuation" = "#7f848e"
"punctuation.special" = "#56b6c2"
"string" = "#98c379"
"string.special" = "#56b6c2"
"string.special.key" = "#e06c75"
"tag" = "#e06c75"
"type" = "#e5c07b"
"variable.builtin" = "#e06c75"
