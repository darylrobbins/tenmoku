# fastedit Dark: the editor's colours in the bundled dark theme, and
# where any editor or syntax colour a dark theme leaves out comes from. The
# rest of the window's colours are Kiln Dark's. Colours are "#rgb",
# "#rrggbb" or "#rrggbbaa".

name = "fastedit Dark"
appearance = "dark"

[editor]
background = "#16181d"
foreground = "#c8ccd4"
gutter_foreground = "#4b5160"
gutter_active_foreground = "#a0a7b4"
active_line = "#ffffff08"
selection = "#4f7cc855"
cursor = "#7aa2f7"
error = "#e06c75"
warning = "#e5c07b"
information = "#61afef"
hint = "#7f848e"
popover_background = "#21252b"
popover_border = "#3e4452"
jump_label = "#ff79c6"
jump_label_preview = "#5fd7d7"
jump_label_foreground = "#16181d"
# The git change bar. These are muted on purpose, with low saturation so the
# bar is noticeable but quiet; they are not derived from `information` or `error`.
change_added = "#4f8a5b"
change_modified = "#4e7fae"
change_deleted = "#b05a64"
# A thin line at each indent level, and the one of the caret's block.
indent_guide = "#ffffff12"
indent_guide_active = "#ffffff30"
# The vim mode's segment in the status bar.
vim_mode_normal = "#61afef"
vim_mode_insert = "#98c379"
vim_mode_visual = "#c678dd"
vim_mode_replace = "#e06c75"
vim_mode_command = "#e5c07b"
vim_mode_foreground = "#16181d"

# Highlight captures by dotted name. A capture without its own colour takes
# the colour of its longest listed prefix: "function.method" uses "function".
[syntax]
"attribute" = "#d19a66"
"comment" = "#5c6370"
"constant" = "#d19a66"
"constructor" = "#e5c07b"
"escape" = "#56b6c2"
"function" = "#61afef"
"function.macro" = "#56b6c2"
"keyword" = "#c678dd"
"label" = "#e06c75"
"markup.heading" = "#e06c75"
"markup.link" = "#61afef"
"markup.link.url" = "#56b6c2"
"markup.raw" = "#98c379"
"module" = "#e5c07b"
"number" = "#d19a66"
"operator" = "#56b6c2"
"property" = "#e06c75"
"punctuation" = "#7f848e"
"punctuation.special" = "#56b6c2"
"string" = "#98c379"
"string.special" = "#56b6c2"
"string.special.key" = "#e06c75"
"tag" = "#e06c75"
"type" = "#e5c07b"
"variable.builtin" = "#e06c75"
