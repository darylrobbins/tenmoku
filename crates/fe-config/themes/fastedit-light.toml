# fastedit Light: the editor's colours in the bundled light theme, and
# where any editor or syntax colour a light theme leaves out comes from. The
# rest of the window's colours are Kiln Light's. Colours are "#rgb",
# "#rrggbb" or "#rrggbbaa".

name = "fastedit Light"
appearance = "light"

[editor]
background = "#ffffff"
foreground = "#383a42"
gutter_foreground = "#a0a1a7"
gutter_active_foreground = "#383a42"
active_line = "#0000000a"
selection = "#3b6fd433"
cursor = "#3b6fd4"
error = "#d93f4c"
warning = "#b8760f"
information = "#2f74d0"
hint = "#9aa0aa"
popover_background = "#f3f4f6"
popover_border = "#dcdfe4"
jump_label = "#a8005a"
jump_label_preview = "#00727f"
jump_label_foreground = "#ffffff"
# The git change bar. These are muted on purpose, with low saturation so the
# bar is noticeable but quiet; they are not derived from `information` or `error`.
change_added = "#8cc79a"
change_modified = "#9db6d6"
change_deleted = "#d6a2a7"
# A thin line at each indent level, and the one of the caret's block.
indent_guide = "#0000001a"
indent_guide_active = "#00000040"
# The vim mode's segment in the status bar.
vim_mode_normal = "#2f6fc7"
vim_mode_insert = "#2e7d32"
vim_mode_visual = "#9a2fa0"
vim_mode_replace = "#c42b3a"
vim_mode_command = "#8a5800"
vim_mode_foreground = "#ffffff"
# Bracket pairs by nesting depth, with editor.bracket_pair_colors: the
# outermost pair, the one inside it and the next, then round again.
bracket_1 = "#0431fa"
bracket_2 = "#319331"
bracket_3 = "#7b3814"

# Highlight captures by dotted name. A capture without its own colour takes
# the colour of its longest listed prefix: "function.method" uses "function".
[syntax]
"attribute" = "#986801"
"comment" = "#a0a1a7"
"constant" = "#986801"
"constant.enum_member" = "#0184bc"
"constructor" = "#c18401"
"escape" = "#0184bc"
"function" = "#4078f2"
"function.macro" = "#0184bc"
"keyword" = "#a626a4"
"label" = "#e45649"
"markup.heading" = "#e45649"
"markup.link" = "#4078f2"
"markup.link.url" = "#0184bc"
"markup.raw" = "#50a14f"
"module" = "#c18401"
"number" = "#986801"
"operator" = "#0184bc"
"property" = "#e45649"
"punctuation" = "#696c77"
"punctuation.special" = "#0184bc"
"string" = "#50a14f"
"string.special" = "#0184bc"
"string.special.key" = "#e45649"
"tag" = "#e45649"
"type" = "#c18401"
"type.parameter" = "#b07a1c"
"variable.builtin" = "#e45649"
"variable.parameter" = "#e45649"
