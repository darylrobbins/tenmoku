# Tenmoku Ember: a warm dark theme. Brown-black surfaces, an amber accent
# and warm syntax hues, as a complete kiln theme file.
#
# To try it, copy it to ~/.config/tenmoku/theme.toml (or
# $XDG_CONFIG_HOME/tenmoku/theme.toml) with `mode = "dark"` (the default)
# in settings. It reloads live. Delete the file to go back to Tenmoku Dark.
# Colours are "#rgb", "#rrggbb" or "#rrggbbaa".

kiln_theme = 1
name = "Tenmoku Ember"
appearance = "dark"

[surface]
background = "#1c1814"
panel = "#16120f"
overlay = "#00000080"

[text]
primary = "#a8998a"
muted = "#5e544a"
on_accent = "#1c1814"

[border]
default = "#2e2722"

[accent]
base = "#d08b3e"

[state]
hover = "#ffffff0a"
pressed = "#ffffff14"
selected_inactive = "#ffffff0f"

[status]
error = "#e0705f"
warning = "#e0a84e"
info = "#7fa6b8"
success = "#a3b56f"

[list]
indent_guide = "#ffffff14"
chevron = "#85766a"
folder_icon = "#d6a066"

[tab]
active_text = "#e3d6c3"

[editor]
background = "#1c1814"
foreground = "#e3d6c3"
gutter_foreground = "#5e544a"
gutter_active_foreground = "#b0a08e"
active_line = "#ffffff08"
selection = "#d08b3e40"
cursor = "#f0a050"
error = "#e0705f"
warning = "#e0a84e"
information = "#7fa6b8"
hint = "#85766a"
popover_background = "#26201b"
popover_border = "#3a312a"
jump_label = "#ff8fa3"
jump_label_preview = "#7fd1c4"
jump_label_foreground = "#1c1814"
# The git change bar. These are muted on purpose, with low saturation so the
# bar is noticeable but quiet; they are not derived from `information` or `error`.
change_added = "#7fb889"
change_modified = "#7fa6b8"
change_deleted = "#c47a72"
# A diff view's rows and changed words, at VS Code's translucent levels (its
# diffEditor.inserted/removedLineBackground and ...TextBackground are #..33; ours are weaker still, so a comment keeps its contrast):
# the row band is fainter and the word tint over it stronger, both behind the
# text, so a changed word keeps its syntax colour. Green and red only.
diff_added_row = "#9bb95514"
diff_removed_row = "#ff000014"
diff_added_word = "#9ccc2c1f"
diff_removed_word = "#ff00001f"
diff_filler = "#e3d6c31f"
# A thin line at each indent level, and the one of the caret's block.
indent_guide = "#ffffff12"
indent_guide_active = "#ffffff30"
# The marks on spaces and tabs (editor.render_whitespace) and the rulers'
# lines (editor.rulers), faint.
whitespace = "#ffffff29"
ruler = "#ffffff1f"
# Sticky scroll: the band of pinned scope headers at the top of the editor,
# the line under it when a theme shows one, the shadow fading down from it and
# a row under the pointer. VS Code's editorStickyScroll.background (the
# editor's), .border (none), .shadow (scrollbar.shadow) and
# editorStickyScrollHover.background.
sticky_scroll_background = "#1c1814"
sticky_scroll_border = "#00000000"
sticky_scroll_shadow = "#000000"
sticky_scroll_hover = "#2A2D2E"
# The vim mode's segment in the status bar.
vim_mode_normal = "#7fa6b8"
vim_mode_insert = "#a3b56f"
vim_mode_visual = "#c49bd1"
vim_mode_replace = "#e0705f"
vim_mode_command = "#e0a84e"
vim_mode_foreground = "#1c1814"
# Bracket pairs by nesting depth, with editor.bracket_pair_colors: the
# outermost pair, the one inside it and the next, then round again.
bracket_1 = "#e5b45c"
bracket_2 = "#c49bd1"
bracket_3 = "#7fa6b8"
# The minimap: its background, the slider over the visible rows (at rest,
# hovered and dragged), and the marks for the selection, find matches,
# error and warning diagnostics and git changes. VS Code's default dark
# minimap colours: the slider is scrollbarSlider.* at half alpha; the find
# match mark is the overview ruler's opaque #D18616, so a one-row match shows.
minimap_background = "#1c1814"
minimap_slider = "#79797933"
minimap_slider_hover = "#64646459"
minimap_slider_active = "#BFBFBF33"
minimap_selection = "#264F78"
minimap_find_match = "#D18616"
minimap_error = "#FF1212B3"
minimap_warning = "#e0a84e"
minimap_gutter_added = "#7fb889"
minimap_gutter_modified = "#7fa6b8"
minimap_gutter_deleted = "#c47a72"

# Highlight captures by dotted name. A capture without its own colour takes
# the colour of its longest listed prefix: "function.method" uses "function".
[syntax]
"attribute" = "#d4a15a"
"comment" = "#665a4e"
"comment.documentation.code" = "#e3d6c3"
"constant" = "#d9965a"
"constant.enum_member" = "#8fb5a8"
"constructor" = "#e6c27a"
"escape" = "#8fb5a8"
"function" = "#e5b45c"
"function.macro" = "#8fb5a8"
"keyword" = "#d9694a"
"label" = "#e0705f"
"markup.heading" = "#e0705f"
"markup.link" = "#e5b45c"
"markup.link.url" = "#8fb5a8"
"markup.raw" = "#a3b56f"
"module" = "#e6c27a"
"number" = "#d98a8a"
"operator" = "#c9a98a"
"property" = "#d4856a"
"punctuation" = "#85766a"
"punctuation.special" = "#c9a98a"
"string" = "#a3b56f"
"string.placeholder" = "#d9965a"
"string.special" = "#8fb5a8"
"string.special.key" = "#d4856a"
"tag" = "#d9694a"
"type" = "#d9b36c"
"type.parameter" = "#cfa862"
"variable.builtin" = "#e0705f"
"variable.parameter" = "#e0705f"
