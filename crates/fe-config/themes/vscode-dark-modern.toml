# VS Code Dark Modern: the editor and token colours of VS Code's Dark Modern
# theme, on Tenmoku's one-colour-per-highlight-name model. The window's
# chrome is set through kiln's semantic token groups, not per component.
#
# Adapted from microsoft/vscode `extensions/theme-defaults/themes/dark_modern.json`,
# `dark_plus.json` and `dark_vs.json` at commit
# ab8f31f0c0b1a4dd86d8dbee1248542f5806574d.
#
# Copyright (c) Microsoft Corporation. Licensed under the MIT License; the
# notice is in this repository's NOTICE.
#
# The title bar, activity bar, side bar, status bar, panel and inactive tabs
# share #181818 in Dark Modern, so they all take surface.panel; every
# `.border` is #2B2B2B. Where dark_modern.json sets no value for a list or
# scrollbar key, dark_plus.json's or dark_vs.json's default is used
# (scrollbar thumb, indent guide, status colours); state.hover,
# state.pressed and the chevron/icon colours are chosen to sit in its palette.
#
# Values VS Code leaves to its built-in defaults rather than the three files
# (selection #264F78, cursor #AEAFAD, editorError.foreground #F14C4C,
# editorWarning.foreground #CCA700, editorInfo.foreground #59A4F9, hint
# #EEEEEEB2) are those defaults; dark_modern.json's #F85149 is the general
# errorForeground, not the editor's diagnostics. active_line, popover_border,
# the jump label colours and the vim mode segments have no Dark Modern value;
# they are chosen to sit in its palette.
#
# Scopes with no highlight name are left out: semantic-token rules
# (`*.mutable` underline), font styles, markup.bold/italic/underline/
# strikethrough, markup.inserted/deleted/changed, invalid, regexp scopes and
# the CSS-only and language-specific scope variants. A highlight name that
# several scopes colour differently takes the general scope's colour
# (`keyword` is `keyword`'s #569CD6, not `keyword.control`'s #C586C0).
#
# To try it, copy it to ~/.config/fastedit/theme.toml with `mode = "dark"`.
# Colours are "#rgb", "#rrggbb" or "#rrggbbaa".

kiln_theme = 1
name = "VS Code Dark Modern"
appearance = "dark"

[surface]
background = "#1F1F1F"
panel = "#181818"
raised = "#202020"
overlay = "#00000080"

[text]
primary = "#CCCCCC"
muted = "#9D9D9D"
disabled = "#6E7681"
accent = "#4DAAFC"
on_accent = "#FFFFFF"

[border]
default = "#2B2B2B"
subtle = "#2B2B2B"
focused = "#0078D4"

[accent]
base = "#0078D4"
hover = "#026EC1"
subtle = "#0078D426"

[state]
hover = "#FFFFFF14"
pressed = "#FFFFFF22"
selected = "#FFFFFF22"
selected_inactive = "#37373D"
focus_ring = "#0078D4B3"

[status]
error = "#F85149"
warning = "#CCA700"
info = "#3794FF"
success = "#2EA043"

[list]
indent_guide = "#404040"
chevron = "#CCCCCC"
icon = "#CCCCCC"
folder_icon = "#CCCCCC"

[tab]
active = "#1F1F1F"
inactive = "#181818"
active_text = "#FFFFFF"

[scrollbar]
thumb = "#79797966"
thumb_hover = "#646464B3"

[editor]
background = "#1F1F1F"
foreground = "#CCCCCC"
gutter_foreground = "#6E7681"
gutter_active_foreground = "#CCCCCC"
active_line = "#FFFFFF0A"
selection = "#264F78"
cursor = "#AEAFAD"
error = "#F14C4C"
warning = "#CCA700"
information = "#59A4F9"
hint = "#EEEEEEB2"
popover_background = "#202020"
popover_border = "#313131"
jump_label = "#C586C0"
jump_label_preview = "#4EC9B0"
jump_label_foreground = "#1F1F1F"
change_added = "#2EA043"
change_modified = "#0078D4"
change_deleted = "#F85149"
indent_guide = "#404040"
indent_guide_active = "#707070"
# The marks on spaces and tabs (editor.render_whitespace) and the rulers'
# lines (editor.rulers): VS Code's built-in editorWhitespace.foreground and
# editorRuler.foreground defaults.
whitespace = "#e3e4e229"
ruler = "#5a5a5a"
# Sticky scroll: the band of pinned scope headers at the top of the editor,
# the line under it when a theme shows one, the shadow fading down from it and
# a row under the pointer. VS Code's editorStickyScroll.background (the
# editor's), .border (none), .shadow (scrollbar.shadow) and
# editorStickyScrollHover.background.
sticky_scroll_background = "#1F1F1F"
sticky_scroll_border = "#00000000"
sticky_scroll_shadow = "#000000"
sticky_scroll_hover = "#2A2D2E"
vim_mode_normal = "#4DAAFC"
vim_mode_insert = "#89D185"
vim_mode_visual = "#C586C0"
vim_mode_replace = "#F85149"
vim_mode_command = "#DCDCAA"
vim_mode_foreground = "#1F1F1F"
# Bracket pairs by nesting depth, with editor.bracket_pair_colors: the
# outermost pair, the one inside it and the next, then round again.
bracket_1 = "#FFD700"
bracket_2 = "#DA70D6"
bracket_3 = "#179FFF"
# The minimap. dark_modern.json and its includes set no minimap or scrollbar
# slider colour, so these are VS Code's dark defaults: minimap.background is
# the editor's, minimapSlider.* scrollbarSlider.* at half alpha,
# minimap.selectionHighlight editor.selectionBackground, minimap.errorHighlight
# #FF1212B3, minimap.warningHighlight editorWarning.foreground and
# minimapGutter.* editorGutter.*. The find match mark is the overview ruler's
# opaque #D18616, so a one-row match shows.
minimap_background = "#1F1F1F"
minimap_slider = "#79797933"
minimap_slider_hover = "#64646459"
minimap_slider_active = "#BFBFBF33"
minimap_selection = "#264F78"
minimap_find_match = "#D18616"
minimap_error = "#FF1212B3"
minimap_warning = "#CCA700"
minimap_gutter_added = "#2EA043"
minimap_gutter_modified = "#0078D4"
minimap_gutter_deleted = "#F85149"

# Every name Tenmoku Dark colours is listed, since a theme's table is laid
# over Dark's.
[syntax]
"attribute" = "#9CDCFE"
"comment" = "#6A9955"
"comment.documentation.code" = "#CCCCCC"
"constant" = "#4FC1FF"
"constant.builtin" = "#569CD6"
"constant.enum_member" = "#4FC1FF"
"constructor" = "#4EC9B0"
"escape" = "#D7BA7D"
"function" = "#DCDCAA"
"function.macro" = "#DCDCAA"
"keyword" = "#569CD6"
"label" = "#C8C8C8"
"markup.heading" = "#569CD6"
"markup.link" = "#4DAAFC"
"markup.link.url" = "#4DAAFC"
"markup.raw" = "#CE9178"
"module" = "#4EC9B0"
"number" = "#B5CEA8"
"operator" = "#D4D4D4"
"property" = "#9CDCFE"
"punctuation" = "#CCCCCC"
"punctuation.special" = "#569CD6"
"string" = "#CE9178"
"string.placeholder" = "#569CD6"
"string.special" = "#D16969"
"string.special.key" = "#9CDCFE"
"tag" = "#569CD6"
"type" = "#4EC9B0"
"type.parameter" = "#4EC9B0"
"variable" = "#9CDCFE"
"variable.builtin" = "#569CD6"
"variable.parameter" = "#9CDCFE"
