all = true

[[file]]
path = "src/fake.rs"
reason = "Test-support fake adapter: its program, labels and error replies are protocol text a test reads, never shown to a user"

[[file]]
path = "src/bin/fe-dap-fake.rs"
reason = "Test-support binary running the fake adapter; its usage text is for test authors"

[[file]]
path = "src/protocol.rs"
reason = "Protocol types only, with no user-facing text: the lint reads the doc comments inside the object!/markers! macro invocations, and serde's skip_serializing_if paths, as literals"

[[file]]
path = "src/log.rs"
reason = "The protocol log's lines are DAP field names and values (seq=, command=, request_seq=, success=, error.id=) and JSON, for diagnosing adapters; its prose (the payload warning) goes through tr!"

[[literal]]
file = "src/registry/builtin.rs"
text = "command script import {lookup}"
reason = "An LLDB command (Rust's formatters in an adapter's initCommands), never shown to a user"

[[literal]]
file = "src/registry/builtin.rs"
text = "command source {commands}"
reason = "An LLDB command (Rust's formatters in an adapter's initCommands), never shown to a user"
