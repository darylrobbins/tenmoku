[package]
name = "fe-editor"
description = "Headless editor model: buffer, selections and commands. Must not depend on GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dunce.workspace = true
fe-buffer.workspace = true
fe-command.workspace = true
fe-display.workspace = true
fe-text.workspace = true
imara-diff.workspace = true
# The UI string catalogue: the editor's command titles, descriptions and
# messages (docs/decisions/xte5e7hqsw-i18n-design.md).
kiln-l10n.workspace = true
log.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
icu_collator.workspace = true
icu_properties.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
# The catalogue checks (tests/l10n.rs): the literal lint, the keys lint and
# the registry check of command titles.
fe-command = { workspace = true, features = ["lint"] }
kiln-l10n = { workspace = true, features = ["lint"] }
fe-fileview.workspace = true
proptest.workspace = true
rand.workspace = true

[lints]
workspace = true
