[package]
name = "fe-gpui"
description = "GPUI rendering and input for the fastedit editor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fe-buffer.workspace = true
fe-command.workspace = true
fe-config.workspace = true
fe-display.workspace = true
fe-editor.workspace = true
fe-fileview.workspace = true
fe-keymap.workspace = true
fe-syntax.workspace = true
fe-text.workspace = true
fe-vim.workspace = true
kiln-platform.workspace = true
# EditorView is a pane item (pane_item.rs).
kiln-shell.workspace = true
gpui.workspace = true
# Saves report back and wait for each other (pane_item.rs).
futures.workspace = true
log.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
criterion.workspace = true
gpui = { workspace = true, features = ["test-support"] }
# The screenshots example renders with the real Metal platform.
gpui_platform = { workspace = true, features = ["test-support"] }
# The keystroke bench reads the drawn scene back as an image.
image.workspace = true
# The screenshots example's harness: settling, comparison and goldens.
kiln-platform = { workspace = true, features = ["test-support"] }
# Invocations recorded in tests go through JSON, as a macro or log would.
serde_json.workspace = true
# The save tests read a file as the workbench's loader does. Only fe-buffer
# types cross between it and this crate.
fe-workbench.workspace = true
tempfile.workspace = true

# Keystroke-to-frame latency by stage, headless (PERF.md, "Typing latency").
[[bench]]
name = "keystroke"
harness = false

# Hand-checking proposed changes: diff blocks, buttons, undo and commands.
[[example]]
name = "proposal_demo"
test = false

[lints]
workspace = true
