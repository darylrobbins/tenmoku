[package]
name = "fe-gpui"
description = "GPUI rendering and input for the fastedit editor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fe-buffer.workspace = true
fe-command.workspace = true
fe-config.workspace = true
fe-display.workspace = true
fe-editor.workspace = true
fe-keymap.workspace = true
fe-syntax.workspace = true
fe-vim.workspace = true
gpui.workspace = true
log.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
criterion.workspace = true
gpui = { workspace = true, features = ["test-support"] }
# The screenshots example renders with the real Metal platform.
gpui_platform = { workspace = true, features = ["test-support"] }
image.workspace = true
# Invocations recorded in tests go through JSON, as a macro or log would.
serde_json.workspace = true

# Golden screenshots of the editor view (TESTING.md, "Screenshots"). Built as a
# test so the gate runs the pixel-comparison unit tests; rendering only happens
# under `cargo run`, where `main` is on the main thread as AppKit requires.
[[example]]
name = "screenshots"
test = true

# Keystroke-to-frame latency by stage, headless (PERF.md, "Typing latency").
[[bench]]
name = "keystroke"
harness = false

[lints]
workspace = true
