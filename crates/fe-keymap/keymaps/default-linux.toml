# Vim's command line (`vim_line`), which the status bar shows for `/`, `?`
# and `:`. Its input's other keys are `text_input`'s.

[[bindings]]
keys = "enter"
command = "text_input.submit"
context = "vim_line && text_input"

[[bindings]]
keys = "escape"
command = "vim_line.cancel"
context = "vim_line"

# Ghost text: while a suggestion shows, `tab` accepts it and accept-word
# takes its next word, over the editor's and vim's insert mode's keys. The
# completion rows come after, so the menu's `tab` wins while both show.

[[bindings]]
keys = "tab"
command = "ghost_text.accept"
context = "ghost_text"

[[bindings]]
keys = "ctrl-right"
command = "ghost_text.accept_word"
context = "ghost_text"

# Completion: `ctrl-space` asks at the caret. While the menu shows, its keys
# win over the editor's and vim's insert mode's, being later at the same
# depth.

[[bindings]]
keys = "ctrl-space"
command = "editor.trigger_completion"
context = "editor"

[[bindings]]
keys = "up"
command = "completion.select_prev"
context = "completion"

[[bindings]]
keys = "down"
command = "completion.select_next"
