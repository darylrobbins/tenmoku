[[bindings]]
keys = "down"
command = "references_panel.select_next"
context = "ReferencesPanel"

[[bindings]]
keys = "enter"
command = "references_panel.open"
context = "ReferencesPanel"

# Vim's layer, last so that it wins over the plain editor's bindings in the
# same frame. In normal and visual mode the arrows are vim's motions
# (`h l k j`), and the editing keys are vim's (`vim.key` hands the keystroke
# to vim) rather than the editor's. A vim ctrl key bound to anything else,
# here ctrl-v (paste), ctrl-q (quit), ctrl-y (redo), ctrl-f (find) and ctrl-b
# (the dock), is bound to `vim.key` too, so it reaches vim; one bound to
# nothing, such as ctrl-r, reaches it unmatched.

[[bindings]]
keys = "left"
command = "vim.move"
args = { motion = "left" }
context = "editor && vim.mode == normal"

[[bindings]]
keys = "right"
command = "vim.move"
args = { motion = "right" }
context = "editor && vim.mode == normal"

[[bindings]]
keys = "up"
command = "vim.move"
args = { motion = "up" }
context = "editor && vim.mode == normal"

[[bindings]]
keys = "down"
command = "vim.move"
args = { motion = "down" }
context = "editor && vim.mode == normal"

[[bindings]]
keys = "left"
command = "vim.move"
args = { motion = "left" }
context = "editor && vim.visual"

[[bindings]]
keys = "right"
command = "vim.move"
args = { motion = "right" }
context = "editor && vim.visual"

[[bindings]]
keys = "up"
command = "vim.move"
args = { motion = "up" }
context = "editor && vim.visual"

[[bindings]]
keys = "down"
command = "vim.move"
args = { motion = "down" }
context = "editor && vim.visual"

