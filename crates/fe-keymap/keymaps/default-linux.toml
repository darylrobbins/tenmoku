# In-file find: the pane's find bar (`find_bar`) and the editor it searches.

[[bindings]]
keys = "ctrl-f"
command = "find.show"
context = "editor"

# vim's ctrl-f (page down) beats `find.show` in normal and visual mode, so
# it comes after it.
[[bindings]]
keys = "ctrl-f"
command = "vim.key"
context = "editor && vim.mode == normal"

[[bindings]]
keys = "ctrl-f"
command = "vim.key"
context = "editor && vim.visual"

