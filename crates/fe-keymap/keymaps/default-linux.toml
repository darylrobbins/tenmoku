# fastedit.toml as it resolves on Linux and Windows: kept for tests that need
# that platform's bindings on any host. Don't edit this to change fastedit's
# defaults: edit keymaps/fastedit.toml, then this to match; fe-keymap's
# tests/one_keymap.rs checks they agree.

