context = "editor && vim.mode == normal"

[[bindings]]
keys = "ctrl-w ctrl-q"
command = "pane.close"
context = "editor && vim.mode == normal"

[[bindings]]
keys = "ctrl-w shift-h"
command = "pane.move_tab_left"
context = "editor && vim.mode == normal"

[[bindings]]
keys = "ctrl-w shift-j"
command = "pane.move_tab_down"
context = "editor && vim.mode == normal"

[[bindings]]
keys = "ctrl-w shift-k"
command = "pane.move_tab_up"
context = "editor && vim.mode == normal"

[[bindings]]
keys = "ctrl-w shift-l"
command = "pane.move_tab_right"
context = "editor && vim.mode == normal"

[[bindings]]
keys = "ctrl-w >"
command = "pane.grow_width"
context = "editor && vim.mode == normal"

[[bindings]]
keys = "ctrl-w <"
command = "pane.shrink_width"
context = "editor && vim.mode == normal"

[[bindings]]
keys = "ctrl-w +"
command = "pane.grow_height"
context = "editor && vim.mode == normal"

[[bindings]]
keys = "ctrl-w -"
command = "pane.shrink_height"
context = "editor && vim.mode == normal"

[[bindings]]
keys = "ctrl-w ="
command = "pane.equalize"
context = "editor && vim.mode == normal"
