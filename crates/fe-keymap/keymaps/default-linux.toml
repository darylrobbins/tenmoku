# Insert mode keeps the editor's keys; `escape` and `ctrl-[` end the session
# and return to normal mode.

[[bindings]]
keys = "escape"
command = "vim.normal_mode"
context = "editor && vim.mode == insert"

[[bindings]]
keys = "ctrl-["
command = "vim.normal_mode"
context = "editor && vim.mode == insert"

[[bindings]]
keys = "escape"
command = "vim.normal_mode"
context = "editor && vim.mode == replace"

[[bindings]]
keys = "ctrl-["
command = "vim.normal_mode"
