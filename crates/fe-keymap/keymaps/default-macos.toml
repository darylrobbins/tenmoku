command = "editor.select_page_down"
context = "editor"

[[bindings]]
keys = "cmd-a"
command = "editor.select_all"
context = "editor"

[[bindings]]
keys = "backspace"
command = "editor.backspace"
context = "editor"

[[bindings]]
keys = "shift-backspace"
