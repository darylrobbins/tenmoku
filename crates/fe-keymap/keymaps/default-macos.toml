# The built-in macOS keymap: the first layer, which the user's keymap.toml
# overrides. See fe_keymap's `keymap` module for the format.

[[bindings]]
keys = "left"
command = "editor.move_left"
context = "editor"

[[bindings]]
keys = "right"
command = "editor.move_right"
context = "editor"

[[bindings]]
keys = "up"
command = "editor.move_up"
context = "editor"

[[bindings]]
keys = "down"
command = "editor.move_down"
context = "editor"

[[bindings]]
keys = "alt-left"
command = "editor.move_word_left"
context = "editor"

[[bindings]]
keys = "alt-right"
command = "editor.move_word_right"
context = "editor"

[[bindings]]
keys = "cmd-left"
command = "editor.move_line_start"
context = "editor"

[[bindings]]
keys = "home"
command = "editor.move_line_start"
context = "editor"

[[bindings]]
keys = "cmd-right"
command = "editor.move_line_end"
context = "editor"

[[bindings]]
keys = "end"
command = "editor.move_line_end"
context = "editor"

[[bindings]]
keys = "cmd-up"
command = "editor.move_document_start"
context = "editor"

[[bindings]]
keys = "cmd-down"
