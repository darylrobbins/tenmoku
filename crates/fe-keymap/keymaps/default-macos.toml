context = "project_panel"

[[bindings]]
keys = "down"
command = "project_panel.select_next"
context = "project_panel"

[[bindings]]
keys = "left"
command = "project_panel.collapse_or_parent"
context = "project_panel"

[[bindings]]
keys = "right"
command = "project_panel.expand_or_first_child"
context = "project_panel"

[[bindings]]
keys = "enter"
command = "project_panel.open"
context = "project_panel"

# Find references' results, when they have focus.
[[bindings]]
keys = "up"
command = "references_panel.select_prev"
context = "ReferencesPanel"

[[bindings]]
keys = "down"
command = "references_panel.select_next"
context = "ReferencesPanel"

[[bindings]]
keys = "enter"
command = "references_panel.open"
context = "ReferencesPanel"

# Vim's layer, last so that it wins over the plain editor's bindings in the
# same frame. In normal and visual mode the arrows are vim's motions
# (`h l k j`), and the editing keys are vim's (`vim.key` hands the keystroke
# to vim) rather than the editor's. Vim's ctrl keys need no binding: no
# `ctrl-` binding applies in the editor, so they reach vim unmatched.

[[bindings]]
keys = "left"
command = "vim.move"
args = { motion = "left" }
context = "editor && vim.mode == normal"

[[bindings]]
keys = "right"
command = "vim.move"
args = { motion = "right" }
context = "editor && vim.mode == normal"

[[bindings]]
keys = "up"
command = "vim.move"
args = { motion = "up" }
context = "editor && vim.mode == normal"

[[bindings]]
keys = "down"
command = "vim.move"
args = { motion = "down" }
context = "editor && vim.mode == normal"

[[bindings]]
keys = "left"
command = "vim.move"
args = { motion = "left" }
context = "editor && vim.visual"

[[bindings]]
keys = "right"
command = "vim.move"
args = { motion = "right" }
context = "editor && vim.visual"

[[bindings]]
keys = "up"
command = "vim.move"
args = { motion = "up" }
context = "editor && vim.visual"

[[bindings]]
keys = "down"
command = "vim.move"
args = { motion = "down" }
context = "editor && vim.visual"

[[bindings]]
keys = "enter"
command = "vim.key"
context = "editor && vim.mode == normal"

[[bindings]]
keys = "tab"
command = "vim.key"
context = "editor && vim.mode == normal"

[[bindings]]
keys = "backspace"
command = "vim.key"
context = "editor && vim.mode == normal"

[[bindings]]
keys = "shift-backspace"
command = "vim.key"
context = "editor && vim.mode == normal"

[[bindings]]
keys = "delete"
command = "vim.key"
context = "editor && vim.mode == normal"

[[bindings]]
keys = "alt-backspace"
command = "vim.key"
context = "editor && vim.mode == normal"

[[bindings]]
keys = "enter"
command = "vim.key"
context = "editor && vim.visual"

[[bindings]]
keys = "tab"
command = "vim.key"
context = "editor && vim.visual"

[[bindings]]
keys = "backspace"
command = "vim.key"
context = "editor && vim.visual"

[[bindings]]
keys = "shift-backspace"
command = "vim.key"
context = "editor && vim.visual"

[[bindings]]
keys = "delete"
command = "vim.key"
context = "editor && vim.visual"

[[bindings]]
keys = "alt-backspace"
command = "vim.key"
context = "editor && vim.visual"

# Insert mode keeps the editor's keys; `escape` and `ctrl-[` end the session
# and return to normal mode.

[[bindings]]
keys = "escape"
command = "vim.normal_mode"
context = "editor && vim.mode == insert"

[[bindings]]
keys = "ctrl-["
command = "vim.normal_mode"
context = "editor && vim.mode == insert"
