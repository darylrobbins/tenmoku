context = "editor"

[[bindings]]
keys = "alt-shift-right"
command = "editor.select_word_right"
context = "editor"

[[bindings]]
keys = "cmd-shift-left"
command = "editor.select_line_start"
context = "editor"

[[bindings]]
keys = "shift-home"
