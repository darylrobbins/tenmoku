command = "pane.move_tab_down"
context = "workbench"

[[bindings]]
keys = "cmd-k cmd-w"
command = "pane.close"
context = "workbench"

# The project tree, when it has focus. `project_panel.reveal_active` has no
# key yet: it's for the command palette.
