context = "editor && vim.mode == replace"

# Off macOS, nvim's insert-mode ctrl keys are vim's in insert and replace
# mode, after the workbench's bindings of them (ctrl-w closes the tab, ctrl-o
# opens a file, ctrl-n a new one, ctrl-p quick open, ctrl-a select all), so
# they win there. The editor's key listener hands them to fe-vim, which
# takes those it has (`ctrl-w` and `ctrl-u` delete before the caret,
# `ctrl-t` and `ctrl-d` shift the row's indent, `ctrl-o` runs one
# normal-mode command) and drops the rest, never the workbench's, as in
# nvim. On macOS no `ctrl-` binding applies in the editor: they reach it
# unmatched.

[[bindings]]
keys = "ctrl-w"
command = "vim.key"
context = "editor && (vim.mode == insert || vim.mode == replace)"
platform = "!macos"

[[bindings]]
keys = "ctrl-u"
command = "vim.key"
context = "editor && (vim.mode == insert || vim.mode == replace)"
platform = "!macos"

[[bindings]]
