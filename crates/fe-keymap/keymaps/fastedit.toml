# Vim's layer, last so that it wins over the plain editor's bindings in the
# same frame. In normal and visual mode the arrows are vim's motions
# (`h l k j`), and the editing keys are vim's (`vim.key` hands the keystroke
# to vim) rather than the editor's. A vim ctrl key bound to anything else,
# off macOS ctrl-v (paste), ctrl-q (quit), ctrl-a (select all), ctrl-x
# (cut), ctrl-y (redo), ctrl-f (find) and ctrl-b (the dock), is bound to
# `vim.key` too, so it reaches vim; one bound
# to nothing in a vim editor, such as ctrl-r, reaches it unmatched, as every one does on macOS, where no `ctrl-` binding applies in the editor.
[[bindings]]
keys = "left"
command = "vim.move"
args = { motion = "left" }
context = "editor && vim.mode == normal"

[[bindings]]
keys = "right"
command = "vim.move"
args = { motion = "right" }
context = "editor && vim.mode == normal"

[[bindings]]
keys = "up"
command = "vim.move"
args = { motion = "up" }
context = "editor && vim.mode == normal"

[[bindings]]
keys = "down"
command = "vim.move"
args = { motion = "down" }
context = "editor && vim.mode == normal"

[[bindings]]
