# the editor's (and vim's).
[[bindings]]
keys = "alt-f5"
command = "proposal.next_hunk"
context = "editor && proposal"

[[bindings]]
keys = "alt-shift-f5"
command = "proposal.previous_hunk"
context = "editor && proposal"

[[bindings]]
keys = "cmd-y"
command = "proposal.accept_hunk"
context = "editor && proposal"
platform = "macos"

[[bindings]]
keys = "cmd-n"
command = "proposal.reject_hunk"
context = "editor && proposal"
platform = "macos"

[[bindings]]
keys = "cmd-enter"
command = "proposal.accept_all"
context = "editor && proposal"
platform = "macos"

[[bindings]]
keys = "cmd-backspace"
command = "proposal.reject_all"
context = "editor && proposal"
platform = "macos"

[[bindings]]
keys = "ctrl-alt-y"
command = "proposal.accept_hunk"
context = "editor && proposal"
platform = "!macos"

[[bindings]]
keys = "ctrl-alt-n"
command = "proposal.reject_hunk"
context = "editor && proposal"
platform = "!macos"

[[bindings]]
keys = "ctrl-alt-shift-y"
command = "proposal.accept_all"
context = "editor && proposal"
platform = "!macos"

[[bindings]]
keys = "ctrl-alt-shift-n"
command = "proposal.reject_all"
context = "editor && proposal"
platform = "!macos"

# The git and diff commands. Each key is one fe-vim never takes in normal,
# visual or operator-pending mode: a function key, or a cmd or ctrl-alt chord
# (vim has no such key), never plain ctrl-y, ctrl-e, ctrl-d or ctrl-u.
# Show Source Control: VS Code's ctrl-shift-g.
[[bindings]]
keys = "ctrl-shift-g"
command = "git.show_changes"

# Next and previous change in a diff view: VS Code's diff editor f7 and
# shift-f7, and alt-f5, shift-alt-f5 (its Go to Next Change).
[[bindings]]
keys = "f7"
command = "diff.next_change"
context = "DiffView"

[[bindings]]
keys = "shift-f7"
command = "diff.previous_change"
context = "DiffView"

[[bindings]]
keys = "alt-f5"
command = "diff.next_change"
context = "DiffView"

[[bindings]]
keys = "shift-alt-f5"
command = "diff.previous_change"
context = "DiffView"

# Next and previous change in an editor: VS Code's dirty-diff alt-f3 and
# shift-alt-f3.
[[bindings]]
keys = "alt-f3"
command = "git.next_change"
context = "editor"

[[bindings]]
keys = "shift-alt-f3"
command = "git.previous_change"
context = "editor"

# Stage and revert the change at the caret: Zed's git::StageAndNext (cmd-y,
# without the "and next") and git::Restore (cmd-alt-z). Off macOS they are
# ctrl-alt chords, which the editor reads as vim's <C-y> and <C-z>, so they
# stay out of vim's normal, visual and operator-pending modes. A proposed change keeps
# cmd-y and ctrl-alt-y for its own accept.
[[bindings]]
keys = "cmd-y"
command = "git.stage_hunk"
context = "editor && !proposal"
platform = "macos"

[[bindings]]
keys = "cmd-alt-z"
command = "git.revert_hunk"
context = "editor"
platform = "macos"

[[bindings]]
keys = "ctrl-alt-y"
command = "git.stage_hunk"
context = "editor && !proposal && (!vim.enabled || vim.mode == insert || vim.mode == replace)"
platform = "!macos"

[[bindings]]
keys = "ctrl-alt-z"
command = "git.revert_hunk"
context = "editor && (!vim.enabled || vim.mode == insert || vim.mode == replace)"
platform = "!macos"

# Toggle blame annotations in the gutter: Zed's git::Blame chord. Off macOS
# ctrl-alt-g is read as vim's <C-g>, so it stays out of vim's normal, visual
# and operator-pending modes, as ctrl-alt-y does.
[[bindings]]
keys = "cmd-alt-g b"
command = "git.toggle_blame_annotations"
context = "editor"
platform = "macos"

[[bindings]]
keys = "ctrl-alt-g b"
command = "git.toggle_blame_annotations"
context = "editor && (!vim.enabled || vim.mode == insert || vim.mode == replace)"
