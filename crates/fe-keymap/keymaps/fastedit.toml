context = "editor && vim.mode == normal && !vim.pending && !vim.replace_with_register"

[[bindings]]
keys = "g r n"
command = "lsp.rename"
context = "editor && vim.mode == normal && !vim.pending && !vim.replace_with_register"

[[bindings]]
keys = "g r a"
command = "lsp.code_actions"
context = "editor && vim.mode == normal && !vim.pending && !vim.replace_with_register"

[[bindings]]
keys = "g r i"
command = "nav.goto_implementation"
context = "editor && vim.mode == normal && !vim.pending && !vim.replace_with_register"

[[bindings]]
keys = "g r t"
command = "nav.goto_type_definition"
context = "editor && vim.mode == normal && !vim.pending && !vim.replace_with_register"

[[bindings]]
keys = "g shift-o"
command = "outline.show"
context = "editor && vim.mode == normal && !vim.pending"

[[bindings]]
keys = "shift-k"
command = "editor.show_hover"
context = "editor && vim.mode == normal && !vim.pending"

[[bindings]]
keys = "g r a"
command = "lsp.code_actions"
context = "editor && vim.visual && !vim.replace_with_register"

# Carets in vim's normal mode, which acts at each of them, and whose
# `escape` with nothing pending goes back to one: VSCodeVim's `gb` adds one
# at the word's next occurrence everywhere. On macOS, where no cmd key
# reaches vim, VS Code's cmd keys add them too; elsewhere `alt-shift-up` and
# `down`, which vim would read as the arrows.

[[bindings]]
keys = "g b"
command = "editor.add_caret_at_next_occurrence"
context = "editor && vim.mode == normal && !vim.pending"

[[bindings]]
keys = "cmd-d"
command = "editor.add_caret_at_next_occurrence"
context = "editor && vim.mode == normal && !vim.pending"
platform = "macos"

[[bindings]]
keys = "cmd-shift-l"
command = "editor.add_carets_at_all_occurrences"
context = "editor && vim.mode == normal && !vim.pending"
platform = "macos"

[[bindings]]
keys = { macos = "cmd-alt-up", default = "alt-shift-up" }
command = "editor.add_cursor_above"
context = "editor && vim.mode == normal && !vim.pending"

[[bindings]]
keys = { macos = "cmd-alt-down", default = "alt-shift-down" }
command = "editor.add_cursor_below"
context = "editor && vim.mode == normal && !vim.pending"

# The chat. The composer is an editor inside `chat_composer`, and the deepest
# context wins, so these name both frames, and the editor's own `enter` and
# `escape` leave the composer out rather than be shadowed there.
[[bindings]]
keys = { macos = "ctrl-cmd-i", default = "ctrl-alt-i" }
command = "chat.open"
context = "workbench"

[[bindings]]
keys = "enter"
command = "chat.send"
context = "chat_composer && editor"

[[bindings]]
keys = "shift-enter"
command = "editor.newline"
context = "chat_composer && editor"

[[bindings]]
keys = "escape"
command = "chat.stop"
context = "chat_composer && editor"

# Peek Definition's widget: escape closes it and enter opens its file. The
# excerpt is an editor inside `peek`, and the deepest context wins, so in it
# these name both frames: being last, they win over the editor's and vim's
# own at the same depth. In the editor showing it (`peek_shown`), escape
# closes it too, but for the completion menu's and vim's insert session's.
[[bindings]]
keys = "escape"
command = "peek.close"
context = "peek"

[[bindings]]
keys = "escape"
command = "peek.close"
context = "peek && editor"

[[bindings]]
keys = "enter"
command = "peek.open"
context = "peek && editor"

[[bindings]]
keys = "escape"
command = "peek.close"
context = "editor && peek_shown && !completion && vim.mode != insert && vim.mode != replace"

# Keyboard column (box) selection, as VS Code binds it on macOS; elsewhere
# its ctrl-shift-alt-arrow keys collide with Duplicate Rows, so none.

[[bindings]]
keys = "cmd-shift-alt-left"
command = "editor.column_select_left"
context = "editor && !vim.enabled"
platform = "macos"

[[bindings]]
keys = "cmd-shift-alt-right"
command = "editor.column_select_right"
context = "editor && !vim.enabled"
platform = "macos"

[[bindings]]
keys = "cmd-shift-alt-up"
command = "editor.column_select_up"
context = "editor && !vim.enabled"
platform = "macos"

[[bindings]]
keys = "cmd-shift-alt-down"
command = "editor.column_select_down"
context = "editor && !vim.enabled"
platform = "macos"

# The image viewer's zoom (VS Code's Image Preview has none of these keys;
# these are the browser's). Only in its own key context: the editor's keys
# are untouched.
[[bindings]]
keys = "secondary-="
command = "image.zoom_in"
context = "ImageViewer"

[[bindings]]
keys = "secondary-+"
command = "image.zoom_in"
context = "ImageViewer"

[[bindings]]
keys = "secondary--"
command = "image.zoom_out"
context = "ImageViewer"

[[bindings]]
keys = "secondary-0"
command = "image.zoom_fit"
context = "ImageViewer"

[[bindings]]
keys = "secondary-1"
command = "image.zoom_actual"
context = "ImageViewer"
