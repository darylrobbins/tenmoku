# fastedit's built-in keymap, for every platform: the first layer, which the
# user's keymap.toml overrides. See kiln-core's `keymap` module for the
# format. `secondary` is cmd on macOS and ctrl elsewhere; a binding whose
# keys differ elsewhere names them by platform (`keys = { macos = "..",
# default = ".." }`), and `platform` limits a binding to some platforms.
# Off macOS, PC keys stand in for macOS's own: ctrl-left for a word, home
# and end for the line, ctrl-home and ctrl-end for the document; app.hide,
# app.hide_others and window.minimize have no key there.
#
# A shifted punctuation key is named by what it types, without `shift`, as
# GPUI on Linux reports it: ctrl-shift-[ is `ctrl-{`, ctrl-shift-- `ctrl-_`.
#
# fe-keymap's build script generates each platform's text from this file
# (`DEFAULT_MACOS`, `DEFAULT_LINUX`), which tests use for a platform's
# bindings on any host.

[[bindings]]
keys = "left"
command = "editor.move_left"
context = "editor"

[[bindings]]
keys = "right"
command = "editor.move_right"
context = "editor"

[[bindings]]
keys = "up"
command = "editor.move_up"
context = "editor"

[[bindings]]
keys = "down"
command = "editor.move_down"
context = "editor"

[[bindings]]
keys = { macos = "alt-left", default = "ctrl-left" }
command = "editor.move_word_left"
context = "editor"

[[bindings]]
keys = { macos = "alt-right", default = "ctrl-right" }
command = "editor.move_word_right"
context = "editor"

[[bindings]]
keys = "cmd-left"
command = "editor.move_line_start"
context = "editor"
platform = "macos"

[[bindings]]
keys = "home"
command = "editor.move_line_start"
context = "editor"

[[bindings]]
keys = "cmd-right"
command = "editor.move_line_end"
context = "editor"
platform = "macos"

[[bindings]]
keys = "end"
command = "editor.move_line_end"
context = "editor"

[[bindings]]
keys = { macos = "cmd-up", default = "ctrl-home" }
command = "editor.move_document_start"
context = "editor"

[[bindings]]
keys = { macos = "cmd-down", default = "ctrl-end" }
command = "editor.move_document_end"
context = "editor"

[[bindings]]
keys = "pageup"
command = "editor.page_up"
context = "editor"

[[bindings]]
keys = "pagedown"
command = "editor.page_down"
context = "editor"

[[bindings]]
keys = "shift-left"
command = "editor.select_left"
context = "editor"

[[bindings]]
keys = "shift-right"
command = "editor.select_right"
context = "editor"

[[bindings]]
keys = "shift-up"
command = "editor.select_up"
context = "editor"

[[bindings]]
keys = "shift-down"
command = "editor.select_down"
context = "editor"

[[bindings]]
keys = { macos = "alt-shift-left", default = "ctrl-shift-left" }
command = "editor.select_word_left"
context = "editor"

[[bindings]]
keys = { macos = "alt-shift-right", default = "ctrl-shift-right" }
command = "editor.select_word_right"
context = "editor"

[[bindings]]
keys = "cmd-shift-left"
command = "editor.select_line_start"
context = "editor"
platform = "macos"

[[bindings]]
keys = "shift-home"
command = "editor.select_line_start"
context = "editor"

[[bindings]]
keys = "cmd-shift-right"
command = "editor.select_line_end"
context = "editor"
platform = "macos"

[[bindings]]
keys = "shift-end"
command = "editor.select_line_end"
context = "editor"

[[bindings]]
keys = { macos = "cmd-shift-up", default = "ctrl-shift-home" }
command = "editor.select_document_start"
context = "editor"

[[bindings]]
keys = { macos = "cmd-shift-down", default = "ctrl-shift-end" }
command = "editor.select_document_end"
context = "editor"

[[bindings]]
keys = "shift-pageup"
command = "editor.select_page_up"
context = "editor"

[[bindings]]
keys = "shift-pagedown"
command = "editor.select_page_down"
context = "editor"

[[bindings]]
keys = "secondary-a"
command = "editor.select_all"
context = "editor"

# Multi-cursor, as VS Code binds it, with vim off: with vim on, its keys
# (escape, ctrl-d and the rest) stay vim's in every mode, but for the ones
# that add carets in normal mode, in vim's layer. Completion's escape, later,
# wins while its menu shows.

[[bindings]]
keys = { macos = "cmd-alt-up", default = "alt-shift-up" }
command = "editor.add_cursor_above"
context = "editor && !vim.enabled"

[[bindings]]
keys = { macos = "cmd-alt-down", default = "alt-shift-down" }
command = "editor.add_cursor_below"
context = "editor && !vim.enabled"

[[bindings]]
keys = "secondary-d"
command = "editor.select_next_occurrence"
context = "editor && !vim.enabled"

[[bindings]]
keys = "secondary-shift-l"
command = "editor.select_all_occurrences"
context = "editor && !vim.enabled"

[[bindings]]
keys = "alt-shift-i"
command = "editor.split_selection_into_lines"
context = "editor && !vim.enabled"

[[bindings]]
keys = "escape"
command = "editor.single_selection"
context = "editor && !vim.enabled && !chat_composer"

# Row commands and line comments, as VS Code binds them. vim claims `ctrl-[`
# (escape) in every mode, so there the outdent is off with vim; shift-tab,
# alt-up, alt-down and the duplicate's keys reach vim's key handler in its
# normal, operator-pending and visual modes, so they work with vim off and in
# its insert and replace modes only.
[[bindings]]
keys = { macos = "cmd-]", default = "ctrl-]" }
command = "editor.indent"
context = "editor"

[[bindings]]
keys = "cmd-["
command = "editor.outdent"
context = "editor"
platform = "macos"

[[bindings]]
keys = "ctrl-["
command = "editor.outdent"
context = "editor && !vim.enabled"
platform = "!macos"

[[bindings]]
keys = "shift-tab"
command = "editor.outdent"
context = "editor && (!vim.enabled || vim.mode == insert || vim.mode == replace)"

[[bindings]]
keys = "ctrl-j"
command = "editor.join_lines"
context = "editor && (!vim.enabled || vim.mode == insert || vim.mode == replace)"
platform = "macos"

[[bindings]]
keys = "alt-up"
command = "editor.move_rows_up"
context = "editor && (!vim.enabled || vim.mode == insert || vim.mode == replace)"

[[bindings]]
keys = "alt-down"
command = "editor.move_rows_down"
context = "editor && (!vim.enabled || vim.mode == insert || vim.mode == replace)"

[[bindings]]
keys = "shift-alt-down"
command = "editor.duplicate_rows"
context = "editor && (!vim.enabled || vim.mode == insert || vim.mode == replace)"
platform = "macos"

[[bindings]]
keys = "ctrl-shift-alt-down"
command = "editor.duplicate_rows"
context = "editor && (!vim.enabled || vim.mode == insert || vim.mode == replace)"
platform = "!macos"

[[bindings]]
keys = { macos = "cmd-shift-k", default = "ctrl-shift-k" }
command = "editor.delete_rows"
context = "editor"

[[bindings]]
keys = { macos = "cmd-/", default = "ctrl-/" }
command = "editor.toggle_comment"
context = "editor"

[[bindings]]
keys = "backspace"
command = "editor.backspace"
context = "editor"

[[bindings]]
keys = "shift-backspace"
command = "editor.backspace"
context = "editor"

[[bindings]]
keys = "delete"
command = "editor.delete"
context = "editor"

[[bindings]]
keys = { macos = "alt-backspace", default = "ctrl-backspace" }
command = "editor.delete_word_left"
context = "editor"

[[bindings]]
keys = "enter"
command = "editor.newline"
context = "editor && !chat_composer"

[[bindings]]
keys = "tab"
command = "editor.tab"
context = "editor"

[[bindings]]
keys = { macos = "cmd-alt-[", default = "ctrl-{" }
command = "editor.fold"
context = "editor"

[[bindings]]
keys = { macos = "cmd-alt-]", default = "ctrl-}" }
command = "editor.unfold"
context = "editor"

[[bindings]]
keys = { macos = "ctrl-shift-cmd-right", default = "shift-alt-right" }
command = "editor.expand_selection"
context = "editor && !vim.enabled"

[[bindings]]
keys = { macos = "ctrl-shift-cmd-left", default = "shift-alt-left" }
command = "editor.shrink_selection"
context = "editor && !vim.enabled"

[[bindings]]
keys = "secondary-k secondary-0"
command = "editor.fold_all"
context = "editor"

[[bindings]]
keys = "secondary-k secondary-j"
command = "editor.unfold_all"
context = "editor"

# VS Code's chord: trim the trailing whitespace of every row.
[[bindings]]
keys = "secondary-k secondary-x"
