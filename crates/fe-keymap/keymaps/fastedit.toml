# Replace, as VS Code binds it on macOS, anywhere in the workbench: from a
# panel it opens in the active pane. Off macOS ctrl-alt-f is read as vim's
# <C-f>, so there it's off in an editor with vim on. Replace one is VS Code's cmd-shift-1, named by what it
# types: GPUI reports it as cmd-! on macOS too. `enter` in the replace input
# names `text_input` too, to beat `find.next`'s at its depth.
[[bindings]]
keys = "cmd-alt-f"
command = "find.show_replace"
context = "workbench"
platform = "macos"

[[bindings]]
keys = "ctrl-alt-f"
command = "find.show_replace"
