[[bindings]]
keys = "ctrl-r"
command = "workbench.open_recent"
context = "workbench && !terminal && !vim_line && !(editor && vim.enabled)"

[[bindings]]
keys = "secondary-p"
command = "quick_open.toggle"
context = "workbench"

# Linux only: the menu bar is drawn in the window, and F10 opens it, as in
