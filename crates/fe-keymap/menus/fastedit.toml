# fastedit's built-in menu bar, for every platform: native on macOS, drawn in
# the window elsewhere. A host replaces it with a table of its own, or
# extends it with a layer: see kiln-core's `menu` module for the format.
# Each item's shortcut is whatever the active keymap runs it with.
#
# macOS has an app menu; elsewhere its Settings… and Quit are in File, and
# macOS's Hide, Services, Minimize and Zoom are left out (`platform`).
# fe-keymap's tests check this table resolves, on each platform, to exactly
# default-macos.toml and default-linux.toml.

[[menus]]
name = "fastedit"
platform = "macos"

[[menus.items]]
title = "Hide fastedit"
command = "app.hide"

[[menus.items]]
