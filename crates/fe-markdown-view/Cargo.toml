[package]
name = "fe-markdown-view"
description = "The GPUI view of an `fe-markdown` document: blocks, inlines, highlighted code, tables, task lists and images, in the editor's theme."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dunce.workspace = true
fe-gpui.workspace = true
fe-markdown.workspace = true
fe-syntax.workspace = true
gpui.workspace = true
# Telling a raster image from an SVG by its bytes, as GPUI does.
image.workspace = true
kiln-ui.workspace = true
usvg.workspace = true

[dev-dependencies]
# The bundled fonts, which the screenshots example (and fe-gpui's font tests)
# register and pin, as Tenmoku does.
fe-fonts = { path = "../fe-fonts" }
# The screenshots example's scenes: the default themes, Yohen and Hakuji.
fe-config.workspace = true
# Fences are highlighted whatever the machine's load, as in fe-syntax's own tests.
fe-syntax = { workspace = true, features = ["no-query-budget"] }
gpui = { workspace = true, features = ["test-support", "leak-detection"] }
# The screenshots example renders with the real Metal platform.
gpui_platform = { workspace = true, features = ["test-support"] }
# The screenshots example's harness: settling, comparison and goldens.
kiln-platform = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
