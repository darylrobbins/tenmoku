[package]
name = "fe-nav"
description = "Search-based navigation: an index of the project's definitions. Must not depend on GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fe-buffer.workspace = true
fe-project.workspace = true
fe-syntax.workspace = true
fe-text.workspace = true
frizbee.workspace = true
# Decoding `index.scip` (ScipIndex).
protobuf.workspace = true
scip.workspace = true
# `O_NONBLOCK`, so opening a file swapped for a FIFO doesn't hang a build
# (already in the lock through fe-project).
libc.workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[[bench]]
name = "nav"
harness = false

[lints]
workspace = true
