[package]
name = "fe-project"
description = "Lazy, gitignore-aware project file tree and file watcher. Must not depend on GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kiln-l10n.workspace = true
dunce.workspace = true
frizbee.workspace = true
grep-matcher.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
libc.workspace = true
log.workspace = true
notify.workspace = true
# grep-regex's own parser (already in the lock through it), to read a
# search pattern's inline flags and anchors.
regex-syntax = "0.8"

# `NSFileManager`, to trash through a file reference URL (already in the lock
# through GPUI). Linux's freedesktop.org trash is moved into through directory
# handles in `fs_ops`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
] }

# Handle-relative, no-follow file calls and the Recycle Bin (src/win.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[features]
# Test builds of the crates above: `fs_ops::trash` moves into a test trash of
# the process's own, never the user's Trash, unless a thread holds
# `fs_ops::testing::real_trash()`. Never on in a release or normal build.
test-support = []

[dev-dependencies]
kiln-l10n = { workspace = true, features = ["lint"] }
criterion.workspace = true
# This crate's own integration tests trash into the test trash too.
fe-project = { path = ".", features = ["test-support"] }
tempfile.workspace = true

# Reads the freedesktop.org trash back in the tests.
[target.'cfg(target_os = "linux")'.dev-dependencies]
trash = "5.2.9"

[[bench]]
name = "tree"
harness = false

[[bench]]
name = "finder"
harness = false

[[bench]]
name = "search"
harness = false

[lints]
workspace = true
