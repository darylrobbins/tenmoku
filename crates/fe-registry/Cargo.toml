[package]
name = "fe-registry"
description = "The extension registry's index: generates, parses, signs and verifies it. Must not depend on GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "grammar-registry"
path = "src/bin/grammar-registry.rs"

[dependencies]
# The index's signature, with crates/fastedit/src/update_signature.rs (T1427),
# which src/lib.rs includes by #[path].
base64.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
