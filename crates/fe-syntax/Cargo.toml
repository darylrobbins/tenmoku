[package]
name = "fe-syntax"
description = "Tree-sitter parsing and highlighting. Must not depend on GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = [
    "rust",
    "python",
    "javascript",
    "typescript",
    "json",
    "toml",
    "go",
    "c",
    "cpp",
    "bash",
    "html",
    "css",
    "yaml",
    "markdown",
    "java",
    "ruby",
    "lua",
    "php",
    "csharp",
    "scala",
    "xml",
    "swift",
    "kotlin",
    "sql",
    "dockerfile",
    "make",
]
rust = ["dep:tree-sitter-rust"]
python = ["dep:tree-sitter-python"]
javascript = ["dep:tree-sitter-javascript"]
# TypeScript's highlights extend JavaScript's, as upstream configures them.
typescript = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
json = ["dep:tree-sitter-json"]
toml = ["dep:tree-sitter-toml-ng"]
go = ["dep:tree-sitter-go"]
c = ["dep:tree-sitter-c"]
# C++'s highlights extend C's.
cpp = ["dep:tree-sitter-cpp", "dep:tree-sitter-c"]
bash = ["dep:tree-sitter-bash"]
html = ["dep:tree-sitter-html"]
css = ["dep:tree-sitter-css"]
yaml = ["dep:tree-sitter-yaml"]
markdown = ["dep:tree-sitter-md"]
java = ["dep:tree-sitter-java"]
ruby = ["dep:tree-sitter-ruby"]
lua = ["dep:tree-sitter-lua"]
php = ["dep:tree-sitter-php"]
csharp = ["dep:tree-sitter-c-sharp"]
scala = ["dep:tree-sitter-scala"]
xml = ["dep:tree-sitter-xml"]
swift = ["dep:tree-sitter-swift"]
kotlin = ["dep:tree-sitter-kotlin-sg"]
sql = ["dep:tree-sitter-sequel"]
dockerfile = ["dep:tree-sitter-containerfile"]
make = ["dep:tree-sitter-make"]
# Highlight queries run to completion, as in this crate's tests, instead of
# stopping after `QUERY_BUDGET`. For the fuzz targets in `fuzz/`, which compare
# highlights and can't tell a cut-short result from a complete one.
no-query-budget = []

[dependencies]
fe-buffer.workspace = true
log.workspace = true
tree-sitter.workspace = true
tree-sitter-bash = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
tree-sitter-c-sharp = { workspace = true, optional = true }
tree-sitter-containerfile = { workspace = true, optional = true }
tree-sitter-cpp = { workspace = true, optional = true }
tree-sitter-css = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-html = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-json = { workspace = true, optional = true }
tree-sitter-kotlin-sg = { workspace = true, optional = true }
tree-sitter-lua = { workspace = true, optional = true }
tree-sitter-make = { workspace = true, optional = true }
tree-sitter-md = { workspace = true, optional = true }
tree-sitter-php = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-ruby = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-scala = { workspace = true, optional = true }
tree-sitter-sequel = { workspace = true, optional = true }
tree-sitter-swift = { workspace = true, optional = true }
tree-sitter-toml-ng = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-xml = { workspace = true, optional = true }
tree-sitter-yaml = { workspace = true, optional = true }

[dev-dependencies]
# Integration tests that compare highlights need them complete, whatever the
# machine's load. The crate itself gets this only under `cfg(test)`.
fe-syntax = { path = ".", default-features = false, features = ["no-query-budget"] }
criterion.workspace = true
proptest.workspace = true
rand.workspace = true

[[bench]]
name = "syntax"
harness = false

[[bench]]
name = "flat"
harness = false

[[bench]]
name = "tree_ratio"
harness = false

[[bench]]
name = "driver"
harness = false

[lints]
workspace = true
