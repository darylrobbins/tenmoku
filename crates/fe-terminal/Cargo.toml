[package]
name = "fe-terminal"
description = "Terminal sessions: a pty running a shell, its VT grid, scrollback and selection, and xterm key encoding, on alacritty_terminal. Must not depend on GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alacritty_terminal.workspace = true
async-channel.workspace = true
polling.workspace = true

# Windows' pty is ConPTY, which alacritty_terminal opens itself.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }
rustix-openpty.workspace = true

# Whether the app runs elevated, which prefixes its consoles' titles.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
dunce.workspace = true
libc.workspace = true
tempfile.workspace = true

[lints]
workspace = true
