# Text that goes into the buffer, not the UI: format strings that only join
# rows, indentation and register text with line breaks.

[[literal]]
file = "src/ex/put.rs"
text = "{payload}\n"
reason = "Buffer text: the put rows and a line break"

[[literal]]
file = "src/ex/put.rs"
text = "\n{payload}"
reason = "Buffer text: a line break and the put rows"

[[literal]]
file = "src/visual/put.rs"
text = "{payload}\n"
reason = "Buffer text: the put rows and a line break"

[[literal]]
file = "src/visual/put.rs"
text = "\n{repeated}"
reason = "Buffer text: a line break and the repeated rows"

[[literal]]
file = "src/visual/put.rs"
text = "\n{body}"
reason = "Buffer text: a line break and the put rows"

[[literal]]
file = "src/feature/surround.rs"
text = "{own_open}\n{indent}{unit}"
reason = "Buffer text: a surrounding pair's opening on a row of its own"

[[literal]]
file = "src/feature/surround.rs"
text = "\n{indent}{own_close}"
reason = "Buffer text: a surrounding pair's closing on a row of its own"

[[literal]]
file = "src/feature/surround.rs"
text = "{indent}{own_open}\n"
reason = "Buffer text: a surrounding pair's opening on a row of its own"

[[literal]]
file = "src/g_operators.rs"
text = "\n{indent}"
reason = "Buffer text: a line break and the row's indentation"

[[literal]]
file = "src/replace.rs"
text = "\n{indent}"
reason = "Buffer text: a line break and the row's indentation"

[[literal]]
file = "src/insert/keys.rs"
text = "{first}\n{}"
reason = "Buffer text: two rows joined by a line break"

# `:set`'s report of an option: its name and value, which nvim prints the
# same in every language.

[[literal]]
file = "src/ex/set.rs"
text = "  {full}"
reason = "An option's name, as `:set {option}?` prints it"

[[literal]]
file = "src/ex/set.rs"
text = "no{full}"
reason = "An option's name, as `:set {option}?` prints it when off"

[[literal]]
file = "src/ex/set.rs"
text = "  scrolloff={}"
reason = "An option's name and value, as `:set {option}?` prints them"

[[literal]]
file = "src/ex/set.rs"
text = "  tabstop={}"
reason = "An option's name and value, as `:set {option}?` prints them"

[[literal]]
file = "src/ex/set.rs"
text = "  shiftwidth={}"
reason = "An option's name and value, as `:set {option}?` prints them"

[[literal]]
file = "src/ex/set.rs"
text = "  clipboard=unnamedplus"
reason = "An option's name and value, as `:set {option}?` prints them"

[[literal]]
file = "src/ex/set.rs"
text = "  clipboard="
reason = "An option's name and value, as `:set {option}?` prints them"

# An E-code before its message: the code is an id, kept outside the catalogue
# as nvim keeps it in every language (i18n design, section 5).

[[literal]]
file = "src/messages.rs"
text = "{code}: {text}"
reason = "An E-code (an id, `E492`) before its catalogued message, as nvim prints it in every locale"

# Vim syntax, as typed, and the regex fe-vim translates a pattern to.

[[literal]]
file = "src/ex/lines.rs"
text = ":sort {ch}"
reason = "The `:sort` flag fe-vim doesn't take, as typed"

[[literal]]
file = "src/search.rs"
text = "* after \\%("
reason = "The pattern atom fe-vim doesn't translate, as typed"

[[literal]]
file = "src/search.rs"
text = "[\\t ]"
reason = "A regex class `\\s` translates to"

[[literal]]
file = "src/search.rs"
text = "[^\\t ]"
reason = "A regex class `\\S` translates to"

[[literal]]
file = "src/search.rs"
text = "(?P<vimgroup{number}>{})"
reason = "A regex capture group a pattern's `\\(` translates to"

[[literal]]
file = "src/search.rs"
text = "{source}\u0000{ignore_case}\u0000backtrack\u0000{word:?}{rows_key}"
reason = "A compiled pattern's cache key"

[[literal]]
file = "src/headless.rs"
text = "{0:?} isn't vim's: it was forwarded"
reason = "HeadlessVim's error for tests and tools that feed keys; no host shows it"
