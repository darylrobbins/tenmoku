# Changelist cases for fe-vim's oracle: `g;` and `g,` with and without
# counts, past both ends and with no change made (the failing key last:
# nvim flushes the keys after it); changes close on a row taking the
# newest entry's place (within 79 columns) and far ones adding one; where
# an insert session's entry is; `.`, `u` and the 100-entry limit; entries
# following rows deleted or put in above; `'.` and `` `. `` as motions and
# operator targets; the keys in a visual mode (nvim beeps) and after an
# operator (cancelled); and the entries `o`, `cw`, `:s`, `:d`, `J`, `p`,
# `u` and `<C-r>` make. The 100 changes are typed out: a macro's run is one
# undoable change in nvim, adding one entry.
# The oracle's load (nvim_buf_set_lines) is itself a change: nvim's list
# starts with an entry at (0, 0), which no file loaded has. So each case's
# first change is on row 0 within 79 columns of column 0, which takes that
# entry's place, and the cases with no change are fed `<Esc>` in nvim, which
# changes nothing, as `g;` and `g,` do with an empty list (E664).
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in changelist.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

