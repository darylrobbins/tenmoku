# Commenting cases for fe-vim's oracle (nvim 0.12's built-in commenting,
# `:help commenting`): gcc with counts, commenting and uncommenting;
# gc{motion} over rows, indented rows and mixed rows; visual gc, charwise,
# linewise and blockwise; . and u; and gc as a text object after d y c and
# gc. Every case sets 'commentstring' to `# %s`, which the harness gives
# HeadlessVim as the line token `#`. No case toggles a blank row, a row
# left empty but for the token, or rows indented with both tabs and spaces:
# fastedit's toggle differs there (see src/feature/comment.rs).
# Hand-written (by a script): name, buffer (rows joined with \n, no trailing
# newline), cursor = [row, byte column], keys in vim notation and set. What
# nvim does with each is recorded in commentary.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "gcc"
buffer = "foo\nbar\nbaz"
cursor = [0, 1]
keys = "gcc"
set = "commentstring=#\\ %s"

[[case]]
