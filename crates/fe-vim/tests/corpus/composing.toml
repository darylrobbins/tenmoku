# Cases for fe-vim's oracle of / ? n and :s over decomposed text: a base
# character and the composing characters after it (U+0301, U+0323, U+0302)
# are one character to nvim, for `.`, classes, collections, literals and
# every match's start and end. A case that fails with E486 must be last: nvim
# flushes the keys after an error, and its last substitute leaks between
# cases, so a case that uses `~` or `&` makes its own first. Hand-written:
# name, buffer (rows joined with \n, no trailing newline), cursor = [row, byte
# column] and keys in vim notation. What nvim does with each is recorded in
# composing.expected.json by the ignored `record_corpus_with_neovim` test;
# edit a case, then re-record.

[[case]]
name = "dot_global"
buffer = "áb é"
cursor = [0, 0]
keys = ":s/./X/g<CR>"

