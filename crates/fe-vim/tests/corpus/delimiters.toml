# Delimiter object cases for fe-vim's oracle: i[ a[ i< a< i` a` it at,
# with d c y, counts, nesting, the caret on a bracket or a tag, rows spanned,
# missing pairs (the failing key last), the visual modes and dot. Hand-written:
# name, buffer (rows joined with \n, no trailing newline), cursor = [row, byte
# column] and keys in vim notation (`<lt>` for `<`). What nvim does with each is
# recorded in delimiters.expected.json by the ignored `record_corpus_with_neovim`
# test; edit a case, then re-record.

