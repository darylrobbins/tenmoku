# Edit cases for fe-vim's oracle: J with counts, before a ) row, with an
# empty row and after trailing white space; r with counts and with too few
# graphemes; ~ with counts and at a row's end; and u and <C-r> with counts.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in edits.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record. A case
# never undoes more changes than it made: nvim would undo the buffer's set-up.

# J.
[[case]]
name = "J_two_rows"
buffer = "foo\n  bar\nbaz\n)qux\n\nend"
cursor = [0, 1]
keys = "J"

[[case]]
name = "J_count_1_is_2"
buffer = "foo\n  bar\nbaz\n)qux\n\nend"
cursor = [0, 1]
keys = "1J"

[[case]]
name = "J_count_3"
buffer = "foo\n  bar\nbaz\n)qux\n\nend"
cursor = [0, 1]
keys = "3J"

[[case]]
name = "J_count_past_end"
buffer = "foo\n  bar\nbaz\n)qux\n\nend"
cursor = [0, 1]
keys = "9J"

[[case]]
name = "J_before_paren_row"
buffer = "foo\n  bar\nbaz\n)qux\n\nend"
cursor = [2, 1]
keys = "J"

[[case]]
name = "J_paren_after_indent"
buffer = "a\n  )b"
cursor = [0, 0]
keys = "J"

[[case]]
name = "J_onto_empty_row"
buffer = "foo\n  bar\nbaz\n)qux\n\nend"
cursor = [3, 1]
keys = "J"

[[case]]
name = "J_from_empty_row"
buffer = "foo\n  bar\nbaz\n)qux\n\nend"
cursor = [4, 0]
keys = "J"

[[case]]
name = "J_over_empty_row"
buffer = "foo\n  bar\nbaz\n)qux\n\nend"
cursor = [3, 1]
keys = "3J"

[[case]]
name = "J_after_trailing_white_space"
buffer = "foo  \n   bar"
cursor = [0, 1]
keys = "J"

[[case]]
name = "J_after_tab"
buffer = "ab\t\ncd"
cursor = [0, 0]
keys = "J"

[[case]]
name = "J_blank_row_then_text"
buffer = "a\n  \nx"
cursor = [0, 0]
keys = "3J"

[[case]]
name = "J_trailing_blank_then_empty"
buffer = "ab  \n\n  cd"
cursor = [0, 0]
keys = "3J"

[[case]]
name = "J_strips_tab_indent"
buffer = "a\n\tb"
cursor = [0, 0]
keys = "J"

[[case]]
name = "J_on_last_row"
buffer = "foo\n  bar\nbaz\n)qux\n\nend"
cursor = [5, 1]
keys = "J"

[[case]]
name = "J_count_3_on_last_row"
buffer = "ab\ncd"
cursor = [1, 1]
keys = "3J"

[[case]]
name = "J_then_x"
buffer = "ab\n  cd"
cursor = [0, 0]
keys = "Jx"


