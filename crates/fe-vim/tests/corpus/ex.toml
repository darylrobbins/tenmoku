# Ex command-line cases for fe-vim's oracle: `:{range}` alone, `:d` and
# `:noh`, with ranges of numbers, `.`, `$`, `%`, `'<` and `'>`, patterns and
# offsets, separated by `,` or `;`; a count or a visual mode before `:`; and
# the errors (a case ends at one: nvim flushes the keys after it, and asks
# before swapping a backwards range, which headless nvim declines).
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in ex.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

