# Ex `|` cases for fe-vim's oracle: several commands on one line, run in turn
# as one undo step (so `u` after, which puts the cursor where nvim's does),
# stopping at the first that fails, and where `|` isn't a separator: `\|` in
# a pattern, `:s`'s pattern and replacement, a `"` comment, and the commands
# that take the rest of the line (`:g`, `:normal`, `:w`). An error ends a
# case: nvim flushes the keys after it.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in ex_bar.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "bar_two_substitutes_then_undo"
buffer = "abc"
cursor = [0, 0]
keys = ':s/a/A/ | s/c/C/<CR>u'

[[case]]
name = "bar_two_substitutes"
buffer = "abc"
cursor = [0, 0]
keys = ':s/a/A/ | s/c/C/<CR>'

