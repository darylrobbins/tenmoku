# `:delm[arks]` and `:cle[arjumps]` cases for fe-vim's oracle: letters,
# ranges, spaces between, `A`-`Z`, the visual marks `<` and `>` (one at a
# time, forward and backward), `[ ] ^ .`, `:delmarks!`, digits (nvim has
# `0`-`9`, fe-vim none), the jump mark (E475), the errors (E471, E474, E475,
# E481) and the marks deleted before a bad one; then a `'x` that fails or
# a `<C-o>` after `:clearjumps`. An error ends a case: nvim flushes the keys
# after it.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in ex_delmarks.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "delmarks_one"
buffer = "one two\n  three four\nfive six\nseven\neight nine"
