# :g[lobal][!], :v[global] and :norm[al][!] cases for fe-vim's oracle: :g
# and :v with ex commands (:d, :m, :t, :s, :j, :>, :y, :normal and none),
# ranges, other delimiters, the last search's pattern, rows the command
# deletes, joins or moves; :normal on the cursor's row and over a range,
# unfinished commands, insert mode left open; often then `u` (each is one
# undo step) or `<C-r>`. An error ends a case: nvim flushes the keys after
# it (an error inside :g doesn't). Hand-written: name, buffer (rows joined
# with \n, no trailing newline), cursor = [row, byte column] and keys in
# vim notation. What nvim does with each is recorded in
# ex_global.expected.json by the ignored `record_corpus_with_neovim` test;
# edit a case, then re-record.

