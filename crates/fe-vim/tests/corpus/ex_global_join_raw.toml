# :g following its rows through gJ joins, as through J (ex_global.toml's J
# cases with gJ, plus indented rows, where gJ keeps the indent). Hand-written;
# `oracle_keys` quotes ctrl-v for nvim's command line (`<lt>C-v>` for fe's `:normal`);
# recorded in ex_global_join_raw.expected.json by the ignored
# `record_corpus_with_neovim` test.

[[case]]
name = "global_normal_gJ_from_empty_row"
buffer = "\nx\ntail"
cursor = [0, 0]
keys = ":g/^/normal gJ<CR>"

[[case]]
name = "global_normal_gJ_x"
buffer = "a\nb\nc\nd"
cursor = [0, 0]
keys = ":g/./normal gJx<CR>"

[[case]]
name = "global_normal_gJ_x_pattern"
buffer = "ax\nb\ncx\nd\nex"
cursor = [0, 0]
keys = ":g/x/normal gJx<CR>"

[[case]]
name = "global_normal_2gJ"
buffer = "a\nb\nc\nd\ne"
cursor = [0, 0]
keys = ":g/^/normal 2gJ<CR>"

[[case]]
name = "global_normal_3gJ_empty_rows"
buffer = "\n\nx\n\ny\nz"
cursor = [0, 0]
keys = ":g/^$/normal 3gJ<CR>"

[[case]]
name = "global_v_normal_gJ"
buffer = "a\nx\nb\nx\nc\nd"
cursor = [0, 0]
keys = ":v/x/normal gJ<CR>"

[[case]]
name = "global_normal_gJ_indented"
buffer = "a\n  b\n    c\nd"
cursor = [0, 0]
keys = ":g/^/normal gJ<CR>"

[[case]]
name = "global_normal_gJ_indented_x"
buffer = "a\n  b\n    c\nd\n  e"
cursor = [0, 0]
keys = ":g/^[a-d]/normal gJx<CR>"

[[case]]
name = "global_normal_gJ_last_row"
buffer = "a\nb\nlast"
cursor = [0, 0]
keys = ":g/last/normal gJ<CR>"

[[case]]
name = "global_normal_gJ_last_row_all"
buffer = "a\nb\nlast"
cursor = [0, 0]
keys = ":g/^/normal gJ<CR>"

[[case]]
name = "global_normal_visual_V_gJ"
buffer = "\nx\ntail\nend"
cursor = [0, 0]
keys = ":g/^/normal VjgJ<CR><Esc>"

[[case]]
name = "global_normal_visual_V_gJ_indented"
buffer = "a\n  b\n  c\n  d\ne"
cursor = [0, 0]
keys = ":g/^/normal VjgJ<CR><Esc>"

[[case]]
name = "global_normal_visual_v_gJ"
buffer = "ab\n  cd\nef\n  gh\nij"
cursor = [0, 0]
keys = ":g/^/normal vjgJ<CR><Esc>"

[[case]]
name = "global_normal_visual_block_gJ_gv"
buffer = "ab\n  cd\nef\n  gh\nij"
cursor = [0, 0]
keys = "<C-v>j<Esc>:g/^/normal gvgJ<CR><Esc>"

[[case]]
name = "global_normal_visual_block_gJ"
buffer = "ab\n  cd\nef\n  gh\nij"
cursor = [0, 0]
keys = ":g/^/normal <lt>C-v>jgJ<CR><Esc>"
oracle_keys = ":g/^/normal <C-v><C-v>jgJ<CR><Esc>"

[[case]]
name = "global_normal_repeat_gJ"
buffer = "a\n\nb\nc\nd"
cursor = [0, 0]
keys = "gJ:g/^/normal .<CR>"

[[case]]
name = "global_normal_repeat_gJ_indented"
buffer = "a\n  b\n  c\n  d\n  e\nf"
cursor = [0, 0]
keys = "gJ:g/^/normal .<CR>"

[[case]]
name = "global_normal_repeat_count_gJ"
buffer = "a\nb\nc\nd\ne\nf\ng"
cursor = [0, 0]
keys = "3gJ:g/^/normal .<CR>"

[[case]]
name = "global_normal_repeat_visual_gJ"
buffer = "a\n  b\nc\n  d\ne\nf"
cursor = [0, 0]
keys = "VjgJ:g/^/normal .<CR>"

[[case]]
name = "global_normal_gJ_undo"
buffer = "a\n  b\nc\n  d\ne"
cursor = [0, 0]
keys = ":g/^/normal gJ<CR>u"

[[case]]
name = "global_normal_gJ_undo_redo"
buffer = "a\n  b\nc\n  d\ne"
cursor = [0, 0]
keys = ":g/^/normal gJ<CR>u<C-r>"
