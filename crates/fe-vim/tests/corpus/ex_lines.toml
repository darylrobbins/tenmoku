# Ex line-command cases for fe-vim's oracle: `:y[ank]`, `:j[oin]`,
# `:m[ove]`, `:t` and `:co[py]`, `:>` and `:<`, and `:sor[t]`, with no range,
# a range (numbers, marks, patterns, a visual one), counts and destinations,
# then often `u` (each command is one undo step, and `u` puts the cursor
# where nvim's does). An error ends a case: nvim flushes the keys after it.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in ex_lines.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

# :y[ank] [x] [count]

[[case]]
name = "yank_line"
buffer = "  aa\nbb\n  cc\ndd\nee"
cursor = [2, 3]
keys = ":y<CR>"

[[case]]
name = "yank_range_into_register"
buffer = "  aa\nbb\n  cc\ndd\nee"
cursor = [2, 3]
keys = ":2,3y a<CR>"

[[case]]
name = "yank_count"
buffer = "  aa\nbb\n  cc\ndd\nee"
cursor = [1, 1]
keys = ":yank 2<CR>"

[[case]]
name = "yank_range_register_count"
buffer = "  aa\nbb\n  cc\ndd\nee"
cursor = [0, 0]
keys = ":1,2ya b 9<CR>"

[[case]]
