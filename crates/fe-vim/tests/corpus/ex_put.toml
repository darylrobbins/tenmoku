# Ex `:pu[t][!] [x]` cases for fe-vim's oracle: a register's text put as
# whole lines below the range's line (above with `!`, at the top with
# `:0pu`), from the unnamed, a named, a numbered, a block and an empty
# register, then often `u` and `<C-r>` (a put is one undo step). An error
# ends a case: nvim flushes the keys after it.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in ex_put.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "put_unnamed_below"
buffer = "a\nb\nc"
cursor = [0, 0]
keys = "yy:pu<CR>"

[[case]]
name = "put_bang_charwise_above"
buffer = "a\nb\nc"
cursor = [1, 0]
keys = "yiw:pu!<CR>"

[[case]]
name = "put_line_zero"
buffer = "a\nb\nc"
cursor = [1, 0]
keys = "yy:0pu<CR>"

[[case]]
name = "put_last_line"
buffer = "a\nb\nc"
cursor = [0, 0]
keys = "yy:$pu<CR>"

[[case]]
name = "put_named_register_with_address"
buffer = "a\n  b\nc"
cursor = [1, 0]
keys = "\"ayy:3pu a<CR>"

[[case]]
name = "put_named_register_blank_before_name"
buffer = "a\n  b\nc"
cursor = [1, 0]
keys = "\"byy:1pu  b<CR>"

[[case]]
name = "put_bang_with_address"
buffer = "a\n  b\nc"
cursor = [1, 0]
keys = "\"ayy:3pu! a<CR>"

[[case]]
name = "put_bang_line_zero"
buffer = "a\nb\nc"
cursor = [1, 0]
keys = "yy:0pu!<CR>"

[[case]]
name = "put_numbered_register"
buffer = "a\nb\nc\nd"
cursor = [0, 0]
keys = "dddd:pu 3<CR>"

[[case]]
name = "put_numbered_register_one"
buffer = "a\nb\nc\nd"
cursor = [0, 0]
keys = "dd:pu 1<CR>"

[[case]]
name = "put_multiline_register"
buffer = "a\n  b\nc\nd"
cursor = [0, 0]
keys = "y2j:4pu<CR>"

[[case]]
name = "put_multiline_register_above"
buffer = "a\n  b\nc\nd"
cursor = [0, 0]
keys = "y2j:3pu!<CR>"

[[case]]
name = "put_block_register"
buffer = "abc\ndef\nghi"
cursor = [0, 0]
keys = "<C-v>jl\"ay:$pu a<CR>"

[[case]]
name = "put_empty_register_fails"
buffer = "a\nb\nc"
cursor = [1, 0]
keys = ":pu z<CR>"

[[case]]
name = "put_unset_unnamed_fails"
buffer = "a\nb\nc"
cursor = [1, 0]
keys = ":pu<CR>"

[[case]]
name = "put_then_undo"
buffer = "a\n  b\nc"
cursor = [1, 0]
keys = "yy:3pu<CR>u"

[[case]]
name = "put_then_undo_above"
buffer = "a\nb\nc"
cursor = [2, 0]
keys = "yy:0pu<CR>u"

[[case]]
name = "put_then_redo"
buffer = "a\n  b\nc"
cursor = [1, 0]
keys = "yy:3pu<CR>u<C-r>"

[[case]]
name = "put_then_redo_top"
buffer = "a\nb\nc"
cursor = [2, 0]
keys = "yy:0pu<CR>u<C-r>"

[[case]]
name = "put_does_not_repeat"
buffer = "a\nb\nc"
cursor = [0, 0]
keys = "x:pu<CR>."

[[case]]
name = "put_writes_no_register"
buffer = "a\nb\nc"
cursor = [0, 0]
keys = "yyj:pu<CR>\"1p"

[[case]]
name = "put_range_last_line"
buffer = "a\nb\nc\nd"
cursor = [0, 0]
keys = "yy:1,3pu<CR>"

[[case]]
name = "put_search_address"
buffer = "a\nb\nc\nd"
cursor = [0, 0]
keys = "yy:/c/pu<CR>"

[[case]]
name = "put_past_last_line_fails"
buffer = "a\nb\nc"
cursor = [0, 0]
keys = "yy:9pu<CR>"

[[case]]
name = "put_from_global"
buffer = "x1\ny\nx2"
cursor = [1, 0]
keys = "\"ayy:g/x/pu a<CR>"

[[case]]
name = "put_from_global_undo"
buffer = "x1\ny\nx2"
cursor = [1, 0]
keys = "\"ayy:g/x/pu a<CR>u"

[[case]]
name = "put_search_register"
buffer = "foo\nbar"
cursor = [0, 0]
keys = "/bar<CR>:pu /<CR>"

[[case]]
name = "put_long_name"
buffer = "a\nb"
cursor = [0, 0]
keys = "yy:put<CR>"

[[case]]
name = "put_then_redo_bang"
buffer = "a\nb\nc\nd"
cursor = [0, 0]
keys = "yy:3pu!<CR>u<C-r>"

[[case]]
name = "put_then_redo_column"
buffer = "aaaa\nbbbb\ncccc\ndddd"
cursor = [3, 3]
keys = "yy:2pu<CR>u<C-r>"

[[case]]
name = "put_then_undo_column"
buffer = "aaaa\nbbbb\ncccc\ndddd"
cursor = [3, 3]
keys = "yy:1pu<CR>u"

[[case]]
name = "put_then_redo_multiline"
buffer = "aaaa\nbbbb\ncccc\ndddd"
cursor = [0, 2]
keys = "y2j:4pu<CR>u<C-r>"

[[case]]
name = "put_then_undo_bang_column"
buffer = "aaaa\nbbbb\ncccc\ndddd"
cursor = [0, 2]
keys = "yy:3pu!<CR>u"
