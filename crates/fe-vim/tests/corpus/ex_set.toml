# Ex `:set` cases for fe-vim's oracle: each a `:set` and then an edit it
# changes (`>>`, `:>` and a block `>`, under shiftwidth, tabstop and expandtab,
# starting from the oracle's ts=4 sw=4 et). `:set ts=0` and the other
# malformed forms fail, and what an earlier argument set stays set. An
# error ends a case: nvim flushes the keys after it, so the ones after it
# here are flushed too.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in ex_set.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "shift_after_sw2"
buffer = "abc\ndef"
cursor = [0, 0]
keys = ":set sw=2<CR>>>"

[[case]]
name = "shift_after_shiftwidth_long"
buffer = "abc\ndef"
cursor = [1, 0]
keys = ":set shiftwidth=3<CR>>>j>>"

