# Ex `:u[ndo]` and `:red[o]` cases for fe-vim's oracle: they undo and redo as
# `u` and `<C-r>` do, `:undo 0` undoes every change, and `:undo {N}` for N
# above 0 (nvim's undo tree numbers, which fe-vim's linear history lacks) is
# one fe-vim refuses, so only a change number nvim hasn't got (its E830,
# which ends the case) is here. A bang is
# `:undo`'s own and an error for `:redo`. An error ends a case: nvim
# flushes the keys after it.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in ex_undo.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "undo_once"
buffer = "abc\ndef\nghi"
cursor = [0, 0]
keys = "xx:undo<CR>"

[[case]]
name = "undo_abbreviated_u"
buffer = "abc\ndef\nghi"
cursor = [1, 1]
keys = "x:u<CR>"

[[case]]
name = "undo_abbreviated_un"
buffer = "abc\ndef\nghi"
cursor = [1, 1]
keys = "xjx:un<CR>"

[[case]]
name = "undo_after_dd"
buffer = "a\nb\nc\nd"
cursor = [1, 0]
keys = "dd:undo<CR>"

[[case]]
name = "undo_after_insert"
buffer = "abc\ndef"
cursor = [0, 1]
keys = "ixy<Esc>:undo<CR>"

[[case]]
name = "undo_twice"
buffer = "abc\ndef\nghi"
cursor = [0, 0]
keys = "xjxjx:undo<CR>:undo<CR>"

[[case]]
name = "undo_then_undo_key"
buffer = "abc\ndef\nghi"
cursor = [0, 0]
keys = "xjxjx:undo<CR>u"

[[case]]
name = "redo_after_undo"
buffer = "abc\ndef\nghi"
cursor = [0, 0]
keys = "xjx:undo<CR>:redo<CR>"

[[case]]
name = "redo_abbreviated_red"
