keys = "xjxu:redo<CR>"

[[case]]
name = "redo_with_nothing_to_redo_fails"
buffer = "abc\ndef"
cursor = [0, 0]
keys = "x:redo<CR>"

[[case]]
name = "redo_then_undo_key"
buffer = "abc\ndef"
cursor = [0, 0]
keys = "xjxu:redo<CR>u"

[[case]]
name = "undo_zero_undoes_all"
buffer = "abc"
cursor = [0, 0]
keys = "xx:undo 0<CR>"

[[case]]
name = "undo_zero_many_changes"
