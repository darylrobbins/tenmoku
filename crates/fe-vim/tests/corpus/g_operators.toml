# Cases for the g operators (gu gU g~ g? gq gw) in fe-vim's oracle: the
# case operators and rot13 over motions, objects, counts and their doubled
# forms (both spellings), in v, V and ctrl-v, over non-ASCII letters, with
# dot and u after; gq and gw over long, indented and several paragraphs'
# rows, a word longer than 79 columns, the visual modes, marks, dot and u.
# No motion or object of another breadth card. Each case: name, buffer
# (rows joined with \n, no trailing newline), cursor = [row, byte column]
# and keys in vim notation. What nvim does with each is recorded in
# g_operators.expected.json by the ignored `record_corpus_with_neovim` test;
# edit a case, then re-record.

# gu gU g~ g? over w, $, j and k, iw and aw, and counts.
