# Cases for fe-vim's oracle of the command-line histories (`:help
# cmdline-history`, `:help c_<Up>`): `<Up>` and `<Down>` on `/`, `?` and
# `:` lines, recall by the prefix typed, `<Down>` back to what was typed, an
# edit starting a new prefix from the entry shown, `?` sharing `/`'s history
# (an entry's delimiters swapped), a repeated line moved to the newest, `:`
# history apart from the search history, offsets recalled with their
# pattern, and recalls under an operator, in visual mode and after a visual
# `:`'s prefill, a line cancelled with `<Esc>` or `<C-c>` (kept; an empty one
# isn't), and the patterns `*`, `#`, `:s`, `:g` and an ex address add to the
# search history. A failing search is a case's last key.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in history.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "up"
buffer = "x a b a b a b"
cursor = [0, 0]
keys = "/a<CR>/b<CR>0/<Up><CR>"

[[case]]
name = "up_up"
buffer = "x a b a b a b"
cursor = [0, 0]
keys = "/a<CR>/b<CR>0/<Up><Up><CR>"

