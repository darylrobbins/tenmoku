# Increment cases for fe-vim's oracle: <C-a> and <C-x> on decimal, negative,
# hex (both cases), binary and zero-led numbers, one after the caret, none on
# the row, counts, crossing zero, the 64-bit edges, a word like x1, `.`, `u`,
# and in a visual mode (every kind, `g<C-a>`, `g<C-x>`, `.`). Hand-written:
# name, buffer (rows joined with \n, no trailing newline), cursor = [row,
# byte column] and keys in vim notation. What nvim does with each is recorded
# in increment.expected.json by the ignored `record_corpus_with_neovim` test;
# edit a case, then re-record.

