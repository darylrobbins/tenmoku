# Insert-session cases for fe-vim's oracle: i a I A o O with counts, the
# change operator over motions and text objects (cw on a word and on white
# space), cc C s S on indented rows, <CR> and <BS> typed in a session, and
# <Esc> at a row's start. Hand-written: name, buffer (rows joined with \n,
# no trailing newline), cursor = [row, byte column] and keys in vim notation.
# What nvim does with each is recorded in insert.expected.json by the
# ignored `record_corpus_with_neovim` test; edit a case, then re-record.
#
# Typed line breaks and backspaces go through fe-editor's newline and
# backspace, which aren't nvim's 'autoindent' and 'smarttab': no <CR> here
# before blanks (nvim drops them, fe-editor moves them to the new row).

# i a I A o O, and their counts.
[[case]]
name = "i_before_caret"
buffer = "one two three\nfour five"
cursor = [0, 4]
keys = "iXY<Esc>"

[[case]]
name = "a_after_caret"
buffer = "one two three\nfour five"
cursor = [0, 4]
keys = "aXY<Esc>"

