# Insert-mode keyword completion cases for fe-vim's oracle: <C-n> and <C-p>
# complete the keyword before the caret from the buffer's words, cycling
# through them and back to the typed keyword; <C-e> puts it back, <C-y> and
# any other key keep the candidate. With nvim's defaults ('complete'
# .,w,b,u,t, 'completeopt' menu,popup); the oracle wipes every other buffer,
# so only the current one has words.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in insert_completion.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "ctrl_n_first_match"
buffer = "foo food fool\n\n-"
cursor = [1, 0]
keys = "if<C-n><Esc>"

