# Insert-mode <C-t> and <C-d> cases for fe-vim's oracle: the row's indent
# one shift width (4) wider or narrower, 0<C-d> and ^<C-d>, with . and a
# count repeating them, in insert and replace mode.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in insert_indent_keys.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "ctrl_t_indents"
buffer = "foo"
cursor = [0, 0]
keys = "ia<C-t>b<Esc>"

[[case]]
name = "ctrl_t_twice"
buffer = "foo"
cursor = [0, 0]
keys = "ia<C-t><C-t>b<Esc>"

