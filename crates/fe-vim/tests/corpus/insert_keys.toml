# Insert-mode <C-w> and <C-u> cases for fe-vim's oracle: the word, and the
# text typed on the row (or with none, all before the caret), deleted before
# the caret, each stopping once at where the insert began and joining rows
# at a row's start, with . and a count replaying them, in insert and replace
# mode, and in a macro.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation; a key that fails is
# a case's last key. What nvim does with each is recorded in
# insert_keys.expected.json by the ignored `record_corpus_with_neovim` test;
# edit a case, then re-record.

[[case]]
name = "ctrl_w_word"
buffer = "foo bar"
cursor = [0, 6]
keys = "A baz qux<C-w>x<Esc>"

[[case]]
name = "ctrl_w_punctuation"
buffer = "foo.bar"
cursor = [0, 6]
keys = "A(x, y)<C-w><C-w><C-w>!<Esc>"

[[case]]
name = "ctrl_w_punctuation_before_start"
buffer = "x = foo.bar"
cursor = [0, 10]
keys = "A<C-w><C-w>!<Esc>"

[[case]]
name = "ctrl_w_stops_once_at_insert_start"
