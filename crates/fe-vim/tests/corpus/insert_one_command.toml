# Insert-mode <C-o> cases for fe-vim's oracle: one normal-mode command run
# from insert (or replace) mode, then back to it, as nvim's does.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in insert_one_command.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record. Each case
# ends back in normal mode: nvim's mode between <C-o> and the command
# (`niI`) is fe-vim's normal.

[[case]]
name = "ctrl_o_motion"
buffer = "abc def"
cursor = [0, 0]
keys = "A<C-o>0X<Esc>"

[[case]]
name = "ctrl_o_word_motion"
