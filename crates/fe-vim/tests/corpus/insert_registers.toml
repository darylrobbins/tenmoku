cursor = [0, 0]
keys = "vjyGA<C-r>\"<Esc>"

[[case]]
name = "ctrl_r_multirow_linewise_autoindent"
buffer = "p q\nr s\n    abc"
cursor = [0, 0]
keys = "yjGA<C-r>\"<Esc>"

[[case]]
name = "ctrl_r_ctrl_r_literal"
