# Insert-mode <C-r>{reg} (and <C-r><C-r>, <C-r><C-o>, <C-r><C-p>) and <C-a>
# cases for fe-vim's oracle: a register's text typed as if typed or literally,
# the read-only registers, an empty one, a cancelled <C-r>, the last inserted
# text, and . and macros replaying them.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation; a key that fails is
# a case's last key. What nvim does with each is recorded in
# insert_registers.expected.json by the ignored `record_corpus_with_neovim`
# test; edit a case, then re-record.

[[case]]
name = "ctrl_a_nothing_inserted"
buffer = "abc"
cursor = [0, 0]
keys = "A<C-a>x<Esc>"


[[case]]
name = "ctrl_r_named"
buffer = "abc def"
cursor = [0, 0]
keys = "\"ayiwA <C-r>a<Esc>"

[[case]]
name = "ctrl_r_unnamed"
buffer = "abc\ndef"
cursor = [0, 0]
keys = "yiwjA <C-r>\"<Esc>"

[[case]]
name = "ctrl_r_linewise"
buffer = "abc\ndef"
cursor = [0, 0]
keys = "yyjA <C-r>\"x<Esc>"

[[case]]
name = "ctrl_r_multirow_autoindent"
