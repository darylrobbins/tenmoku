# gJ cases for fe-vim's oracle: joins without adding or removing spaces, counted,
# on the last row, over indentation and blanks, in the visual modes, with `.`
# and `u`, and cancelled by an operator. Recorded by the ignored recorder in
# tests/oracle.rs.

[[case]]
name = "gJ_two_rows"
buffer = "abc\ndef\nghi"
cursor = [0, 0]
keys = "gJ"

[[case]]
name = "gJ_count_3"
buffer = "a\nb\nc\nd"
cursor = [0, 0]
keys = "3gJ"

