# Jump cases for fe-vim's oracle: `gs{c1}{c2}` and `gS{c1}{c2}` as a motion
# (counted, case folded, `<Space>` for a blank or a line end, a same-char
# pair at a run's start), after `d` `c` `y` with and without a register, in
# `v` `V` and `<C-v>`, undone, and repeated with `.`.
# nvim has no jump, so each case's oracle_keys are what nvim is fed instead
# of keys: mark z set where this spec says the jump lands
# (`:call setpos("'z",[0,R,C,0])<CR>`, before anything else, as `:` would
# end a visual mode), then `` `z `` for the jump (in normal or a visual mode,
# and backward after an operator, exclusive as `gS` is) or `` v`z `` forward
# after an operator (inclusive, as `gs` is). The `.` cases use the
# equivalent search instead (`dv/ab<CR>` then `.`, `d?ab<CR>` for `gS`;
# patterns with no regex specials, no upper case and no wrap), as nvim's
# `.` repeats a mark motion to the same place where the jump finds the
# match again. jump_matches_neovim drops mark z and register / from nvim's
# side, which only the swap leaves.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column], keys in vim notation (a space typed as itself)
# and oracle_keys. What nvim does with each is recorded in jump.expected.json
# by the ignored `record_corpus_with_neovim` test; edit a case, then
# re-record.

[[case]]
name = "move_forward"
buffer = "one two\nthree two"
cursor = [0, 0]
keys = "gstw"
oracle_keys = ":call setpos(\"'z\",[0,1,5,0])<CR>`z"

