# The labelled jump session's cases: fastedit's own spec, after leap (nvim
# has no jump, so nothing records them). jump_spec (tests/jump_spec.rs)
# checks each.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column], window_rows (the view's height; HeadlessVim
# scrolls it to show the cursor, as nvim's window does), scroll (keys fed
# first to scroll the view, if needed), jump_on_s (`s` and `S` start the
# jump), keys in vim notation (a space typed as itself), then under
# [case.expect] the cursor, the buffer (if the keys change it), vim.mode
# and the labels the overlay shows after the keys, as [row, column, label,
# state] in text order (state preview, direct, live or concealed; a direct
# one, the match its {c2} jumps straight to, has label ""). Where pages hold
# too many to list, `live` lists the live ones and `concealed` counts the
# rest.
#
# A picked label is the counted motion, so what operators, registers, the
# visual modes and `.` do with it is checked against nvim by jump.toml.

[[case]]
name = "autojump_labels_the_rest_in_view"
buffer = "x ab\nx ab\nx ab\nx ab\nx ab\nx ab"
cursor = [0, 0]
window_rows = 4
keys = "gsab"
[case.expect]
cursor = [0, 2]
mode = "normal"
labels = [[1, 2, "s", "live"], [2, 2, "f", "live"], [3, 2, "n", "live"]]

[[case]]
name = "autojump_then_label"
buffer = "x ab\nx ab\nx ab\nx ab\nx ab\nx ab"
