# Jumplist cases for fe-vim's oracle: `<C-o>`, `<C-i>` and `<Tab>` after
# chains of `G`, `gg`, searches, `%` and mark jumps, with counts; jumps from
# one row twice; entries whose rows `dd`, `:d`, `cc` or a cut deleted, or
# that rows put in above moved; `''` and `m'` mixed in; ex commands that
# add a jump (`:s`, `:g`) and one that doesn't (`:5`); the 100-entry limit;
# and past both ends (the failing key last: nvim flushes the keys after it).
# fe-vim's `:normal` reads vim notation, so a case with `<lt>C-o>` in one
# feeds nvim a literal ctrl-o (`<C-v><C-o>`) as oracle_keys.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in jumplist.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "back_after_G"
buffer = "one\ntwo\nthree\nfour\nfive\nsix\nseven\neight"
cursor = [2, 1]
keys = "G<C-o>"

