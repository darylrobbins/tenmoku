# Blank-line cases for fe-vim's oracle: nvim's default `[<Space>` and
# `]<Space>` (`:help [<Space>`), which put [count] empty lines above or below
# the cursor's row: plain and counted, at the first, last and only row and in
# an empty buffer, the cursor's column kept, marks above, on and below the
# row, `.` with and without a new count, `u` and `<C-r>`; the keys in a visual
# mode (nvim maps them in normal mode only: `[` then `<Space>` beeps, so they
# end the case) and after an operator (cancelled).
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in line_edits.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "space_below"
buffer = "one\ntwo\nthree"
cursor = [1, 1]
keys = "]<Space>"

[[case]]
name = "space_above"
buffer = "one\ntwo\nthree"
cursor = [1, 2]
keys = "[<Space>"

[[case]]
name = "space_below_count"
