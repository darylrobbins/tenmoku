# Line-end motion cases for fe-vim's oracle: g_ (with counts, under d, in
# visual mode, failing past the last row), g$ and gm on rows shorter than the
# window and on a 209-column row soft-wrapped at 80 columns (soft_wrap), each
# in charwise visual mode. A key that fails is a case's last key.
# Edit a case, then re-record line_end_motions.expected.json with the ignored
# `record_corpus_with_neovim` test.

[[case]]
name = "g_"
buffer = "foo bar   "
cursor = [0, 0]
keys = "g_"

[[case]]
name = "g_count"
buffer = "foo bar  \nx  \nyy"
cursor = [0, 0]
keys = "2g_"

