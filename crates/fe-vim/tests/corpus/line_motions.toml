# Line and screen motion cases for fe-vim's oracle: ge gE over punctuation,
# across and onto empty rows and at the text's start; _ + - with counts and
# at the ends; | past a row's end and over a tab and a wide char; H M L in a
# window 10 rows high (window_rows) on a 30-row buffer, with counts, after
# <C-e>, dL, yH; gj gk and dgj on rows shorter than the window; each in
# visual mode, and . after d+. A key that fails is a case's last key.
# Hand-written (by a script): name, buffer (rows joined with \n, no trailing
# newline), cursor = [row, byte column], keys in vim notation and
# window_rows. What nvim does with each is recorded in
# line_motions.expected.json by the ignored `record_corpus_with_neovim`
# test; edit a case, then re-record.

[[case]]
name = "ge_punct"
buffer = "foo.bar baz"
cursor = [0, 8]
keys = "ge"

