# `U` cases for fe-vim's oracle: changes on one row then U, UU, Uu, a change
# on another row in between, an insert session, x with a count, rows added,
# deleted, joined and put, the caret's column, and . after U. The harness
# loads a buffer as a change on its first row, which nvim keeps as a U line
# there, so the cases change the second row on, and the two with no U line
# to find clear it first (oracle_keys). A key that fails is a case's last
# key except where noted.
# Hand-written (by a script): name, buffer (rows joined with \n, no trailing
# newline), cursor = [row, byte column], keys in vim notation and
# oracle_keys. What nvim does with each is recorded in
# line_undo.expected.json by the ignored `record_corpus_with_neovim` test;
# edit a case, then re-record.

[[case]]
name = "U_after_x"
buffer = "zero\none two three\nfour five six\nseven eight\nnine ten"
cursor = [2, 5]
keys = "xU"

