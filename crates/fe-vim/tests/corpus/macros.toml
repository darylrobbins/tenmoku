# Macro cases for fe-vim's oracle: `q{a-z}` recording keys typed in every
# mode (insert-mode text with `<Esc>` and `<CR>`, a search, an ex line, a
# visual selection) into a register, `qA` appending, `@a` with a count and
# `@@` playing them, a macro stopping at a failing motion or search, `"ap`
# of a recorded macro, a yank into a register then `@a`, `.` after `@a` and
# recursive macros ending when a motion fails. Every case stops recording.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in macros.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "record_x_j"
buffer = "abc\ndef\nghi"
cursor = [0, 0]
keys = "qaxjq"

