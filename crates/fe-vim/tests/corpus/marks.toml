# Mark cases for fe-vim's oracle: `m{a-z}` with `'` and `` ` `` as motions,
# after an operator and in the visual modes; `''` and `` `` `` after the
# jumps (`:5` isn't one); a mark whose row was deleted (E20, so the case ends
# there) or that text put in or taken out moved; `'<` and `` `> `` after a
# visual mode; and marks in an ex range.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in marks.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "quote_a"
buffer = "one\n  two\nthree\nfour"
cursor = [1, 4]
keys = "majj'a"

[[case]]
name = "backtick_a"
