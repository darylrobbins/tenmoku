# The `'[`, `']`, `'.` and `'^` marks and the uppercase marks for
# fe-vim's oracle: `` `[ `` and `` `] `` after `yiw`, `yy`, `p`, `P`
# (charwise and linewise), `dw`, `dd`, `cw…<Esc>`, `>>`, `x` and a visual
# `d`, and `'[` and `']` linewise; `` `. `` after changes and after undo;
# `` `^ `` after `i…<Esc>` and `A…<Esc>`; `mA` with its `'A`, `` `A `` and
# `d'A`, and rows put in or taken out above the marks. An unset mark's
# jump is a case's last key (nvim flushes the keys after it). nvim's
# buffer starts with `'.` on its first row (setting the lines is a
# change), so no case jumps to `'.` before one.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in marks_special.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

