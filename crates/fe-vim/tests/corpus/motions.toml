# Motion cases for fe-vim's oracle. Hand-written: name, buffer (rows joined
# with \n, no trailing newline), cursor = [row, byte column] and keys in vim
# notation. What nvim does with each is recorded in motions.expected.json by
# the ignored `record_corpus_with_neovim` test; edit a case, then re-record.

# h and l stay on the line.
[[case]]
name = "h_moves_left"
buffer = "hello world"
cursor = [0, 4]
keys = "h"

[[case]]
name = "h_with_count"
buffer = "hello world"
cursor = [0, 8]
keys = "3h"

[[case]]
name = "h_stops_at_line_start"
