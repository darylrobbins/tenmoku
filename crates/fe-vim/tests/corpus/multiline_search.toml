# Cases for fe-vim's oracle of searches whose pattern matches across rows
# (`\n`, `\_s`, `\_.`, `\_[...]`): / and ? landing on a match that crosses
# rows, n and N after them, counts, wrapping round an end of the text, the
# offsets e (on a match's last character, which is the line break for one
# ending in one), s and line offsets measured from the match's start and
# end, an operator over a search (d, c, y, inclusive with e) and a search
# extending a visual selection. A failing search is a case's last key.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in multiline_search.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "slash_across_rows"
buffer = "abc\ndef"
cursor = [0, 0]
keys = "/c\\nd<CR>"

[[case]]
name = "question_across_rows"
buffer = "abc\ndef"
cursor = [1, 2]
keys = "?c\\nd<CR>"

[[case]]
name = "n_next_across"
