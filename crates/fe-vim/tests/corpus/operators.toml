# Operator cases for fe-vim's oracle: d y > < over motions of each class,
# the exclusive adjustments, counts, x X D and ; ,. Hand-written: name,
# buffer (rows joined with \n, no trailing newline), cursor = [row, byte
# column] and keys in vim notation. What nvim does with each is recorded in
# operators.expected.json by the ignored `record_corpus_with_neovim` test;
# edit a case, then re-record.

