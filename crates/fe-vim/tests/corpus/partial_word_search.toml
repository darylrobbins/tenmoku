# Partial-word search cases for fe-vim's oracle: g* and g# (`*` and `#`
# without the \< \> boundaries) with counts, n, an operator, the / register,
# a keyword beside punctuation, visual mode, a punctuation run, and `` back;
# g* on a blank row fails and is the last case. Hand-written; what nvim does
# is recorded in partial_word_search.expected.json by the ignored
# `record_corpus_with_neovim` test.

[[case]]
name = "g_star"
buffer = "foo foobar foo barfoo"
cursor = [0, 0]
keys = 'g*'

[[case]]
name = "count_g_star"
buffer = "foo foobar foo barfoo"
cursor = [0, 0]
keys = '2g*'

[[case]]
name = "g_star_n"
buffer = "foo foobar foo barfoo"
cursor = [0, 0]
keys = 'g*n'

[[case]]
name = "g_hash"
buffer = "foo foobar foo barfoo"
cursor = [0, 11]
keys = 'g#'

[[case]]
name = "dg_star"
buffer = "foo foobar foo barfoo"
cursor = [0, 0]
keys = 'dg*'

[[case]]
name = "g_star_register_put"
buffer = "foo foobar foo barfoo"
cursor = [0, 0]
keys = 'g*"/p'

[[case]]
name = "g_hash_register_put"
buffer = "foo foobar foo barfoo"
cursor = [0, 11]
keys = 'g#"/p'

[[case]]
name = "g_star_keyword_beside_punct"
buffer = "a.b a.bc"
cursor = [0, 0]
keys = 'g*'

[[case]]
name = "vg_star"
buffer = "foo foobar foo barfoo"
cursor = [0, 0]
keys = 'vg*'

[[case]]
name = "g_hash_n"
buffer = "foo foobar foo barfoo"
cursor = [0, 11]
keys = 'g#n'

[[case]]
name = "g_star_jump_back"
buffer = "foo foobar foo barfoo"
cursor = [0, 0]
keys = 'g*``'

[[case]]
name = "g_star_punct_run"
buffer = "a.. b ..c"
cursor = [0, 1]
keys = 'g*'

[[case]]
name = "g_star_after_star"
buffer = "foo foobar foo barfoo"
cursor = [0, 0]
keys = '*g*'

[[case]]
name = "g_star_blank_row"
buffer = "foo\n\nfoo"
cursor = [1, 0]
keys = 'g*'
