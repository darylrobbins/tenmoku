# Register cases for fe-vim's oracle: named a-z and A-Z appends, _, the
# numbered shift, - and 0, and p and P charwise and linewise with counts and
# named registers. Hand-written: name, buffer (rows joined with \n, no
# trailing newline), cursor = [row, byte column] and keys in vim notation.
# What nvim does with each is recorded in registers.expected.json by the
# ignored `record_corpus_with_neovim` test; edit a case, then re-record.

# Named registers a-z, and A-Z appending.
[[case]]
name = "named_yank"
buffer = "abc def"
cursor = [0, 0]
keys = "\"ayw"

[[case]]
name = "named_yank_leaves_0"
buffer = "abc\ndef"
cursor = [0, 0]
keys = "yy\"bjyw"

[[case]]
name = "named_delete_line_also_writes_1"
buffer = "one\ntwo\nthree"
cursor = [0, 0]
keys = "\"add"

[[case]]
name = "named_small_delete_skips_minus"
buffer = "abc def"
cursor = [0, 0]
keys = "\"adw"

[[case]]
name = "named_replaces"
buffer = "abc def"
cursor = [0, 0]
keys = "\"aywW\"ayw"

[[case]]
name = "append_charwise"
buffer = "abc"
cursor = [0, 1]
keys = "\"ayl\"Ayl"

[[case]]
name = "append_lines_to_chars"
buffer = "abc"
cursor = [0, 1]
keys = "\"ayl\"Ayy"

[[case]]
name = "append_chars_to_lines"
buffer = "abc"
cursor = [0, 1]
keys = "\"ayy\"Ayl"

[[case]]
name = "append_to_empty"
buffer = "abc"
cursor = [0, 0]
keys = "\"Qyw"

[[case]]
name = "uppercase_reads_lowercase"
buffer = "abc"
cursor = [0, 0]
keys = "\"ayl\"Ap"

# The black hole _.
[[case]]
name = "black_hole_delete"
buffer = "abc def"
cursor = [0, 0]
keys = "yw\"_dw"

[[case]]
name = "black_hole_line"
buffer = "abc\ndef"
cursor = [0, 1]
keys = "\"_dd"

[[case]]
name = "black_hole_put"
buffer = "abc"
cursor = [0, 0]
keys = "yl\"_p"

