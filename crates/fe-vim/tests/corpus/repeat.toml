# Dot-repeat cases for fe-vim's oracle: the last change and the text its
# insert session typed, with and without a new count; a yank isn't a change
# (`d3w"ayy.`); a put from a numbered register takes the next one. No case
# starts with `.`, and every `.` follows a change in its own case: nvim keeps
# the last change from case to case. Hand-written: name, buffer (rows joined
# with \n, no trailing newline), cursor = [row, byte column] and keys in vim
# notation. What nvim does with each is recorded in repeat.expected.json by
# the ignored `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "d3w_yank_dot"
buffer = "one two three four five six seven\nsecond line here\nthird foo line"
cursor = [0, 0]
keys = "d3w\"ayy."

[[case]]
name = "ciw_then_dot_on_next_row"
buffer = "four five\nsecond line\nthird foo line"
cursor = [1, 7]
keys = "ciwXY<Esc>j0w."

