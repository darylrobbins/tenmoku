# Replace-mode cases for fe-vim's oracle: `R` over a row and past its end,
# with a count, with `<CR>` (and `<C-j>`) splitting the row, `<BS>` putting
# back what was overwritten and taking out what was appended or a line break,
# over multibyte, combining and tab graphemes (a combining mark after a line
# break joining its indentation's last blank, which `<BS>` takes with it),
# `.` after `R`, `u` after it,
# and a macro recording it. Every case ends in normal mode. Hand-written:
# name, buffer (rows joined with \n, no trailing newline), cursor = [row,
# byte column] and keys in vim notation. What nvim does with each is
# recorded in replace.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

