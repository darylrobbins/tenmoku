# Scroll cases for fe-vim's oracle: <C-d> and <C-u> with and without a
# count (the count persisting as 'scroll'), at the buffer's ends, <C-e> and
# <C-y> pushing the cursor, <C-f> and <C-b>, zz zt zb z<CR> z. z-, with and
# without a count, near the top and bottom rows, and the keys in visual
# mode. Every case has a 60-row buffer and a window 10 rows high
# (window_rows), so nvim records the window's top row too; 'scrolloff' is
# nvim's default, 0. Hand-written: name, buffer (rows joined with \n, no
# trailing newline), cursor = [row, byte column], keys in vim notation and
# window_rows. What nvim does with each is recorded in scroll.expected.json
# by the ignored `record_corpus_with_neovim` test; edit a case, then
# re-record.

