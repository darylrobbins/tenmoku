# Cases for fe-vim's oracle of n, N, * and #: over the last search after / and
# ?, with counts and wrapping, as motions, operator targets and in visual
# modes (nvim's own mappings make `*` and `#` search the selection there,
# so they aren't cased), and the keyword under or after the caret. Hand-written: name, buffer
# (rows joined with \n, no trailing newline), cursor = [row, byte column] and
# keys in vim notation. What nvim does with each is recorded in
# search_next.expected.json by the ignored `record_corpus_with_neovim` test;
# edit a case, then re-record.

[[case]]
name = "n_after_slash"
buffer = "a foo b foo c foo"
cursor = [0, 0]
keys = "/foo<CR>n"

