# Cases for fe-vim's oracle of search offsets (`:help search-offset`):
# /pat/e, e+N, e-N, s+N, b-N, +N, -N and ?pat?e, with n and N after each,
# across row ends, with counts, //e and /<CR>, under d, c and y, in v, with
# `.`, and what *, #, :s, :g and ex addresses (:/pat/, //, bare / and ?, \&)
# do to the offset; n and N going on past an offset cut short at the text's
# ends, empty matches with e (counted over mixed empty and non-empty matches
# too), and a visual cursor past a row's end. A failing search is a case's
# last key. Hand-written: name, buffer (rows joined with \n, no trailing
# newline), cursor = [row, byte column] and keys in vim notation. What nvim
# does with each is recorded in search_offset.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

