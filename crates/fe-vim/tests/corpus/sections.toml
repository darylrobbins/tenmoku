# Section cases for fe-vim's oracle: `]]` `[[` `][` `[]` plain (`plain_`),
# counted, past the last section and from a `{` row; after an operator
# (`op_`), where `]]` also stops below a `}`, and the `.` repeat; in the
# visual modes (`visual_`); the jump mark (`jump_`), set by a motion that
# moves and not by one that fails (seen through `:norm!`, whose failure
# doesn't flush the keys after it); and text with no `{` or `}` in the
# first column (`none_`), where a count that runs out fails and stops a
# macro. A key that fails is a case's last key: nvim flushes the keys after
# it.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in sections.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.


# C-style: `{` and `}` rows 3 and 5, 8 and 10; the last row is `// end`.
[[case]]
name = "plain_next"
buffer = "int a;\n\nint f()\n{\n    x;\n}\n\nint g()\n{\n    y;\n}\n// end"
cursor = [0, 2]
keys = "]]"

[[case]]
name = "plain_back"
buffer = "int a;\n\nint f()\n{\n    x;\n}\n\nint g()\n{\n    y;\n}\n// end"
cursor = [11, 3]
keys = "[["

[[case]]
name = "plain_close_next"
buffer = "int a;\n\nint f()\n{\n    x;\n}\n\nint g()\n{\n    y;\n}\n// end"
cursor = [0, 2]
keys = "]["

[[case]]
name = "plain_close_back"
buffer = "int a;\n\nint f()\n{\n    x;\n}\n\nint g()\n{\n    y;\n}\n// end"
cursor = [11, 3]
keys = "[]"

