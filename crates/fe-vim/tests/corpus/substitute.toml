# Substitute cases for fe-vim's oracle: `:s` with and without its flags
# (g i I & n e), an empty pattern, `:s` alone, `:&`, `:&&` and normal mode's
# `&`, every replacement special, other delimiters, ranges (`%`, `'<,'>`, a
# search, a count), `u`, `<C-r>` and `.` after one, and finding nothing (a
# case ends at an error: nvim flushes the keys after it). nvim keeps its last
# substitute between cases, so a case that repeats one or uses `~` makes its
# own first. Hand-written: name, buffer (rows joined with \n, no trailing
# newline), cursor = [row, byte column] and keys in vim notation. What nvim
# does with each is recorded in substitute.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "sub_first"
buffer = "a a a\n  xa a\nb"
cursor = [0, 2]
keys = ":s/a/b/<CR>"

