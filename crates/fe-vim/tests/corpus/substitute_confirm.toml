cursor = [0, 0]
keys = ":normal :s/a/b/gc<lt>CR>y<CR>u"
oracle_keys = ':exe "normal :s/a/b/gc\ry"<CR>u'

[[case]]
name = "last_substitute_pattern_with_r"
buffer = "abc abc\nabc"
cursor = [0, 0]
keys = ':s/a/1/<CR>/c<CR>:s\&X&r<CR>j:s<CR>'
