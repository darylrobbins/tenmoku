# Substitute-with-confirm cases for fe-vim's oracle: `:s` with the `c` flag
# (`:help :s_c`), answered with `y` (replace, ask about the next), `n` (skip),
# `a` (this and every later match), `q` or `<Esc>` (stop), `l` (this one,
# then stop), keys the prompt ignores, and the caret each answer leaves; one
# `u` undoes every replacement. Every case answers until the asking ends:
# nvim waits for more keys otherwise. An error ends a case: nvim flushes the
# keys after it. Hand-written: name, buffer (rows joined with \n, no
# trailing newline), cursor = [row, byte column] and keys in vim notation;
# oracle_keys, if given, are what nvim is fed instead. What nvim does with
# each is recorded in substitute_confirm.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "no_match_fails"
buffer = "abc"
cursor = [0, 1]
keys = ":s/x/y/c<CR>"

[[case]]
name = "no_match_quiet"
buffer = "abc"
cursor = [0, 1]
keys = ":s/x/y/ce<CR>"

[[case]]
name = "yes_no_yes"
buffer = "a a a"
cursor = [0, 0]
keys = ":s/a/b/gc<CR>yny"

[[case]]
name = "all_after_no"
buffer = "a a\na"
cursor = [0, 0]
keys = ":%s/a/b/gc<CR>na"

[[case]]
name = "all_goes_to_first_non_blank"
