# `:s` with a pattern that matches across rows, where what a join leaves
# matters (T163's follow-ups): the search after a replacement that joins
# rows reads the joined line, as nvim's does, while one on the same row
# without a join reads the row as it was (with `c` too, though the prompt
# shows the replacements so far); `'<` and `'>` on rows joined through the
# last go past the text's new last row; a match `\zs` starts on a later row
# joins no row it doesn't take the line break of; and a `:g` runs no more on
# the rows its `:s` joined away. Hand-written: name, buffer (rows joined
# with \n, no trailing newline), cursor = [row, byte column] and keys in vim
# notation. What nvim does with each is recorded in
# substitute_multiline_joined.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

# The joined line.

[[case]]
name = "joined_start_anchor_after_join"
buffer = "a\nb"
cursor = [0, 0]
keys = ":%s/\\n\\|^b/X/g<CR>"

[[case]]
name = "joined_word_start_after_join"
buffer = "ab,\ncd"
cursor = [0, 0]
keys = ":%s/,\\n\\|\\<c/X/g<CR>"

[[case]]
name = "joined_without_g_goes_on"
buffer = "a,\nb,\nc"
cursor = [0, 0]
keys = ":%s/,\\n\\|^b/X/<CR>"

[[case]]
name = "joined_row_kept_before_join"
buffer = "ab b,\ncd"
cursor = [0, 0]
keys = ":%s/a\\|\\<b\\|,\\n/-/g<CR>"

[[case]]
name = "joined_next_row_after_split"
buffer = "a,\nb\nc"
cursor = [0, 0]
keys = ":%s/,\\n\\|^c/\\r/g<CR>"

# The `c` prompt's matching source.

[[case]]
name = "confirm_source_all"
buffer = "ab\ncd"
cursor = [0, 0]
keys = ":%s/a\\|\\<b\\|\\n/-/gc<CR>a"

[[case]]
name = "confirm_source_yes"
buffer = "ab\ncd"
cursor = [0, 0]
keys = ":%s/a\\|\\<b\\|\\n/-/gc<CR>yyy"

[[case]]
name = "confirm_source_yes_then_no"
buffer = "ab b\ncd"
cursor = [0, 0]
keys = ":%s/a\\|\\<b\\|\\n/-/gc<CR>ynyy"

[[case]]
name = "confirm_source_joined_line"
buffer = "ab,\ncd"
cursor = [0, 0]
keys = ":%s/,\\n\\|\\<c/X/gc<CR>y"

[[case]]
name = "confirm_source_joined_start_anchor"
buffer = "a\nb"
cursor = [0, 0]
keys = ":%s/\\n\\|^b/X/gc<CR>yy"

# Visual marks on rows joined through the last.

[[case]]
name = "visual_end_join_split"
buffer = "a,\nb,\nc"
cursor = [0, 0]
keys = "jvj<Esc>gg:%s/,\\n/\\r\\r/g<CR>"

[[case]]
name = "visual_end_join_split_confirm"
buffer = "a,\nb,\nc"
cursor = [0, 0]
keys = "jvj<Esc>gg:%s/,\\n/\\r\\r/gc<CR>yy"

[[case]]
name = "visual_end_join_split_confirm_quit"
buffer = "a,\nb,\nc"
cursor = [0, 0]
keys = "jvj<Esc>gg:%s/,\\n/\\r\\r/gc<CR>yq"

[[case]]
name = "visual_end_join_split_confirm_no_yes"
buffer = "a,\nb,\nc"
cursor = [0, 0]
keys = "jvj<Esc>gg:%s/,\\n/\\r\\r/gc<CR>nyq"

[[case]]
name = "visual_end_join_one_row_split"
buffer = "a,\nb"
cursor = [0, 0]
keys = "jv<Esc>gg:%s/,\\n/\\r\\r/<CR>"

[[case]]
name = "visual_end_join_then_split_after"
buffer = "a,\nb,c"
cursor = [0, 0]
keys = "jv<Esc>gg:%s/,\\n\\|,/\\r/g<CR>"

[[case]]
name = "visual_end_join_then_split_after_confirm"
buffer = "a,\nb,c"
cursor = [0, 0]
keys = "jv<Esc>gg:%s/,\\n\\|,/\\r/gc<CR>yy"

[[case]]
name = "visual_end_join_twice"
buffer = "a,\nb\nc"
cursor = [0, 0]
keys = "jvj<Esc>gg:%s/,\\n\\|b\\n/\\r/g<CR>"

[[case]]
name = "visual_end_join_anchor_after_join"
buffer = "a\nb"
cursor = [0, 0]
keys = "jv<Esc>gg:%s/\\n\\|^b/X/g<CR>"

[[case]]
name = "visual_inner_join_split"
buffer = "a,\nb,\nc\nd"
cursor = [0, 0]
keys = "jvj<Esc>gg:%s/,\\n/\\r\\r/g<CR>"

# `\zs` on a later row.

[[case]]
name = "zs_later_rows_named_mark"
buffer = "a\nb a\nb\nz"
cursor = [0, 0]
keys = "jjma:%s/a\\n\\zsb/X/g<CR>"

[[case]]
name = "zs_later_rows_visual_marks"
buffer = "a\nb a\nb\nz"
cursor = [0, 0]
keys = "jvj<Esc>:%s/a\\n\\zsb/X/g<CR>"

[[case]]
name = "zs_later_rows_marks_each_row"
buffer = "a\nb a\nb a\nb\nz"
cursor = [0, 0]
keys = "jmajmbjmc:%s/a\\n\\zsb/X/g<CR>"

[[case]]
name = "zs_later_rows_confirm"
buffer = "a\nb a\nb\nz"
cursor = [0, 0]
keys = "jjma:%s/a\\n\\zsb/X/gc<CR>yy"

[[case]]
name = "zs_later_row_then_join"
buffer = "a\nb,\nc\nz"
cursor = [0, 0]
keys = "jjma:%s/a\\n\\zsb\\|,\\n/X/g<CR>"

# `:g` and the rows its `:s` joins.

[[case]]
name = "global_join_through_end"
buffer = "a\nb"
cursor = [0, 0]
keys = ":g/^/s/a\\n\\|b//<CR>"

[[case]]
name = "global_join_raw"
buffer = "\na\nb\nc"
cursor = [0, 0]
keys = ":g/^/s/\\n//<CR>"

[[case]]
name = "global_join_rows_between"
buffer = "a,\nb,\nc\nd,\ne"
cursor = [0, 0]
keys = ":g/^/s/,\\n/;/<CR>"

[[case]]
name = "global_join_marked_row_with_a_replacement"
buffer = "a\nb\nc"
cursor = [0, 0]
keys = ":g/^/s/^a\\n/X/<CR>"
