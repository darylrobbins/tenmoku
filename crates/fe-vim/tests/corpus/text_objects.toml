# Text object cases for fe-vim's oracle: iw aw iW aW i( a( i{ a{ i" a" i'
# a' and the bracket aliases, with counts, across rows, and objects that
# don't exist. Hand-written: name, buffer (rows joined with \n, no trailing
# newline), cursor = [row, byte column] and keys in vim notation. What nvim
# does with each is recorded in text_objects.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

