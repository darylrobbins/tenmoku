# `u` and `<C-r>` swapping the lowercase marks and the last visual extent for
# those from before the change, for fe-vim's oracle: after `dd`, `:d`, `J`,
# `dG`, `:g`, `:sort`, `cc`, `o`, a visual delete, `.`, a macro, `:normal` and
# `[e`; several steps; a mark set or deleted after the change. Each `u` stays
# within the case's own changes: one past them would undo nvim's buffer setup.
# `:m` gets no `<C-r>` case: marks stay behind on the rows it moves (a known
# limit, see ex.rs), which redo shows; `[e` covers it.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in undo_marks.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "dd_deletes_the_mark"
buffer = "one\ntwo\nthree\nfour"
cursor = [1, 0]
keys = "madd"

