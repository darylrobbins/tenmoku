# Unmatched bracket cases for fe-vim's oracle: [( [{ ]) ]} with and without
# a count, across rows, from inside nested pairs, skipping a bracket inside a
# double-quoted string, with none unmatched (failing, leaving the jump mark
# unset), back with `` and '' after a jump, and in charwise and linewise
# visual mode. A key that fails is a case's last key. Operator cases wait
# for Mac T805.
# Hand-written: name, buffer (rows joined with \n, no trailing newline),
# cursor = [row, byte column] and keys in vim notation. What nvim does with
# each is recorded in unmatched_brackets.expected.json by the ignored
# `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "open_paren"
buffer = "a ( b ( c ) d ) e"
cursor = [0, 8]
keys = "[("

[[case]]
name = "open_paren_count"
buffer = "a ( b ( c ) d ) e"
cursor = [0, 8]
keys = "2[("

[[case]]
name = "close_paren"
buffer = "a ( b ( c ) d ) e"
cursor = [0, 2]
keys = "])"

[[case]]
name = "close_paren_nested"
buffer = "a ( b ( c ) d ) e"
cursor = [0, 6]
keys = "])"

[[case]]
name = "close_paren_count"
buffer = "a ( b ( c ) d ) e"
cursor = [0, 6]
keys = "2])"

[[case]]
name = "open_brace"
