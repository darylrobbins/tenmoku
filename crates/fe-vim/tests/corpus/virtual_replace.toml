# Virtual-replace cases for fe-vim's oracle: `gR` types characters that
# replace the screen columns they take (tabstop 4, 'expandtab'): over a tab
# (kept while it still reaches its stop, then consumed), a typed tab, over a
# wide character, past the row's end, `<BS>` putting back, with a count, `.`
# and `u`. No `<CR>`. Hand-written: name, buffer (rows joined with \n, no
# trailing newline), cursor = [row, byte column] and keys in vim notation.
# What nvim does with each is recorded in virtual_replace.expected.json by
# the ignored `record_corpus_with_neovim` test; edit a case, then re-record.

[[case]]
name = "over_row"
buffer = "abcd"
cursor = [0, 0]
keys = "gRxy<Esc>"

[[case]]
name = "tab_kept"
buffer = "a\tbc"
cursor = [0, 0]
keys = "gRxy<Esc>"

[[case]]
name = "tab_consumed"
buffer = "a\tbc"
cursor = [0, 0]
keys = "gRxyzw<Esc>"

[[case]]
name = "tab_consumed_then_next"
buffer = "a\tbc"
cursor = [0, 0]
keys = "gRxyzwv<Esc>"

[[case]]
name = "tab_from_col_1"
buffer = "a\tbc"
cursor = [0, 1]
keys = "gRx<Esc>"

[[case]]
name = "typed_tab"
buffer = "abc"
cursor = [0, 0]
keys = "gR<Tab>x<Esc>"

[[case]]
name = "typed_tab_midrow"
buffer = "abcdefgh"
cursor = [0, 1]
keys = "gR<Tab>x<Esc>"

[[case]]
name = "over_wide"
buffer = "日本語"
cursor = [0, 0]
keys = "gRab<Esc>"

[[case]]
