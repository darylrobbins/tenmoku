# `<CR>` in gR's virtual replace mode: the rest of the row is replaced (deleted)
# and replacing goes on at the next row, where its indentation replaces screen
# columns; a row is added only past the last one (tabstop 4, 'expandtab',
# 'autoindent'). Hand-written: name, buffer (rows joined with \n, no trailing
# newline), cursor = [row, byte column] and keys in vim notation. Recorded into
# virtual_replace_breaks.expected.json by the ignored `record_corpus_with_neovim`
# test; edit a case, then re-record.

[[case]]
name = "rest_of_row"
buffer = "abcdef\nghi"
cursor = [0, 1]
keys = "gRx<CR>y<Esc>"

[[case]]
name = "last_row_adds"
