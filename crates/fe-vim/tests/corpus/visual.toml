# Visual-mode cases for fe-vim's oracle: v and V with motions and counts,
# switching kind, o, gv, <Esc> and the '< and '> marks, each operator over a
# selection in both kinds, text objects, empty rows, multibyte and combining
# graphemes, $, counts and dot-repeat. Hand-written: name, buffer (rows
# joined with \n, no trailing newline), cursor = [row, byte column] and keys
# in vim notation. What nvim does with each is recorded in
# visual.expected.json by the ignored `record_corpus_with_neovim` test; edit
# a case, then re-record.

