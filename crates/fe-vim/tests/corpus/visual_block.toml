# O on a block one tab wide, and after $.
[[case]]
name = "cv_O_tab"
buffer = "\t\nb 中\t"
cursor = [0, 0]
keys = "<C-v>Ojy"

[[case]]
name = "cv_dollar_O"
buffer = "abcd\nab\nabcde"
cursor = [0, 1]
keys = "<C-v>jj$Oy"

[[case]]
name = "cv_dollar_O_j"
buffer = "abcd\nab\nabcde\nabcdef"
cursor = [0, 1]
keys = "<C-v>j$Ojy"

# A block appended to lines, and lines to a block, each ending in an empty row.
[[case]]
name = "cv_append_block_to_lines"
buffer = "a\nb\nx"
cursor = [2, 0]
keys = "xgg\"ayyj<C-v>j\"Ay"

[[case]]
name = "cv_append_lines_to_block"
buffer = "a\n\nb"
cursor = [0, 0]
keys = "<C-v>j\"ayG\"Ayy"

# Lines appended to characters ending in a line break.
[[case]]
name = "v_append_lines_to_chars_ending_in_break"
buffer = "abcd\nefgh\nijkl\nmnop"
cursor = [0, 1]
keys = "v$\"ayG\"Ayy"

# . from a caret whose goal is the row's end ($).
[[case]]
