# Blockwise visual mode cases for fe-vim's oracle: <C-v> and <C-q> with
# motions, o and O, every operator over a block, I and A with short and
# empty rows and $A, blocks over tabs and wide characters, blockwise
# registers put with p and P, . after a block change, and p and P in each
# visual kind with each kind of register. Hand-written: name, buffer (rows
# joined with \n, no trailing newline), cursor = [row, byte column] and keys
# in vim notation. What nvim does with each is recorded in
# visual_block.expected.json by the ignored `record_corpus_with_neovim`
# test; edit a case, then re-record.

# <C-v> and <C-q> with motions, ending in blockwise visual mode.
