buffer = "abcdef\nabcdef\nab\nabcdefgh"
cursor = [0, 1]
keys = "<C-v>jlAX<Esc>jj$."

[[case]]
name = "block_d_dot_from_dollar"
buffer = "abcdef\nabcdef\nab\nabcdefgh"
cursor = [0, 1]
keys = "<C-v>jldjj$."

[[case]]
name = "block_r_dot_from_dollar"
buffer = "abcdef\nabcdef\nab\nabcdefgh"
cursor = [0, 1]
keys = "<C-v>jlrxjj$."

