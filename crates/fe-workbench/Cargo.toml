[package]
name = "fe-workbench"
description = "fastedit's window shell: a project tree on the right dock and editor tabs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-channel.workspace = true
fe-buffer.workspace = true
fe-command.workspace = true
fe-config.workspace = true
fe-editor.workspace = true
fe-git.workspace = true
fe-vim.workspace = true
fe-gpui.workspace = true
fe-keymap.workspace = true
fe-lsp.workspace = true
fe-nav.workspace = true
fe-project.workspace = true
fe-syntax.workspace = true
# The bottom dock's terminal.
fe-terminal-view.workspace = true
fe-ui.workspace = true
kiln-platform.workspace = true
# The window's chrome: the title bar, the frame and the menu bar.
kiln-shell.workspace = true
gpui.workspace = true
libc.workspace = true
log.workspace = true

[dev-dependencies]
futures.workspace = true
# Card 1's fake server and its launcher, and the LSP types it speaks.
fe-lsp = { workspace = true, features = ["test-support"] }
lsp-types.workspace = true
# The trusted settings tests' expected configuration values.
serde_json.workspace = true
gpui = { workspace = true, features = ["test-support"] }
# The screenshots example renders with the real Metal platform.
gpui_platform = { workspace = true, features = ["test-support"] }
# The screenshots example's harness: settling, comparison and goldens.
kiln-platform = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
