[package]
name = "fe-workbench"
description = "fastedit's window shell: a project tree on the right dock and editor tabs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dunce.workspace = true
async-channel.workspace = true
fe-buffer.workspace = true
# The AI chat panel: its conversation, view, and Claude through fe-net's
# HTTPS client.
fe-chat.workspace = true
fe-chat-anthropic.workspace = true
fe-chat-view.workspace = true
fe-net.workspace = true
fe-command.workspace = true
fe-config.workspace = true
fe-editor.workspace = true
# Files too large to read open in a read-only view.
fe-fileview.workspace = true
# The bundled fonts, registered with the text system at init.
fe-fonts = { path = "../fe-fonts" }
fe-git.workspace = true
# Matching a buffer's rows to HEAD's as fe-git's blame does.
imara-diff.workspace = true
fe-vim.workspace = true
fe-gpui.workspace = true
fe-keymap.workspace = true
fe-lsp.workspace = true
# The Markdown preview's document and its view.
fe-markdown.workspace = true
fe-markdown-view.workspace = true
fe-nav.workspace = true
fe-project.workspace = true
fe-syntax.workspace = true
# A viewer's text, to put its caret on a revealed row.
fe-text.workspace = true
# The bottom dock's terminal.
fe-terminal-view.workspace = true
fe-ui.workspace = true
# The workbench's typed commands: `#[kiln::command]` expands to `::kiln::..` paths.
kiln.workspace = true
kiln-platform.workspace = true
# A plugin install prompt's plain-words warnings and its grant decisions,
# and the plugin host: its engine, cache, grants and kiln slices.
kiln-plugin.workspace = true
# The editor's plugin world, which the plugin host links plugins against.
fe-plugin.workspace = true
# The plugin host's runner: each plugin's store, with WASI, on its thread.
wasmtime.workspace = true
wasmtime-wasi.workspace = true
# The window's chrome: the title bar, the frame and the menu bar.
kiln-shell.workspace = true
gpui.workspace = true
libc.workspace = true
log.workspace = true
# The extension language servers' consent file.
# A call hierarchy item's call sites are LSP ranges.
lsp-types.workspace = true
serde.workspace = true
# A project's npm scripts, from its package.json.
# Reading GitHub's reply to Check for Updates; the tests' expected values too.
serde_json.workspace = true
# The hash of a script an extension's language server runs.
sha2 = "0.10"
toml.workspace = true
# The tests a file has, found by walking the tree its editor already parsed.
tree-sitter.workspace = true
# The columns gcc reports count display width.
unicode-width.workspace = true
# Reads inline edit's stream of updates.
futures.workspace = true
# Extensions: Install from File or Folder unpacks a .zip, a .tar.gz or a .tgz.
zip.workspace = true
tar.workspace = true
flate2.workspace = true

# Languages that are extensions by default (T427); their tests run with these.
[features]
cpp = ["fe-syntax/cpp"]
csharp = ["fe-syntax/csharp"]
kotlin = ["fe-syntax/kotlin"]
swift = ["fe-syntax/swift"]
ruby = ["fe-syntax/ruby"]
php = ["fe-syntax/php"]

# Commands run as a process tree, stopped together (src/process_group.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
# The tests' trashes go to a test trash, never the user's Trash.
fe-project = { workspace = true, features = ["test-support"] }
# Card 1's fake server and its launcher, and the LSP types it speaks.
fe-lsp = { workspace = true, features = ["test-support"] }
lsp-types.workspace = true
gpui = { workspace = true, features = ["test-support", "leak-detection"] }
# The screenshots example renders with the real Metal platform.
gpui_platform = { workspace = true, features = ["test-support"] }
# The screenshots example's harness: settling, comparison and goldens.
kiln-platform = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
# The bundled fonts' glyph advances, to tell a bundled face from a fallback.
ttf-parser = "0.25"
# The plugin host's tests build kiln-plugin's WAT fixtures.
wasmtime = { workspace = true, features = ["wat"] }

[lints]
workspace = true
