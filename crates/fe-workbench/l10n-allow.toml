# fe-workbench's literal lint (docs/decisions/xte5e7hqsw-i18n-design.md § 8).
#
# While the crate migrates, only the files in `migrated` are checked: each
# fe-workbench card (W1–W8) adds its files' lines, and W8 replaces the list
# with `all = true`.
migrated = [
    # W1: the command titles and the commands' own text.
    "src/workbench_commands.rs",
    "src/find_commands.rs",
    "src/spell_commands.rs",
    "src/task_commands.rs",
    "src/git_commands.rs",
    "src/keymaps_picker.rs",
    "src/git.rs",
    "src/git_blame.rs",
    "src/git_blame_column.rs",
    "src/git_conflicts.rs",
    "src/git_diff.rs",
    "src/git_files_picker.rs",
    "src/git_remote.rs",
    "src/git_stage.rs",
    "src/git_stash.rs",

    # W3 (rest): navigation and the pickers.
    "src/nav.rs",
    "src/nav_picker.rs",
    "src/symbol_picker.rs",
    "src/go_to_line.rs",
    "src/quick_open.rs",
    "src/harpoon.rs",
    "src/local_history_view.rs",
    "src/workbench_files.rs",
    "src/ignore_assist.rs",
    "src/buffer_picker.rs",
    "src/buffer_lines_picker.rs",
    "src/recent_picker.rs",
    "src/config_files_picker.rs",
    # The find and replace row in B3 (T557).
    "src/find_bar.rs",
    # W4: the setup wizard, the start page, the shortcuts editor and the
    # small pickers.
    "src/setup_wizard.rs",
    "src/setup_wizard_model.rs",
    "src/setup_wizard_preview.rs",
    "src/setup_launch.rs",
    "src/start_page.rs",
    "src/start_page_model.rs",
    "src/shortcuts_editor.rs",
    "src/shortcuts_recorder.rs",
    "src/encoding_picker.rs",
    "src/line_ending_picker.rs",
    "src/language_picker.rs",
    "src/theme_picker.rs",
    "src/config_problems.rs",
    # The title bar in B3 (T1538): the bar, the window chrome and the
    # branch widget's pickers.
    "src/title_bar.rs",
    "src/workbench_chrome.rs",
    "src/git_branch.rs",
    # B3 diff views: the commit diff, and the commit lists' row texts.
    "src/commit_diff_view.rs",
    "src/commit_diff.rs",
    "src/commit_rows.rs",
    # The run widget in the title bar (T1539).
    "src/run_widget.rs",
    # The sidebar's dock and its rail in B3 (T1540).
    "src/dock.rs",
    "src/dock_layout.rs",
    # The sidebar in B3 (T1541): the project tree and Structure.
    "src/project_panel.rs",
    "src/project_panel_filter.rs",
    "src/project_panel_nav.rs",
    "src/project_panel_ops.rs",
    "src/project_panel_clipboard.rs",
    "src/outline_panel.rs",
    "src/outline_panel_keys.rs",
    # The tab strip, the breadcrumbs and the pane menu in B3 (T1542).
    "src/pane.rs",
    "src/pane_toolbar.rs",
    "src/toolbar_picker.rs",
]

# The Explorer's name as its SidebarPanel const declares it, by which the
# rail orders it and tests name it: what the dock shows, its header and its
# rail button's tooltip, is `workbench-project-title` (dock.rs).

[[literal]]
file = "src/project_panel.rs"
text = "Project"
reason = "The Explorer's name in its SidebarPanel const, not shown: the dock titles it workbench-project-title"

