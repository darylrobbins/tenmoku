# Where this extension's WebAssembly grammar comes from: a commit of the
# grammar's repository, whose tree has the generated parser.c, which
# scripts/build-grammar-wasm.sh fetches and compiles.
git = "https://github.com/EmranMR/tree-sitter-blade"
# The full 40-hex commit: main's head after 0.12.3, "Merge pull request #130
# from django23/feat/conditional-attributes" (2026-08-31).
rev = "b5291d1ba207a8ebb8383b2ecb8a8a6535210a50"
# The directory holding parser.c, scanner.c and tag.h.
src = "src"
# The export tree_sitter_<grammar>, which fixes the file name
# tree-sitter-<grammar>.wasm (with - for _).
grammar = "blade"
# The other first-party languages the sample injects, which the parity test
# registers under their names: {{ }}, @php and directive parameters are
# php_only (whose heredocs bring sql).
parity_needs = ["php_only"]
