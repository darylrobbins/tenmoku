id = "tenmoku.grammar_clojure"
name = "Clojure syntax"
version = "1.0.0"
license = "CC0-1.0"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "clojure"
wasm = "tree-sitter-clojure.wasm"
extensions = ["clj", "cljs", "cljc", "edn", "bb"]
highlights = "highlights.scm"
injections = "injections.scm"
packs = ["functional", "jvm"]
earlier_patterns_win = false
line_comment = ";"
shebangs = ["bb", "clojure"]
