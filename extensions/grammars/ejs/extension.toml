id = "tenmoku.grammar_ejs"
name = "EJS syntax"
version = "0.25.0"
license = "MIT"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "ejs"
wasm = "tree-sitter-embedded-template.wasm"
extensions = ["ejs"]
block_comment = ["<%#", "%>"]
highlights = "highlights.scm"
injections = "injections.scm"
packs = ["web"]
earlier_patterns_win = true
