id = "tenmoku.grammar_elixir"
name = "Elixir syntax"
version = "1.0.0"
license = "Apache-2.0"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "elixir"
wasm = "tree-sitter-elixir.wasm"
extensions = ["ex", "exs"]
file_names = ["mix.lock"]
highlights = "highlights.scm"
injections = "injections.scm"
packs = ["functional", "web"]
earlier_patterns_win = false
line_comment = "#"
shebangs = ["elixir"]
