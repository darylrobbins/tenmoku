id = "tenmoku.grammar_elm"
name = "Elm syntax"
version = "5.9.4"
license = "MIT"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "elm"
wasm = "tree-sitter-elm.wasm"
extensions = ["elm"]
line_comment = "--"
block_comment = ["{-", "-}"]
shebangs = []
highlights = "highlights.scm"
injections = "injections.scm"
earlier_patterns_win = true
