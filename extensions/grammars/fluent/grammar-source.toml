# Where this extension's WebAssembly grammar comes from: a commit of the
# grammar's repository, whose tree has the generated parser.c, which
# scripts/build-grammar-wasm.sh fetches and compiles.
#
# mozsearch/tree-sitter-fluent (Mozilla searchfox's) is a fork of
# projectfluent/tree-sitter-fluent (Apache-2.0) with the grammar rewritten
# after the Fluent Syntax 1.0 EBNF. Upstream's 2018 grammar parses only plain
# text (any "{" is an error) and its parser.c is ABI 8, which tree-sitter 0.27
# can't load; the fork's parser.c is ABI 15 (tree-sitter-cli 0.25.4).
git = "https://github.com/mozsearch/tree-sitter-fluent"
# The full 40-hex commit: "Rewrite the grammar after the Fluent Syntax 1.0
# EBNF, with Rust bindings."
rev = "e4ff53883eb6eddc832a73452fdc3d9c46fe698d"
# The directory holding parser.c and scanner.c.
src = "src"
# The export tree_sitter_<grammar>, which fixes the file name
# tree-sitter-<grammar>.wasm (with - for _).
grammar = "fluent"
