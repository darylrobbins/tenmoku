id = "tenmoku.grammar_gomod"
name = "Go module syntax"
version = "0.5.8"
license = "MIT"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "gomod"
wasm = "tree-sitter-gomod-orchard.wasm"
file_names = ["go.mod"]
highlights = "highlights.scm"
injections = "injections.scm"
packs = ["config"]
earlier_patterns_win = true
line_comment = "//"
