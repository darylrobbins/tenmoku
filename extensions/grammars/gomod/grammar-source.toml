# Where this extension's WebAssembly grammar comes from: a commit of the
# grammar's repository, which scripts/build-grammar-wasm.sh fetches whole and
# compiles (parser.c; the grammar has no scanner). The repository is the
# GitHub mirror of the Codeberg project grammar-orchard/tree-sitter-gomod-orchard,
# the maintained fork of camdencheek/tree-sitter-go-mod, with generated files.
git = "https://github.com/grammar-orchard/tree-sitter-gomod-orchard"
# The full 40-hex commit: main's head, release 0.5.8 (2026-10-29).
rev = "97801af57aac43d45fb68dab0ac47f0d0ab18bd1"
# The directory holding parser.c, relative to the repository.
src = "src"
# The export tree_sitter_<grammar>, which fixes the file name
# tree-sitter-<grammar>.wasm (with - for _).
grammar = "gomod_orchard"
