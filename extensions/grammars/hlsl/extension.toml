id = "tenmoku.grammar_hlsl"
name = "HLSL syntax"
version = "0.2.0"
license = "MIT AND Apache-2.0"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "hlsl"
wasm = "tree-sitter-hlsl.wasm"
extensions = ["hlsl", "hlsli", "fx", "fxh"]
highlights = "highlights.scm"
injections = "injections.scm"
packs = ["shaders"]
earlier_patterns_win = false
license = "MIT"
line_comment = "//"
block_comment = ["/*", "*/"]
