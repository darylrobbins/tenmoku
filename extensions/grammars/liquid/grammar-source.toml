# Where this extension's WebAssembly grammar comes from: a commit of the
# grammar's repository, whose tree has the generated parser.c, which
# scripts/build-grammar-wasm.sh fetches and compiles.
git = "https://github.com/hankthetank27/tree-sitter-liquid"
# The full 40-hex commit: main's head, 2026-04-02.
rev = "e45dbac8c5fa95b1f0e00e7e0c04bc8855823391"
# The directory holding parser.c and scanner.c.
src = "src"
# The export tree_sitter_<grammar>, which fixes the file name
# tree-sitter-<grammar>.wasm.
grammar = "liquid"
