id = "tenmoku.grammar_nginx"
name = "Nginx config syntax"
version = "1.0.1"
license = "MIT"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "nginx"
wasm = "tree-sitter-nginx.wasm"
extensions = ["nginx", "nginxconf"]
file_names = ["nginx.conf"]
highlights = "highlights.scm"
injections = "injections.scm"
packs = ["infra"]
earlier_patterns_win = false
line_comment = "#"
