id = "tenmoku.grammar_ocaml"
name = "OCaml syntax"
version = "0.26.0"
license = "MIT"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "ocaml"
wasm = "tree-sitter-ocaml.wasm"
extensions = ["ml"]
highlights = "highlights.scm"
injections = "injections.scm"
earlier_patterns_win = false
block_comment = ["(*", "*)"]
shebangs = ["ocaml"]
