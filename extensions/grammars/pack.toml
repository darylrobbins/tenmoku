# Recorded release: grammars-2. These entries are interim; T1486 (the registry) retires them.
# Where the first-party WebAssembly grammars the app can fetch are, and what
# each must hash to. crates/fastedit/src/grammar_install.rs compiles this in,
# so a download is checked against what the app was built with.
#
# Each directory beside this file is a first-party language. base_url names a
# release tagged for the grammars, not the app's version (see
# docs/decisions/c1pt00h80c-grammar-fetch.md). A [languages.<language>] entry
# records that language's wasm in the release: its file, the wasm its
# extension.toml names, with its size and SHA-256.
#
# A language with no entry, or with an empty sha256, isn't released yet: it's
# offered, every fetch of it is refused, and its size is 0. After a grammar
# release, scripts/record-grammar-hashes.sh writes an entry for every
# directory; don't edit them by hand.

base_url = "https://github.com/darylrobbins/tenmoku/releases/download/grammars-2"

