id = "tenmoku.grammar_perl"
name = "Perl syntax"
version = "2.0.4"
license = "MIT"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "perl"
wasm = "tree-sitter-perl.wasm"
extensions = ["pl", "pm", "t", "psgi"]
highlights = "highlights.scm"
injections = "injections.scm"
packs = ["scripting"]
earlier_patterns_win = false
line_comment = "#"
shebangs = ["perl"]
