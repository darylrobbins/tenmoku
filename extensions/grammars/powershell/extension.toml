id = "tenmoku.grammar_powershell"
name = "PowerShell syntax"
version = "0.26.6"
license = "MIT"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "powershell"
wasm = "tree-sitter-powershell.wasm"
extensions = ["ps1", "psm1", "psd1"]
line_comment = "#"
block_comment = ["<#", "#>"]
shebangs = ["pwsh", "powershell"]
highlights = "highlights.scm"
injections = "injections.scm"
packs = ["shells"]
earlier_patterns_win = false
