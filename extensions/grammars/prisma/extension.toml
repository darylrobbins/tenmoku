id = "tenmoku.grammar_prisma"
name = "Prisma syntax"
version = "1.6.0"
license = "MIT"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "prisma"
wasm = "tree-sitter-prisma.wasm"
