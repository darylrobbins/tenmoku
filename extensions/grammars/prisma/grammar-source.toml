# Where this extension's WebAssembly grammar comes from: a commit of the
# grammar's repository, whose tree has the generated parser.c, which
# scripts/build-grammar-wasm.sh fetches and compiles.
#
# victorhqc/tree-sitter-prisma (MIT) is the grammar nvim-treesitter, Helix and
# Zed use. Its committed parser.c is LANGUAGE_VERSION 15; it has no external
# scanner.
git = "https://github.com/victorhqc/tree-sitter-prisma"
# The full 40-hex commit: the head of main, v1.6.0.
rev = "3556b2c1f20ec9ac91e92d32c43d9d2a0ca3cc49"
# The directory holding parser.c.
src = "src"
# The export tree_sitter_<grammar>, which fixes the file name
# tree-sitter-<grammar>.wasm (with - for _).
grammar = "prisma"
