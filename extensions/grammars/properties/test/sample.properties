# Application configuration
! The exclamation mark also starts a comment.

app.name = Tenmoku Demo
app.version=1.4.2
app.description : A small editor \
    with a continued line
app.empty

# Numbers and indexed keys
server.port = 8080
server.timeout.ms=30000
servers[0].host = alpha.example.com
servers[1].host = beta.example.com
servers[10].weight = 5

# Escapes
path.windows = C:\\Program Files\\Tenmoku
greeting = Hello\tWorld\n
unicode.name = \u3053\u3093\u306b\u3061\u306f
key\ with\ spaces = value with spaces
colon\:key = a:b=c

# Substitutions
base.dir = /opt/tenmoku
data.dir = ${base.dir}/data
log.dir = ${base.dir}/logs
home = ${HOME}
JAVA_OPTS = -Xmx512m
cache.dir = ${JAVA_OPTS}/cache
api.token = ${vault::secret/api/token}
db.password = ${env::DB_PASSWORD}

# Gradle style
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching = true
kotlin.code.style=official

# Logging
logging.level.root = INFO
logging.level.org.springframework = WARN
logging.pattern.console = %d{HH:mm:ss} [%t] %-5level %logger{36} - %msg%n
