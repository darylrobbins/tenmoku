# The grammar registry: where its index and artifacts are published, and the
# packs. crates/fe-registry reads this (fe_registry::grammars::Registry), and
# scripts/build-grammar-registry.sh builds the index from it and each
# language's directory beside it.
#
# A pack is metadata only: a named list of languages, offered together, with
# an offline tarball. Which packs a language is in is its extension.toml's
# [[contributes.grammars]] packs, never this file; the first it lists is its
# main pack. A pack no language lists isn't in the index.
#
# url_template is a file's URL, {tag} being the language's content-addressed
# tag and {file} the file's name (docs/decisions/xb65tqark9-grammar-registry-index.md).

schema = 1
url_template = "https://github.com/tenmoku-editor/registry/releases/download/{tag}/{file}"
index_url = "https://github.com/tenmoku-editor/registry/releases/download/index/index.json"
# The base64 of the Ed25519 public key index.json.sig is checked with: the
# repository variable TENMOKU_REGISTRY_PUBLIC_KEY, whose private half is the
# registry environment's secret TENMOKU_REGISTRY_PRIVATE_KEY. Not a secret,
# and not the update feed's key. `grammar-registry sign` refuses a private key
# that isn't this one's, and changing it needs an app release first
# (docs/release/grammar-registry.md, "Key rotation").
public_key = "LCH1AxJ47pBJJzrmMAr44WRCVP0cl0qVNrGc/imuwfg="

[packs.shells]
name = "Shells"
description = "Shell languages and their scripts, such as PowerShell"

