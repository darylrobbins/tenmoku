id = "tenmoku.grammar_ruby"
name = "Ruby syntax"
version = "0.23.1"
license = "MIT"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "ruby"
wasm = "tree-sitter-ruby.wasm"
extensions = ["rb", "gemspec", "rake", "ru", "podspec", "jbuilder"]
file_names = ["Gemfile", "Rakefile", "Podfile", "Vagrantfile", "Brewfile", "Guardfile", "Capfile", "Fastfile", "Dangerfile", "Appfile", "Matchfile", "Pluginfile", "Berksfile", "Thorfile", "Steepfile", ".irbrc", ".pryrc"]
highlights = "highlights.scm"
injections = "injections.scm"
packs = ["web", "scripting"]
earlier_patterns_win = false
