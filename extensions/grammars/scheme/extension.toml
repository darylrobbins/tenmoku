id = "tenmoku.grammar_scheme"
name = "Scheme syntax"
version = "1.0.0"
license = "MIT"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "scheme"
wasm = "tree-sitter-scheme.wasm"
extensions = ["scm", "ss", "sld"]
line_comment = ";"
block_comment = ["#|", "|#"]
shebangs = ["guile", "chicken", "csi"]
highlights = "highlights.scm"
injections = "injections.scm"
packs = ["functional"]
earlier_patterns_win = false
