id = "tenmoku.grammar_starlark"
name = "Starlark syntax"
version = "1.3.0"
license = "MIT"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "starlark"
wasm = "tree-sitter-starlark.wasm"
extensions = ["bzl", "star", "bazel", "sky"]
file_names = ["BUILD", "BUILD.bazel", "WORKSPACE", "WORKSPACE.bazel", "MODULE.bazel", "Tiltfile"]
highlights = "highlights.scm"
injections = "injections.scm"
packs = ["infra"]
earlier_patterns_win = false
line_comment = "#"
