# Where this extension's WebAssembly grammar comes from: this commit of the
# repository, whose tree has the generated parser.c, which
# scripts/build-grammar-wasm.sh fetches and compiles.
git = "https://github.com/tree-sitter-grammars/tree-sitter-svelte"
# The full 40-hex commit: master's head, 1.0.2 and its query changes.
rev = "ae5199db47757f785e43a14b332118a5474de1a2"
# The directory holding parser.c, and scanner.c if there is one.
src = "src"
# The export tree_sitter_<grammar>, which fixes the file name
# tree-sitter-<grammar>.wasm (with - for _).
grammar = "svelte"
