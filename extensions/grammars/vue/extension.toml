id = "tenmoku.grammar_vue"
name = "Vue syntax"
version = "0.1.0"
license = "MIT AND Apache-2.0"

[engine]
tenmoku = "1.0"

[[contributes.grammars]]
language = "vue"
wasm = "tree-sitter-vue.wasm"
extensions = ["vue"]
highlights = "highlights.scm"
injections = "injections.scm"
packs = ["web"]
earlier_patterns_win = false
block_comment = ["<!--", "-->"]
license = "MIT"
