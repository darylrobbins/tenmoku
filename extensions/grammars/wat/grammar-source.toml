# Where this extension's WebAssembly grammar comes from: a commit of the
# grammar's repository, whose tree has the generated parser.c, which
# scripts/build-grammar-wasm.sh fetches and compiles.
#
# wasm-lsp/tree-sitter-wasm holds two grammars, wat (a module) and wast (a
# script of modules and assertions, extending wat). Its wast parser reads both
# file kinds, so it backs .wat and .wast alike (Apache-2.0 WITH
# LLVM-exception). Its parser.c is ABI 13, and it has no scanner.
git = "https://github.com/wasm-lsp/tree-sitter-wasm"
# The full 40-hex commit: "Update depedencies and configs", its newest.
rev = "2ca28a9f9d709847bf7a3de0942a84e912f59088"
# The directory holding parser.c.
src = "wast/src"
# The export tree_sitter_<grammar>, which fixes the file name
# tree-sitter-<grammar>.wasm (with - for _).
grammar = "wast"
