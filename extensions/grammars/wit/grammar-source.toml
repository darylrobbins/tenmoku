# Where this extension's WebAssembly grammar comes from: a commit of the
# grammar's repository, whose tree has the generated parser.c, which
# scripts/build-grammar-wasm.sh fetches and compiles.
#
# bytecodealliance/tree-sitter-wit is the Bytecode Alliance's grammar for WIT,
# the WebAssembly component model's interface types (Apache-2.0 WITH
# LLVM-exception). Its parser.c is ABI 15.
git = "https://github.com/bytecodealliance/tree-sitter-wit"
# The full 40-hex commit: "feat(grammar): add body item supertype (#33)".
rev = "f777cdbe11281ccc68ffa30bd7ea34cdf4ddbec6"
# The directory holding parser.c and scanner.c.
src = "src"
# The export tree_sitter_<grammar>, which fixes the file name
# tree-sitter-<grammar>.wasm (with - for _).
grammar = "wit"
