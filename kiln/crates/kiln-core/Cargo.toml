[package]
name = "kiln-core"
description = "Kiln's headless core: config, app paths, platform conventions, keymaps, menus, theme data. Must not depend on GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Set here, not inherited: kiln is to be open-sourced, and its licence
# changes in one line per crate (docs/decisions/app-framework.md).
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
log.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true

# O_NONBLOCK, for opening untrusted files (src/platform/fs.rs).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
