[package]
name = "kiln-core"
description = "Kiln's headless core: config, app paths, platform conventions, keymaps, menus, theme data. Must not depend on GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Set here, not inherited: kiln stands alone (docs/framework.md).
license = "Apache-2.0"
publish = false

[dependencies]
kiln-command.workspace = true
keyring-core.workspace = true
kiln-l10n.workspace = true
log.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
unicode-segmentation.workspace = true

# O_NONBLOCK, for opening untrusted files (src/platform/fs.rs); process groups
# and signals (src/platform/process_tree.rs); `hw.memsize` on macOS (src/platform/memory.rs).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The platform keychain behind KeychainStore (src/secrets.rs); each store's
# own error is read to tell a refusal from a failure.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true
security-framework.workspace = true

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store.workspace = true
# A file's volume and index, its identity, and private directories' access
# lists, owners and the process token's user (src/platform/acl.rs); a job
# object per process tree, its thread resumed once assigned
# (src/platform/process_tree.rs); the total physical memory (src/platform/memory.rs).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
secret-service.workspace = true
zbus-secret-service-keyring-store.workspace = true

[dev-dependencies]
kiln-l10n = { workspace = true, features = ["lint"] }
proptest.workspace = true
schemars.workspace = true
tempfile.workspace = true

[lints]
workspace = true
