[package]
name = "kiln-platform"
description = "Kiln's platform layer on GPUI: capabilities, window options, prompts, dialogs, key input and command dispatch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Set here, not inherited: kiln is to be open-sourced, and its licence
# changes in one line per crate (docs/decisions/app-framework.md).
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
gpui.workspace = true
kiln-command.workspace = true
kiln-core.workspace = true
log.workspace = true
serde_json.workspace = true

[dev-dependencies]
schemars.workspace = true
serde.workspace = true
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
