[package]
name = "kiln-platform"
description = "Kiln's platform layer on GPUI: capabilities, window options, prompts, dialogs, key input and command dispatch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Set here, not inherited: kiln stands alone (docs/framework.md).
license = "Apache-2.0"
publish = false

[dependencies]
gpui.workspace = true
kiln-command.workspace = true
kiln-core.workspace = true
log.workspace = true
serde_json.workspace = true
# The screenshot harness (`test-support`): this platform's real renderer
# off screen, and PNGs for the goldens.
gpui_platform = { workspace = true, optional = true }
image = { workspace = true, optional = true }

# The frame-request watchdog's nudge and native state (src/frame_watch/macos.rs),
# through the window's NSView; both already in the lock through gpui.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"

[features]
# `kiln_platform::screenshots`, the golden-screenshot harness for examples.
test-support = ["dep:gpui_platform", "dep:image", "gpui/test-support", "gpui/leak-detection", "gpui_platform/test-support"]

[dev-dependencies]
schemars.workspace = true
serde.workspace = true
gpui = { workspace = true, features = ["test-support", "leak-detection"] }

[lints]
workspace = true
