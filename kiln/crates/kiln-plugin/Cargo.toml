[package]
name = "kiln-plugin"
description = "Runs plugins as WebAssembly components on wasmtime. Must not depend on GPUI or any application crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Set here, not inherited: kiln stands alone (docs/framework.md).
license = "Apache-2.0"
publish = false

[dependencies]
kiln-command.workspace = true
kiln-core.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
url = "2.5"
wasmtime.workspace = true
wasmtime-wasi.workspace = true

[dev-dependencies]
wasmtime = { workspace = true, features = ["wat"] }

[lints]
workspace = true
