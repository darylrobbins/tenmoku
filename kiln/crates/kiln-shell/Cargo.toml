[package]
name = "kiln-shell"
description = "Kiln's app shell on GPUI: the root view, window frame, menus, panes, docks and palette."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Set here, not inherited: kiln is to be open-sourced, and its licence
# changes in one line per crate (docs/framework.md).
license = "LicenseRef-Proprietary"
publish = false
# One integration-test binary, tests/it.rs, not one per file: build.rs lists
# tests/*.rs for it (kiln/scripts/it_mods.rs, TESTING.md).
autotests = false
build = "build.rs"

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
gpui.workspace = true
kiln-command.workspace = true
kiln-core.workspace = true
kiln-platform.workspace = true
kiln-ui.workspace = true
log.workspace = true
serde_json.workspace = true

[dev-dependencies]
kiln-platform = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support", "leak-detection"] }

# The platform's real text system, which paints glyphs; on Linux the
# windowing backends select it, as `kiln` has them.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[lints]
workspace = true
