[package]
name = "kiln-ui"
description = "Kiln's widgets for GPUI, styled by theme tokens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Set here, not inherited: kiln is to be open-sourced, and its licence
# changes in one line per crate (docs/decisions/app-framework.md).
license = "LicenseRef-Proprietary"
publish = false

# GPUI only: no workspace crate, so any host can use these.
[dependencies]
gpui.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
