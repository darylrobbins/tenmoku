[package]
name = "kiln-ui"
description = "Kiln's widgets for GPUI, styled by theme tokens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Set here, not inherited: kiln stands alone (docs/framework.md).
license = "Apache-2.0"
publish = false

# GPUI and kiln's GPUI-free core (theme data, and TextField's editing
# model): no app crate, so any host can use these.
[dependencies]
gpui.workspace = true
kiln-command.workspace = true
kiln-core.workspace = true
# Button::new's label is a kiln_l10n::Text.
kiln-l10n.workspace = true
# Button::command dispatches its action as a kiln command.
kiln-platform.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support", "leak-detection"] }
# The catalogue checks, and a fake locale (tests/l10n.rs).
inventory.workspace = true
kiln-l10n = { workspace = true, features = ["lint"] }
# The scene recorder's image type, in the coloured icon tests.
image.workspace = true
# The text inputs' accessible nodes, loaded as a platform adapter reads
# them (tests/text_input_a11y.rs): the version gpui-pre 0.3.9's AccessKit
# adapters use, already in the lock.
accesskit_consumer = "=0.38.0"

# The a11y recorder (a11y::nodes), for a dependent's tests: `cfg(test)` is
# this crate's own.
[features]
test-support = []

[lints]
workspace = true
