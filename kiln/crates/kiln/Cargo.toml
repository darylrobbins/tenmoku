[package]
name = "kiln"
description = "Kiln: a GPUI-idiomatic app framework that hides per-platform differences."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Set here, not inherited: kiln is to be open-sourced, and its licence
# changes in one line per crate (docs/framework.md).
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
gpui.workspace = true
# kiln::application(): GPUI's platform, for the app's own windows.
gpui_platform.workspace = true
kiln-command.workspace = true
kiln-core.workspace = true
# `#[kiln::command]`, and the records it submits, which `kiln::app` collects.
kiln-macros.workspace = true
inventory.workspace = true
kiln-platform.workspace = true
kiln-shell.workspace = true
kiln-ui.workspace = true
log.workspace = true
# `#[kiln::settings]`'s schema, re-exported as kiln::schemars.
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# kiln::testing: the app's temporary directories.
tempfile = { workspace = true, optional = true }

# GPUI's Linux windowing backends, so an app on kiln needs no GPUI
# dependencies of its own.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[features]
# Test support for an app's own tests and examples: the golden-screenshot
# harness, `kiln::platform::screenshots`, and `kiln::testing`, which opens
# an app headless.
test-support = ["kiln-platform/test-support", "gpui/test-support", "gpui/leak-detection", "dep:tempfile"]

# The gallery example (examples/gallery) opens a real window, and its tests
# (tests/gallery.rs) drive it headless. Its screenshots
# (examples/gallery-screenshots) use kiln's own harness. The host example
# (examples/host), an app on kiln-shell, is driven by tests/host.rs the
# same way.
[dev-dependencies]
gpui = { workspace = true, features = ["test-support", "leak-detection"] }
kiln-platform = { workspace = true, features = ["test-support"] }
# kiln's own tests (tests/testing.rs) use kiln::testing: this turns its
# `test-support` on for them, so the workspace gate builds and runs them.
kiln = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
