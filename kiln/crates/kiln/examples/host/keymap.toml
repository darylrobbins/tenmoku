# The chat's keymap: one file for every platform. `secondary` is cmd on
# macOS and ctrl elsewhere. The window's commands apply anywhere in its
# root context, `chat`; sending only in a conversation. kiln's own keys
# (the command palette, quitting, the menus and the palette's) are under
# these.

[[bindings]]
keys = "secondary-n"
command = "chat.new_conversation"
context = "chat"

[[bindings]]
keys = "secondary-enter"
command = "chat.send_message"
context = "conversation"

[[bindings]]
keys = "secondary-w"
command = "chat.close_conversation"
context = "chat"

[[bindings]]
keys = "secondary-\\"
command = "chat.split_right"
context = "chat"

[[bindings]]
keys = "secondary-b"
command = "chat.toggle_conversations"
context = "chat"

[[bindings]]
keys = "secondary-shift-t"
command = "chat.toggle_theme"
context = "chat"
