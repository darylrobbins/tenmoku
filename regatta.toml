# Regatta configuration for fastedit. See ~/code/regatta/docs/guide/configuration.md.
#
# Lanes live under .worktrees/. A local .worktrees/.cargo/config.toml (not tracked)
# points them at one shared target directory, so GPUI is built once rather than per lane.
# Verification snapshots (.worktrees/.verify/<id>) build in their own target/ instead:
# a workspace crate has the same artifact name in every worktree and cargo trusts mtimes,
# so concurrent snapshots sharing a target used each other's builds. scripts/ci-env.sh
# sets that up; every command below runs through it. It also puts cargo (rustup, in
# ~/.cargo/bin) on PATH.
version = 2
base_branch = "main"
worktree_root = ".worktrees"

[specs]
dir = "docs/specs"
commit = true

[timeouts]
# A cold build of GPUI takes several minutes.
setup = "20m"
stage = "30m"
review = "15m"

[[components]]
name = "fastedit"
path = "."
stack = "rust-cargo"
[components.commands]
fmt = 'scripts/ci-env.sh cargo fmt --all --check'
vet = 'scripts/ci-env.sh cargo clippy --workspace --all-targets -- -D warnings'
build = 'scripts/ci-env.sh cargo build --workspace --all-targets'
# JUnit lands in target/nextest/ci/junit.xml (.config/nextest.toml), where the stack reads it.
test = 'scripts/ci-env.sh cargo nextest run --workspace --profile ci'
test_one = 'scripts/ci-env.sh cargo nextest run --workspace --profile ci -E "test(={test})"'
no_gpui = 'scripts/ci-env.sh scripts/check-no-gpui.sh'
syntax_features = 'scripts/ci-env.sh scripts/check-syntax-features.sh'
# Licenses, bans and sources only: advisories need the network and run in CI.
deny = 'scripts/ci-env.sh cargo deny check licenses bans sources'

[pipeline]
gate = ["fmt", "vet", "build", "test", "no_gpui", "syntax_features", "deny"]
fast = ["fmt", "vet", "test"]
post_merge = ["build", "test"]
# Cargo serialises on the shared target directory anyway.
max_parallel = 2

[[pipeline.stages]]
name = "fmt"
run = "fmt"

[[pipeline.stages]]
name = "vet"
run = "vet"

[[pipeline.stages]]
name = "build"
run = "build"

[[pipeline.stages]]
name = "test"
run = "test"
needs = ["build"]

[[pipeline.stages]]
name = "no_gpui"
run = "no_gpui"
when = { paths = ["**/Cargo.toml", "Cargo.lock", "scripts/check-no-gpui.sh"] }

[[pipeline.stages]]
name = "syntax_features"
run = "syntax_features"
needs = ["vet"]
when = { paths = ["crates/fe-syntax/**", "Cargo.lock", "scripts/check-syntax-features.sh"] }

[[pipeline.stages]]
name = "deny"
run = "deny"
when = { paths = ["**/Cargo.toml", "Cargo.lock", "deny.toml"] }

[merge]
strategy = "squash"
# The only approval the user wants (2026-10-05) is for licenses that would stop fastedit being
# sold commercially. The gate's cargo-deny check fails any dependency whose license isn't on
# deny.toml's permissive allowlist, so widening that allowlist is the one path that needs a
# person. Regatta also always asks for regatta.toml and .github/workflows/**.
max_changed_lines = 1000000
size_exclude = ["**/tests/**", "**/tests.rs", "**/testdata/**", "**/golden/**", "docs/**", "**/*.md", "**/proptest-regressions/**"]
human_paths = ["deny.toml"]
human_flags = []
dependencies = "auto"
adoption = "auto"

[scopes]
# Any task may add lines to these without claiming them, so tasks that add a crate or a
# dependency run in parallel; a change to an existing line is still a scope expansion.
# Regatta's four defaults are repeated because setting the key replaces them.
shared_append_only = [
  "docs/recovery.md", "docs/compat.md", "docs/recovery/**", "docs/compat/**",
  "Cargo.toml", "Cargo.lock", "crates/fastedit/Cargo.toml",
]

[caps]
# Lanes share one target dir (see top), so each costs little disk; builds queue on its lock.
lanes_max = 3

[review]
on_finish = true

# Medium and larger tasks run on Opus at high effort.
[[routing.rules]]
when = { complexity = ["m", "l", "xl"] }
tier = "deep"
