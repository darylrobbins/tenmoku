# Regatta configuration for fastedit. See ~/code/regatta/docs/guide/configuration.md.
#
# Lanes live under .worktrees/ and each builds in its own target/ (rgt sets CARGO_TARGET_DIR
# per lane); sccache shares compiled dependencies between them. Verification snapshots
# (.worktrees/.verify/<id>) also build in their own target/. scripts/ci-env.sh sets that up
# and caps cargo at CARGO_BUILD_JOBS=6; every command below runs through it. It also puts
# cargo (rustup, in ~/.cargo/bin) on PATH.
version = 2
base_branch = "main"
worktree_root = ".worktrees"

[specs]
dir = "docs/specs"
commit = true

[timeouts]
# A cold build of GPUI takes several minutes.
setup = "20m"
stage = "30m"
# Codex timed out twice at 15m reviewing T174's ~1,500-line diff (2026-10-08).
review = "30m"

[[components]]
name = "fastedit"
path = "."
stack = "rust-cargo"
[components.commands]
fmt = 'scripts/ci-env.sh cargo fmt --all --check'
vet = 'scripts/ci-env.sh cargo clippy --workspace --all-targets -- -D warnings'
build = 'scripts/ci-env.sh cargo build --workspace --all-targets'
# JUnit lands in target/nextest/ci/junit.xml (.config/nextest.toml), where the stack reads it.
test = 'scripts/ci-env.sh cargo nextest run --workspace --profile ci'
test_one = 'scripts/ci-env.sh cargo nextest run --workspace --profile ci -E "test(={test})"'
no_gpui = 'scripts/ci-env.sh scripts/check-no-gpui.sh'
syntax_features = 'scripts/ci-env.sh scripts/check-syntax-features.sh'
# Licenses, bans and sources only: advisories need the network and run in CI.
deny = 'scripts/ci-env.sh cargo deny check licenses bans sources'

[pipeline]
gate = ["fmt", "vet", "build", "test", "no_gpui", "syntax_features", "deny"]
fast = ["fmt", "vet", "test"]
post_merge = ["build", "test"]
# Each lane has its own target/; ci-env.sh caps cargo at 6 jobs apiece. 1 stage at a time since 2026-10-10
# (user-approved): the Mac hit load 150+ with several gates at once.
max_parallel = 1

[[pipeline.stages]]
name = "fmt"
run = "fmt"

[[pipeline.stages]]
name = "vet"
run = "vet"

[[pipeline.stages]]
name = "build"
run = "build"

[[pipeline.stages]]
name = "test"
run = "test"
needs = ["build"]

[[pipeline.stages]]
name = "no_gpui"
run = "no_gpui"
when = { paths = ["**/Cargo.toml", "Cargo.lock", "scripts/check-no-gpui.sh"] }

[[pipeline.stages]]
name = "syntax_features"
run = "syntax_features"
needs = ["vet"]
when = { paths = ["crates/fe-syntax/**", "Cargo.lock", "scripts/check-syntax-features.sh"] }

[[pipeline.stages]]
name = "deny"
run = "deny"
when = { paths = ["**/Cargo.toml", "Cargo.lock", "deny.toml"] }

[merge]
strategy = "squash"
# The only approval the user wants (2026-10-05) is for licenses that would stop fastedit being
# sold commercially. The gate's cargo-deny check fails any dependency whose license isn't on
# deny.toml's permissive allowlist, so widening that allowlist is the one path that needs a
# person. Regatta also always asks for regatta.toml and .github/workflows/**.
max_changed_lines = 1000000
size_exclude = ["**/tests/**", "**/tests.rs", "**/testdata/**", "**/golden/**", "docs/**", "**/*.md", "**/proptest-regressions/**"]
human_paths = ["deny.toml"]
human_flags = []
dependencies = "auto"
adoption = "auto"

[scopes]
# Any task may add lines to these without claiming them, so tasks that add a crate or a
# dependency run in parallel; a change to an existing line is still a scope expansion.
# Regatta's four defaults are repeated because setting the key replaces them.
shared_append_only = [
  "docs/recovery.md", "docs/compat.md", "docs/recovery/**", "docs/compat/**",
  "Cargo.toml", "Cargo.lock", "crates/fastedit/Cargo.toml",
  "PERF.md", "THIRD_PARTY.md",
]

[caps]
# Each lane has its own target/ (see top), so every lane costs a full build dir of disk (several GiB);
# sccache shares the compiled dependencies, and ci-env.sh caps cargo at 6 jobs per build.
# 2 since 2026-10-10 (user-approved), down from 4: the Mac hit load 150+, and more lanes run on neon's own
# board. Disk headroom is guarded by scripts/ci-env.sh (T158).
lanes_max = 2

[review]
on_finish = true

# No automatic escalation when review rounds run out (2026-10-08, user-approved): T174's escalation
# to max-effort Opus re-read a 2,000-line file at 400k tokens of context, and a card that keeps
# failing review is usually too big. Exhaustion now goes to a person (findings_override), and the
# lead splits, respecs, or files the rest as a follow-up.
[routing]
escalate_on = ["gate_failed_3x"]

# Review follow-ups run on Sonnet whatever their size: their specs name each fix, and as of
# 2026-10-07 they were 38% of tasks. The first matching rule wins, so this comes first.
[[routing.rules]]
when = { labels = ["follow-up"] }
tier = "standard"

# Medium and larger tasks run on Opus at high effort.
[[routing.rules]]
when = { complexity = ["m", "l", "xl"] }
tier = "deep"
