# XcodeGen spec for the XCUITest suite (T1661's spike, grown into E2E-1 by T1682): one
# macOS UI-testing bundle that drives a bundled Tenmoku.app from outside, with real OS
# input. Its tests are in TenmokuE2E/ (SmokeTests.swift, the helpers in Support.swift,
# each test's fixture in Fixtures.swift).
#
# Nothing here is committed generated output: scripts/e2e-macos.sh runs
#   xcodegen generate --spec tools/e2e-macos/project.yml --project <target>/e2e-macos
# and builds and tests that project, with derived data beside it. The app under
# test is not a target here: the script bundles it and hands its path to the test
# runner (TEST_RUNNER_E2E_APP), which launches it with XCUIApplication(url:). The
# script also passes CODE_SIGN_ENTITLEMENTS: one read-write exception, for the run's
# scratch folder, which Xcode merges into the sandboxed runner's entitlements.
name: TenmokuE2E
options:
  bundleIdPrefix: dev.tenmoku
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    # Ad-hoc ("Sign to Run Locally"): no team, no provisioning profile.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  TenmokuE2E:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: TenmokuE2E
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tenmoku.e2e.tests
schemes:
  TenmokuE2E:
    build:
      targets:
        TenmokuE2E: [test]
    test:
      targets:
        - TenmokuE2E
