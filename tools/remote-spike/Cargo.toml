[package]
name = "remote-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Throwaway spike for remote development (T1986): framed multiplexing over a child's stdio. Not shipped; no crate depends on it."

# Its own workspace, so it is not a member of fastedit's and nothing there can depend on it.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
postcard = { version = "1", features = ["use-std"] }
# The encodings postcard is measured against (`remote-spike codec`).
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
prost = "0.14"
