[package]
name = "tree-sitter-git-rebase"
description = "git-rebase-todo grammar for tree-sitter (vendored from the-mikedavis/tree-sitter-git-rebase)"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/the-mikedavis/tree-sitter-git-rebase"
edition = "2021"
publish = false
autoexamples = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

# Keeps cargo from walking up to an outer workspace (a gate checkout lives
# inside the repo): this crate is its own empty workspace root.
[workspace]
