[package]
name = "tree-sitter-json5"
description = "JSON5 grammar for tree-sitter (vendored from Joakker/tree-sitter-json5)"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/Joakker/tree-sitter-json5"
edition = "2021"
publish = false
autoexamples = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

# Keeps cargo from walking up to an outer workspace (a gate checkout lives
# inside the repo): this crate is its own empty workspace root.
[workspace]
