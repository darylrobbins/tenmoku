[package]
name = "tree-sitter-just"
description = "just grammar for tree-sitter (vendored from casey/tree-sitter-just)"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/casey/tree-sitter-just"
edition = "2021"
publish = false
autoexamples = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

# Keeps cargo from walking up to an outer workspace (a gate checkout lives
# inside the repo): this crate is its own empty workspace root.
[workspace]
